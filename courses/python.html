/* ===== Raydex Learn visual refinement (appended, wins cascade) ===== */
:root{--rl-r:12px;--rl-r-sm:8px;--rl-line:var(--line);--rl-mute:var(--mute)}
.card,.whybox,.term-card,.ed,.win,.out,.inrow,.help,.hintbox,.sum,.analogy,.mistakes,.todo,.cap,.panel-like{
  border-radius:var(--rl-r)!important}
.card{border:1px solid var(--rl-line);box-shadow:0 1px 2px rgba(23,25,29,.04),0 8px 24px rgba(23,25,29,.05)}
.card:hover{box-shadow:0 1px 2px rgba(23,25,29,.04),0 12px 32px rgba(23,25,29,.08)}
.btn{border-radius:var(--rl-r-sm);font-weight:600;letter-spacing:.01em;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.alt{border:1px solid var(--rl-line);background:var(--card)}
.btn.alt:hover{border-color:var(--field);color:var(--field)}
.ed{border:1px solid var(--rl-line);border-radius:var(--rl-r);overflow:hidden;background:var(--card)}
.ed textarea{font-size:14px;line-height:1.65;padding:14px 16px}
.gut{background:var(--soft);color:var(--mute);border-right:1px solid var(--rl-line)}
.win,.out{background:var(--plate);color:var(--plate-ink);border-radius:var(--rl-r-sm);font:13px/1.6 var(--f-mono)}
.out{border:1px solid var(--plate-line)}
.chip{border-radius:99px;font-weight:600}
.tag{border-radius:var(--rl-r-sm);font-weight:700;letter-spacing:.06em}
.hero{border-radius:var(--rl-r)}
.hero.lh{padding:28px clamp(18px,4vw,36px) 8px}
.hero.lh h1{font-size:clamp(1.7rem,4.5vw,2.4rem)}
.hero.lh .num{font-size:clamp(2.6rem,7vw,3.6rem)}
.part{padding:34px 0}
h2{font-size:1.4rem}
h3{font-size:1.08rem}
.whybox,.sum,.analogy{border-left-width:4px}
input[type=checkbox]{accent-color:var(--field);width:16px;height:16px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
nav.side a{border-radius:var(--rl-r-sm)}
nav.side a.on{box-shadow:0 1px 3px rgba(0,0,0,.18)}
@media (max-width:900px){
  nav.side a{border-radius:99px;border:1px solid var(--rl-line)}
  nav.side a.on{border-color:var(--field)}
}

<title>Raydex Learn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=IBM+Plex+Mono:wght@400;600&family=Lexend:wght@400;600&display=swap">
<style>
/* Layout concept: a friendly notebook. A dark header and code panels sit on a pale sage page.
   Amber marks effort and rewards, green marks progress. */
:root{
--bg:#F6F5F1;--card:#FFFFFF;--ink:#17191D;--mute:#5B6A62;--line:#E4E2DA;
--field:#315C50;--field-ink:#ffffff;--field-soft:#E9EDE9;
--grain:#a85f00;--grain-soft:#f9ecd0;
--bad:#b0341f;--bad-soft:#f8e0da;--ok:#1c7a43;
--plate:#13201a;--plate-ink:#e4efe7;--plate-mute:#8aa595;--plate-line:#26392e;--plate-ok:#7be3a4;--plate-warn:#ffc070;--plate-err:#ff9d88;
--hdr:#17191D;--hdr-ink:#eaf3ec;--hero:#1F2A24;--hero-ink:#f2f7f3;--hero-grid:rgba(255,255,255,.07);--hero-hi:#ffc870;
--focus:#d98a0b;
--f-display:"Manrope",system-ui,"Segoe UI",Arial,sans-serif;
--f-body:"Inter",system-ui,"Segoe UI",Arial,sans-serif;
--f-mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#111315;--card:#191D20;--ink:#F0F1EE;--mute:#A5ACA9;--line:#2A2E33;
--field:#66c78b;--field-ink:#06150c;--field-soft:#1F2A24;
--grain:#f0b04a;--grain-soft:#2A2417;
--bad:#ff8c78;--bad-soft:#2A1B18;--ok:#6fd49a;
--plate:#0B0D0E;--plate-line:#262B2F;--hdr:#0B0D0E;--hero:#16211C;--focus:#f0b04a;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#111315;--card:#191D20;--ink:#F0F1EE;--mute:#A5ACA9;--line:#2A2E33;
--field:#66c78b;--field-ink:#06150c;--field-soft:#1F2A24;
--grain:#f0b04a;--grain-soft:#2A2417;
--bad:#ff8c78;--bad-soft:#2A1B18;--ok:#6fd49a;
--plate:#0B0D0E;--plate-line:#262B2F;--hdr:#0B0D0E;--hero:#16211C;--focus:#f0b04a;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);padding-left:0;padding-right:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:30}
a{color:var(--field)}
code{font:0.88em var(--f-mono);background:var(--field-soft);color:var(--ink);padding:.08em .35em;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:700}
p{margin:.6em 0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;left:-9999px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--hdr);color:var(--hdr-ink)}
.top-in{display:flex;align-items:center;gap:12px;min-height:56px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font:800 1.02rem var(--f-display);font-stretch:115%;letter-spacing:.01em;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:8px;font-size:.82rem}
.bar{width:120px;height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--hero-hi);transition:width .35s}
.pill{background:rgba(255,255,255,.12);border-radius:99px;padding:3px 11px;font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.hb{background:rgba(255,255,255,.12);color:var(--hdr-ink);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.85rem}
.top a.hb{text-decoration:none}
.hb:hover{background:rgba(255,255,255,.22)}
.hb.is-on{background:rgba(255,200,112,.18);border:1px solid rgba(255,200,112,.45);color:var(--hdr-ink);box-shadow:inset 0 0 0 1px rgba(255,200,112,.1)}
#menu{display:none}

/* shell */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
nav.side{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 84px);overflow:auto;padding-right:8px;font-size:.92rem}
nav .grp{font:700 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:18px 0 6px;padding-inline:10px}
nav .grp:first-child{margin-top:0}
nav a{display:flex;gap:9px;align-items:center;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.3}
nav a:hover{background:var(--field-soft)}
nav a.on{background:var(--field);color:var(--field-ink);font-weight:600}
nav a .n{font:600 .78rem var(--f-mono);width:1.7em;color:var(--mute);flex:none}
nav a.on .n{color:inherit}
.ring{--p:0;width:18px;height:18px;border-radius:50%;flex:none;margin-left:auto;background:conic-gradient(var(--field) calc(var(--p)*1%),var(--line) 0);position:relative}
.ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg)}
nav a.on .ring::after{background:var(--field)}
nav a.on .ring{background:conic-gradient(var(--field-ink) calc(var(--p)*1%),rgba(255,255,255,.3) 0)}
.ring.full{background:var(--field)}
.ring.full::after{content:"\2713";inset:0;background:none;color:var(--field-ink);font-size:.7rem;display:grid;place-items:center;font-weight:800}
nav a.on .ring.full{background:var(--field-ink)}
nav a.on .ring.full::after{color:var(--field)}
main{min-width:0;max-width:820px;width:100%}

/* callouts */
.sum{background:var(--field-soft);border-radius:12px;padding:14px 18px;margin:16px 0}
.analogy{background:var(--grain-soft);border-radius:12px;padding:14px 18px;margin:16px 0}
.pat{background:var(--grain-soft);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.92rem}
.tag{display:inline-block;font:700 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;color:var(--field)}
.analogy .tag,.pat b:first-child{color:var(--grain)}
.mistakes{background:var(--bad-soft);border-radius:12px;padding:14px 18px;margin:16px 0}
.mistakes .tag{color:var(--bad)}
.mistakes ul{margin:.3em 0 0;padding-left:1.2em}
.explain{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:2px 16px;margin:8px 0 0;font-size:.95rem}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:28px clamp(18px,4vw,36px);margin-bottom:18px;background-image:linear-gradient(var(--hero-grid) 1px,transparent 1px),linear-gradient(90deg,var(--hero-grid) 1px,transparent 1px);background-size:28px 28px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);font-weight:900;font-stretch:118%;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--hero-hi)}
.hero p{max-width:56ch;color:var(--hero-ink);opacity:.92}
.hero .row{margin-top:16px}
.hero .btn{background:var(--hero-hi);color:#1c1200}
.hero .btn.alt{background:transparent;color:var(--hero-ink);border:1px solid rgba(255,255,255,.4)}
.num{font:900 4.2rem/1 var(--f-display);font-stretch:125%;color:var(--hero-hi);opacity:.95;letter-spacing:-.03em}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.meta span{background:rgba(255,255,255,.14);border-radius:99px;padding:2px 12px;font-size:.8rem}
.goals{margin:10px 0 0;padding-left:1.2em}
.goals li{margin:2px 0}

/* sections */
.part{margin:34px 0 0}
.part>h2{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.part>h2 small{font:500 .85rem var(--f-body);color:var(--mute)}
.lede{color:var(--mute);margin:0 0 10px}
.read h3{margin:22px 0 4px}
.read ul,.read ol{padding-left:1.3em}
.read li{margin:.3em 0}
.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;min-width:300px;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 .75rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
pre.snip{background:var(--plate);color:var(--plate-ink);border-radius:10px;padding:12px 14px;margin:12px 0;overflow-x:auto;font:13px/1.6 var(--f-mono);position:relative}
.cp{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.12);color:var(--plate-ink);border:0;border-radius:6px;padding:2px 9px;font-size:.72rem;cursor:pointer}
.cp:hover{background:rgba(255,255,255,.24)}
details{margin:8px 0}
summary{cursor:pointer;color:var(--field);font-weight:600}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.term{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem}
.term b{display:block;font-family:var(--f-mono);font-size:.84rem;color:var(--field)}

/* illustration */
.il{margin:14px 0;display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center}
.il .box{background:var(--card);border:2px solid var(--field);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.9rem;text-align:center}
.il .arrow{color:var(--grain);font-weight:900;padding:0 4px}
.il .kv{background:var(--card);border:2px solid var(--field);border-radius:10px;padding:8px 14px;min-width:110px}
.il .kv small{display:block;color:var(--mute);font-size:.75rem}
.il .kv b{font:700 1.05rem var(--f-mono)}
.il .cell{background:var(--card);border:2px solid var(--field);width:70px;padding:6px 0;text-align:center;font:600 .95rem var(--f-mono);border-radius:6px}
.il .cell small{display:block;color:var(--grain);font:600 .68rem var(--f-body)}
.ilc{color:var(--mute);font-size:.85rem;margin:-6px 0 10px}

/* buttons */
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.btn{background:var(--field);color:var(--field-ink);border:0;border-radius:9px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:.92rem;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:transparent;color:var(--field);border:1.5px solid var(--field)}
.btn.gold{background:var(--grain);color:#fff}
:root[data-theme="dark"] .btn.gold{color:#1c1200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.gold{color:#1c1200}}
.btn.sm{padding:5px 11px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}

/* code editor */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.card>.ct{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.card>.ct b{font-family:var(--f-display);font-stretch:110%;font-size:1.02rem}
.chip{font-size:.74rem;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--mute);font-weight:600;white-space:nowrap}
.chip.p{background:var(--field);color:var(--field-ink)}
.chip.f{background:var(--grain);color:#fff}
.ed{display:flex;background:var(--plate);border-radius:10px;overflow:hidden;margin:8px 0;border:1px solid var(--plate-line)}
.ed .gut{padding:12px 8px 12px 10px;color:var(--plate-mute);font:13px/20px var(--f-mono);text-align:right;user-select:none;min-width:38px;overflow:hidden;white-space:pre}
.ed textarea{flex:1;min-width:0;background:transparent;color:var(--plate-ink);border:0;padding:12px 12px 12px 4px;font:13px/20px var(--f-mono);resize:none;white-space:pre;overflow-x:auto;overflow-y:hidden;tab-size:4;height:auto;outline:none}
.ed:focus-within{border-color:var(--focus)}
.ed textarea::selection{background:rgba(240,176,74,.35)}
.out{background:var(--plate);color:var(--plate-ink);border-radius:10px;padding:10px 14px;margin:6px 0;white-space:pre-wrap;word-break:break-word;font:13px/1.55 var(--f-mono);min-height:0;border:1px solid var(--plate-line)}
.out:empty{display:none}
.out .ok{color:var(--plate-ok)}.out .bad{color:var(--plate-warn)}.out .err{color:var(--plate-err)}
.inrow{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap;background:var(--grain-soft);padding:8px 12px;border-radius:10px}
.inrow input{flex:1;min-width:120px;background:var(--card);border:1.5px solid var(--grain);border-radius:8px;padding:6px 10px;color:var(--ink)}
.help{background:var(--bad-soft);border-radius:10px;padding:8px 14px;margin:6px 0;font-size:.9rem}
.hintbox{background:var(--grain-soft);border-radius:10px;padding:8px 14px;margin:6px 0;font-size:.92rem}
.solbox{margin:6px 0}
.term-card{background:var(--plate);color:var(--plate-ink);border-radius:10px;padding:10px 14px;margin:8px 0;font:13px/1.6 var(--f-mono);overflow-x:auto;white-space:pre}
.term-card::before{content:"On your computer";display:block;font:700 .68rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--plate-warn);margin-bottom:4px}

/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;margin:6px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--field)}
.opt.good{border-color:var(--ok);background:var(--field-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{font-size:.92rem;color:var(--mute);margin:4px 0 0}
.q{border-top:1px solid var(--line);padding:10px 0}
textarea.log{width:100%;min-height:96px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.todo label{display:flex;gap:10px;padding:5px 0;cursor:pointer;align-items:flex-start}
.todo input{margin-top:.38em;accent-color:var(--field)}
.ms{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.ms b{flex:1;font-weight:600;font-size:.92rem}
.cap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}
.win{background:var(--field);color:var(--field-ink);border-radius:10px;padding:12px;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font:800 1.6rem var(--f-display);font-stretch:112%;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--mute)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{font-family:var(--f-display);font-stretch:108%}
.tile small{color:var(--grain);font-weight:700}
.phase{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.phase .pb{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 10px}
.phase .pb i{display:block;height:100%;background:var(--field)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips a{font:600 .78rem var(--f-mono);padding:3px 9px;border-radius:7px;background:var(--field-soft);color:var(--ink);text-decoration:none}
.chips a.d{background:var(--field);color:var(--field-ink)}
.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
.steps li{counter-increment:s;display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--field);color:var(--field-ink);display:grid;place-items:center;font:700 .85rem var(--f-mono)}
.steps li>div{min-width:0}
.search{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;margin:8px 0 14px}
.entry{padding:10px 0;border-bottom:1px solid var(--line)}
.entry b{font-family:var(--f-mono);color:var(--field)}
#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.tst{background:var(--plate);color:var(--plate-ink);border-left:4px solid var(--hero-hi);border-radius:8px;padding:9px 16px;font-size:.9rem;box-shadow:0 6px 22px rgba(0,0,0,.28);animation:pop .25s}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

@media (max-width:900px){
.shell{display:block}
nav.side{display:none;position:fixed;left:0;right:0;top:calc(56px + env(safe-area-inset-top,0px));bottom:0;max-height:none;background:var(--card);z-index:36;padding:16px max(16px,env(safe-area-inset-left,0px)) 40px calc(16px + env(safe-area-inset-left,0px));border-top:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 18px 50px rgba(16,40,26,.22);overscroll-behavior:contain}
body.nav-open nav.side{display:block}

["What a program is",`<p>A program is a list of instructions. The computer follows them one at a time, from the top line to the bottom line, and it never skips a line unless you tell it to. That is the first big idea: <b>order matters</b>.</p><p>Python is the language you will use to write those instructions. It reads a lot like English, which makes it a friendly first language. Most code boxes here run a beginner-friendly subset of Python in the browser, so you can try an idea as you read. Examples marked <b>On your computer</b> use normal Python and may need packages or files that the browser runner cannot load.</p>`],
["Variables: names for values",`<p>A <b>variable</b> is a name attached to a value, like a label on a jar. When you write <code>price = 12.5</code> you are saying: make a label called price and attach the number 12.5 to it.</p><ul><li>The <code>=</code> sign means <b>store</b>. It does not mean "is equal to". Python works out the right side first, then stores the result under the name on the left.</li><li>Names can use letters, digits and underscores. They cannot start with a digit or contain spaces. Capital letters matter, so <code>Price</code> and <code>price</code> are two different names.</li><li>Pick names that say what the value is, and put the unit in the name when there is one: <code>price_usd</code>, <code>temp_c</code>. Your future self will thank you.</li></ul>`],
["The four basic kinds of value",`<p>Every value has a <b>type</b>. Python treats each type differently, so learn these four.</p>`+tb(["Type","Meaning","Example"],[["<code>int</code>","whole number","<code>4</code>"],["<code>float</code>","number with a decimal point","<code>12.5</code>"],["<code>str</code>","text, always inside quotes","<code>\"notebook\"</code>"],["<code>bool</code>","True or False","<code>price &lt;= 15</code>"]])+`<p>The text <code>"4"</code> and the number <code>4</code> look alike but are not the same thing. You can add two numbers, but you cannot add a number to text.</p>`],

["Questions your program can ask",`<p>A <b>condition</b> is a question with a True or False answer. You build conditions with comparison operators.</p>`+tb(["Write","Means","Example"],[["<code>==</code>","equal to","<code>colour == \"red\"</code>"],["<code>!=</code>","not equal to","<code>status != \"done\"</code>"],["<code>&lt;  &gt;</code>","less than, greater than","<code>temp &gt; 30</code>"],["<code>&lt;=  &gt;=</code>","at most, at least","<code>age &lt;= 12</code>"]])+`<p>Join conditions with <code>and</code> (both must be true), <code>or</code> (at least one) and <code>not</code> (flip the answer). Remember: one <code>=</code> stores a value, two <code>==</code> compare.</p>`],

sec:[
["Why functions exist",`<p>When you find yourself copying the same lines again and again, write them once as a <b>function</b>. A function is a named recipe. You give it inputs, it follows its steps and hands back an answer. Fix the recipe once and every place that uses it is fixed.</p><pre class="snip">def discount_percent(original, sale):
    return (original - sale) / original * 100</pre><p><code>def</code> starts the definition. <code>original</code> and <code>sale</code> are <b>parameters</b>, the names the function uses for its inputs. The indented lines are the body.</p>`],
["Calling a function and return",`<p>Using a function is called <b>calling</b> it: <code>discount_percent(80, 64)</code>. The values you pass in are <b>arguments</b>. <code>return</code> sends the answer back so you can store it or print it.</p><p>The big beginner trap: <b>return and print are different</b>. print shows something on screen and the value is gone. return hands the value back so other code can use it. A function without a return gives back <code>None</code>.</p>`],
["Defaults and small helpers",`<p>A <b>default value</b> such as <code>minimum=20.0</code> is used when the caller does not supply one. Callers can still override it: <code>is_good_deal(15, minimum=10)</code>.</p><p>Keep each function to one job. Then build bigger functions out of small ones, the way <code>report</code> below calls <code>discount_percent</code> and <code>is_good_deal</code>. Variables created inside a function live only inside it.</p>`]],
g:[["function","A named set of steps you can reuse."],["parameter","The name a function uses for an input, written in the def line."],["argument","The actual value you pass in when you call the function."],["return","Sends an answer back from a function."],["default value","A parameter value used when the caller gives none."],["call","Running a function by writing its name with brackets."],["docstring","A one-line description in quotes at the top of a function."]],

sec:[
["What a CSV file is",`<p>CSV stands for comma-separated values. It is a plain text table. Each line is one row, and commas separate the columns. The first line holds the column names, called the <b>header</b>. Excel and Google Sheets open CSV files, and so does pandas later in this course.</p><pre class="snip">date,item,amount
2026-11-02,coffee,3.5
2026-11-03,lunch,8</pre>`],
["Splitting text apart",`<p>Python's <code>text.split(",")</code> cuts a string wherever it finds a comma and gives you a list. Splitting on a new line gives you rows. Every piece is still <b>text</b>, so wrap numbers in <code>float()</code>.</p><p><code>zip(header, values)</code> pairs two lists up, and <code>dict(...)</code> turns the pairs into a dictionary. Together they turn a row into a record you can read by column name.</p>`],
["Reading and writing real files",`<p>The boxes on this page work on text inside the program. On your own computer the same logic works on real files. The <code>with</code> block closes the file for you.</p><pre class="snip">with open("records.csv") as f:
    text = f.read()

["Errors are normal",`<p>Every programmer sees errors all day. An error message is not a punishment. It is Python telling you exactly where it got stuck. Stay calm and read it from the <b>last line</b>, which names the problem, then look at the line number.</p>`+tb(["Error","Usually means"],[["<code>SyntaxError</code>","a typo in the shape of the code: missing colon, bracket or quote"],["<code>IndentationError</code>","spaces at the start of a line do not line up"],["<code>NameError</code>","you used a name Python has not seen. Check spelling"],["<code>TypeError</code>","you mixed types, such as text + number"],["<code>ValueError</code>","right type, wrong content, such as float('abc')"],["<code>IndexError / KeyError</code>","you asked for a position or key that is not there"],["<code>ZeroDivisionError</code>","you divided by zero"]])],
["The debugging routine",`<ol><li>Read the last line of the message.</li><li>Go to the line number it gives. The real mistake is sometimes the line above.</li><li>Print the values near the problem: <code>print(x, type(x))</code>.</li><li>Change one thing, then run again.</li><li>Still stuck? Explain the problem out loud, line by line. It works more often than you would think.</li></ol>`],
["Handling problems with try and except",`<p>Some problems are expected, like a user typing letters instead of a number. Wrap the risky line in <code>try</code> and say what to do in <code>except</code>. Always name the error you expect, such as <code>ValueError</code>. A bare <code>except:</code> hides real bugs.</p><p><code>None</code> is Python's way of saying "no value". Returning None from a failed conversion lets the caller decide what to do next.</p>`]],

["Modules: borrowing tools",`<p>Python comes with a big shelf of ready-made toolboxes called <b>modules</b>. You pick one up with <code>import</code>. After <code>import math</code> you can write <code>math.pi</code> or <code>math.sqrt(144)</code>. The dot means: look inside the math toolbox.</p>`+tb(["Tool","What it gives you"],[["<code>math.pi</code>","3.14159..."],["<code>math.sqrt(x)</code>","square root"],["<code>math.ceil(x)</code>","round up to a whole number"],["<code>math.floor(x)</code>","round down to a whole number"]])+`<p>Later you will import <code>pandas</code>, <code>numpy</code> and <code>matplotlib</code> the same way.</p>`],
["What an API is",`<p>An <b>API</b> is a way for one program to ask another program for something. A weather app on your phone does not measure the weather itself. It sends a <b>request</b> to a weather service and gets an <b>answer</b> back.</p><p>The answer usually comes as <b>JSON</b>: nested dictionaries and lists written as text. It looks just like the Python dictionaries you already know.</p>`],

sec:[
["Why classes exist",`<p>So far a thing in your program, like a phone, was a dictionary of facts plus separate functions that work on it. A <b>class</b> bundles the facts and the actions together in one package. Each package you make is called an <b>object</b>.</p><p>You do not need a class for everything. Use one when you have several things of the same kind, each with its own data, and the same actions apply to all of them.</p>`],
["Anatomy of a class",`<pre class="snip">class Phone:
    def __init__(self, name, battery_pct):
        self.name = name
        self.battery_pct = battery_pct

    def is_low(self, limit=20):
        return self.battery_pct &lt;= limit</pre><ul><li><code>__init__</code> runs automatically when you create an object. It stores the starting facts.</li><li><code>self</code> means "this object". <code>self.name</code> is the name belonging to this particular phone.</li><li>A function inside a class is called a <b>method</b>. You call it with a dot.</li></ul>`],
["Making and using objects",`<p>Call the class like a function to build an object: <code>ana = Phone("Ana's phone", 15)</code>. Python passes the new object in as <code>self</code> for you, so you give only the other values.</p><p>Each object has its own copy of the data. Changing <code>ana.battery_pct</code> does not touch Ben's phone.</p>`]],

sec:[
["Why calls fail",`<p>Real services are not perfect. The network drops for a second, the service is busy, or your phone has one bar. Most of these failures are brief. If you try again a moment later, it often works.</p>`],
["Retrying with a limit",`<p>A <b>retry</b> is a loop around a risky call. If it raises an error, catch it and try again. Always set a <b>limit</b> on the number of tries, or a broken service would trap your program in an endless loop.</p><p>Good programs also <b>wait longer</b> between tries (1 second, then 2, then 4). That is called backoff and it is polite to a busy service.</p>`],
["Caching: do not ask twice",`<p>If the weather in a city does not change in the next few minutes, ask once and remember the answer. A <b>cache</b> is just a dictionary: look in it first, and only call the service when the key is missing.</p><p>Caches have a catch. Stored answers get old. Decide how long an answer stays valid before you ask again.</p>`]],
g:[["retry","Trying a failed call again."],["backoff","Waiting longer after each failed try."],["cache","A stored copy of an earlier answer."],["timeout","The longest you are willing to wait for an answer."],["raise","Make Python produce an error on purpose."]],

["Why test at all?",`<p>You change a function on Tuesday. On Friday something else in your program is wrong and you have no idea why. Without tests you find out from an angry user. With tests you find out in two seconds.</p><p>A <b>test</b> calls your function with an input where <b>you already know the answer</b>, and says PASS or FAIL.</p>`],
["How to write a good test",`<ol><li>Pick an input small enough to work out in your head.</li><li>Write down the answer you expect <b>before</b> running anything.</li><li>Call the function and compare with <code>==</code>.</li><li>Add edge cases: zero, a very big number, an empty list.</li></ol><p>Never copy the function's own formula into the test. Then the test just agrees with the bug.</p>`],

["What this checkpoint is for",`<p>You now know variables, decisions, loops, lists, dictionaries, functions, errors, modules, classes, retries, tests and git. A checkpoint is where you use them <b>together</b>, so they stop being separate facts and become one skill.</p><p>You will build the <b>Everyday Calc Toolkit</b>: a handful of small tools for discounts, delivery costs, conversions and shopping baskets. It is the capstone at the bottom of this lesson.</p>`],

steps:[{h:"A menu that calls tools",c:R`def menu(choice):

c:R`# FREE BUILD: a shop receipt
# Start with this list. Keep it as it is:
items = [("Bread", 2.5, 2), ("Milk", 1.2, 3), ("Cheese", 6.0, 1)]
#
# 1. Write line_total(price, qty) that returns price * qty
# 2. Loop over the items. For each, print:  name x qty = line total
#    (round the line total to 2 decimals)
# 3. Keep a running total. After the loop print the total rounded to 2.
# Expected output:
#        Bread x2 = 5.0
#        Milk x3 = 3.6
#        Cheese x1 = 6.0
#        Total: 14.6
# Tip: build each line with  name + " x" + str(qty) + " = " + str(...)

# Write your code below this line
`,sol:R`items = [("Bread", 2.5, 2), ("Milk", 1.2, 3), ("Cheese", 6.0, 1)]

def line_total(price, qty):
    return price * qty

    lt = round(line_total(price, qty), 2)

    total += lt
print("Total:", round(total, 2))
`},

LS[12]={t:"NumPy arrays and Jupyter notebooks",s:"An array lets one instruction work on a whole set of numbers. A notebook mixes code, results and notes on one page.",
b:["A Python list holds anything. A NumPy array holds numbers of one kind, and <code>temps * 2</code> doubles every number. With a list, the same thing needs a loop.","A Jupyter notebook is a page made of cells. You run a cell, see the result right under it, and write notes between cells."],
time:40,goals:["Explain why arrays are useful for number work","Do the same operation on a whole column at once","Read what a mean and spread tell you","Know what a notebook is for"],
il:{k:"flow",d:["Python list","NumPy array","Maths on all at once"],c:"An array lets you calculate on every value in one go."},
a:"A list is a shopping bag with mixed items. An array is an egg carton: every slot holds the same kind of thing, so you can count, weigh and compare them all together.",
m:["<code>list * 2</code> repeats the list. <code>array * 2</code> doubles the numbers.","Running notebook cells out of order."],
sec:[
["Why arrays?",`<p>Imagine you have a month of daily temperatures in Celsius and want them in Fahrenheit. With a list you write a loop. With a <b>NumPy array</b> you write <code>temps * 9 / 5 + 32</code> and every value is converted at once. The useful idea is that one operation is applied to every temperature; you do not need to work each one out yourself.</p><p>NumPy is the package that nearly all Python data tools are built on, including pandas and scikit-learn. It is fast and short to write.</p>`],
["The first moves",`<pre class="snip">import numpy as np
temps = np.array([22.5, 25.0, 19.5])
temps.mean()      # average
temps.max()       # biggest
temps.std()       # spread around the mean
temps * 2         # every value doubled</pre><p>NumPy needs installing and runs on your own computer, so the first example below is for your terminal. The other examples teach the same ideas with plain Python, right here.</p>`],
["Mean and standard deviation",`<p>The <b>mean</b> is the total divided by the count. The <b>standard deviation</b> gives a rough sense of how far values tend to sit from the mean: a small one means they cluster; a large one means they are spread out.</p><p><b>Important takeaway:</b> you do not need to derive or memorise the standard-deviation formula. Recognise what the result says about the data; NumPy can calculate it for you.</p>`],
["Notebooks",`<p>A <b>Jupyter notebook</b> is a document of cells. Code cells run when you press Shift+Enter, and the result appears right underneath. Text cells hold your notes. It is the usual way to explore data, because you can see each step and change it quickly.</p><p>One trap: cells can be run in any order, so a notebook can end up depending on a cell you ran an hour ago. Before sharing, use Restart and Run All to prove it works from the top.</p>`]],
g:[["NumPy","A package for fast maths on arrays of numbers."],["array","A fixed row of numbers of one type."],["mean","The total divided by the count. The average."],["standard deviation","A measure of how spread out numbers are around the mean."],["variance","The average of the squared distances from the mean."],["Jupyter notebook","A page of code cells and notes, with results shown under each cell."],["cell","One box in a notebook that you can run."]],

print(fahrenheit)`,w:`<p><b>What is happening.</b> A list comprehension builds a new list by applying a formula to every item. It is the plain-Python version of <code>temps * 9 / 5 + 32</code>. Reading it aloud helps: "for every t in temps, give me t times 9 over 5 plus 32".</p><p><b>Try changing.</b> Convert Fahrenheit back to Celsius: <code>(f - 32) * 5 / 9</code>.</p>`},
{h:"Read a mean and spread in plain Python",c:R`cups = [2, 4, 4, 4, 5, 5, 7, 9]

print(mean, std)`,w:`<p><b>What is happening.</b> The code summarizes eight days of coffee drinking: the mean is 5 cups and the standard deviation is 2. In everyday terms, a typical day is about 2 cups away from the average. <b>Important takeaway:</b> the code applies the recipe; focus on what these summaries tell you, not on deriving the formula.</p><p><b>Try changing.</b> Change the 9 to 20 and see the reported spread jump. One unusually high day makes the data less clustered.</p>`}],

["Masks: picking values by a rule",`<p>A <b>mask</b> asks a True/False question about every value at once. Keep only the True ones and you have a smaller set. In NumPy: <code>hot = temps[temps &gt; 30]</code>. In plain Python the same idea is a comprehension with an <code>if</code>: <code>[t for t in temps if t &gt; 30]</code>.</p>`],
["Median versus mean",`<p>Sort the values. The <b>median</b> is the one in the middle. With an even count, it is the average of the two middle ones. The mean adds everything up, so a single huge value pulls it. The median ignores how big the biggest value is.</p><p>That is why house prices are quoted as medians. One mansion does not make the typical house cost more.</p>`],
["Outliers: check before you delete",`<p>An <b>outlier</b> is a value far from the others. Sometimes it is a mistake: a sensor that glitched to 999. Sometimes it is real and important: a storm. Always <b>look</b> at it and find out why before removing it, and write down what you did.</p><p>Also: random numbers in a program depend on a <b>seed</b>. Set the seed (<code>np.random.seed(42)</code>) and your results repeat exactly. Without it, every run gives different numbers.</p>`]],
g:[["mask","A True/False filter that picks values by a rule."],["median","The middle value of a sorted list."],["outlier","A value far away from the rest."],["seed","A starting number that makes random results repeatable."],["percentile","The value below which a given percent of the data falls."]],

sec:[
["Rules by hand versus rules from data",`<p>A normal program follows rules you wrote: <code>if temp &gt;= 30: print("HOT")</code>. That works when you know the rule. But what is the rule for how long a wet towel takes to dry? It depends on temperature, wind, thickness and more, and you do not know the exact formula.</p><p>With <b>machine learning</b> you give the computer many <b>examples</b> of loads and how long each really took, and it works out a rule that fits them. Then you ask it about a load it has never seen.</p>`],
["Features and labels",`<p>Every example is a row. The facts you know in advance are the <b>features</b> (often called X). The answer you want is the <b>label</b> (often called y).</p>`+tb(["layers","temp (C)","hours (label)"],[["1","30","2.6"],["2","25","4.4"],["3","15","8.1"]])+`<p>When the label is a number, the task is <b>regression</b> ("how many hours?"). When the label is a category, it is <b>classification</b> ("fast or slow?").</p>`],
["Train, test and baseline",`<p>Split your examples in two. The model learns from the <b>training set</b>. You then score it on the <b>test set</b>, examples it has never seen. That score is a useful estimate of how it may do on new examples, not a guarantee about every real case.</p><p>Before building anything clever, work out a <b>baseline</b>: always guess the average training label. If a fancy model cannot beat that, it has not shown that it adds value. The usual score is the <b>mean absolute error (MAE)</b>: the average size of the miss.</p>`]],

["R-squared",`<p><b>R-squared</b> compares your model with the baseline of always guessing the mean. A value of 1.0 means perfect predictions; 0.0 means no better than that simple baseline; below 0 means worse. Think of it as a relative score, not a percentage of answers that are correct. It has no units, so pair it with a plain error such as MAE.</p>`]],

["One pattern for every model",`<p><b>scikit-learn</b> is the standard Python package for classic machine learning. Its useful idea is that different models share the same work flow: set one up, teach it with training examples, ask it to predict, and check its answers.</p><pre class="snip">from sklearn.linear_model import LinearRegression

["What a model object really is",`<p>You already know classes from lesson 8. A model is a class. <code>__init__</code> sets it up empty. <code>fit</code> studies the training data and stores what it learned, such as a slope and intercept, on <code>self</code>. <code>predict</code> uses those stored numbers. Building your own tiny version shows there is no magic.</p>`],
["Why the common pattern matters",`<p>Because every model has fit and predict, you can compare several models in a loop with almost no extra code. Use validation or cross-validation to choose between them, and compare with a baseline. Keep the final test set untouched until you are ready for one last report; repeatedly choosing from its scores makes it less useful as an independent check.</p>`]],

["Many features, one answer",`<p>Real predictions use many facts. A drying time depends on layers, temperature and wind together. A simple way to combine them is a <b>weighted sum</b>: each feature gets a weight that says how much it matters, plus a starting value called the <b>bias</b>.</p><p><code>hours = 1.8 * layers - 0.08 * temp + 2.5</code></p><p>A model's training finds useful weights. Positive weights push the answer up and negative ones pull it down. You can read the direction of each effect without deriving how the weights were learned.</p>`],
["Why scale?",`<p>Imagine measuring how alike two people are using age (0 to 100) and income (0 to 100000). The income gap is thousands of times bigger numerically, so age would be ignored. Models that rely on distances (like nearest neighbours) or on weights suffer from this.</p><p>The fix is to put every feature on a similar scale before modelling.</p>`],
["Two ways to scale",`<ul><li><b>Min-max:</b> maps values onto a range from 0 to 1.</li><li><b>Standardise:</b> re-centres values around 0 and gives them a comparable spread.</li></ul><p>The equations are recipes for making that change; you do not need to derive them. Work out the scaling settings from the <b>training data only</b>, then reuse those same settings for test and future examples. Peeking at the test data is leakage (more in lesson 35).</p>`]],

steps:[
{h:"A memoriser versus a line",c:R`train_x = [1, 2, 3, 4, 5, 6]
train_y = [2.5, 3.5, 6.5, 7.5, 10.5, 11.5]
test_x = [1.5, 3.5, 5.5]
test_y = [3.0, 7.0, 11.0]

def memoriser(x):
    best = train_x[0]
    for t in train_x:
        if abs(t - x) < abs(best - x):
            best = t
    return train_y[train_x.index(best)]

mx = sum(train_x) / 6
my = sum(train_y) / 6
slope = sum([(a - mx) * (b - my) for a, b in zip(train_x, train_y)]) / sum([(a - mx) ** 2 for a in train_x])
intercept = my - slope * mx

def line(x):
    return slope * x + intercept

def err(f, xs, ys):
    return sum([abs(f(x) - y) for x, y in zip(xs, ys)]) / len(xs)

print("memoriser train", round(err(memoriser, train_x, train_y), 2), "test", round(err(memoriser, test_x, test_y), 2))
print("line train", round(err(line, train_x, train_y), 2), "test", round(err(line, test_x, test_y), 2))`,w:`<p><b>What is happening.</b> The data follows roughly y = 2x with wobble. The memoriser answers with the label of the nearest training example, so on the training data it is perfect (error 0.0) but on new points it copies the wobble and misses. The line is less perfect on training data, but its test error is smaller because it learned the pattern, not the noise.</p><p><b>Try changing.</b> Add noise-free test points like 2.5 and compare again.</p>`},

sec:[
["From numbers to categories",`<p>Sometimes the answer is a category, not a number: spam or not spam, fast ride or slow ride, ripe or unripe. That is <b>classification</b>. The training examples carry a label such as <code>"fast"</code>, and the model must give a label to new examples.</p>`],
["Distance: how alike are two examples?",`<p>Treat each example as a point. The distance function combines the differences across its features into one number: smaller means more alike. The code uses straight-line (Euclidean) distance; you do not need to derive the square-root formula. One practical detail matters more: scale features first so a column with large numbers does not dominate just because of its units.</p>`],
["The nearest neighbours idea",`<p>To classify a new point: measure its distance to every training point and look at the <b>k</b> closest. With k = 1 copy the closest label. With larger k, let them <b>vote</b> and take the most common label. There is no training step. The model just remembers the data, which is why the method is simple and also slow for huge data sets.</p>`]],
g:[["classification","Predicting a category."],["Euclidean distance","The straight-line distance between two points."],["k-nearest neighbours","Predict by looking at the k most similar training examples."],["vote","Choosing the most common label among neighbours."],["decision boundary","The line where predictions switch from one class to another."]],
steps:[
{h:"Distance between two examples",c:R`def distance(a, b):
    return sum([(x - y) ** 2 for x, y in zip(a, b)]) ** 0.5

print(distance([0, 0], [3, 4]))
print(round(distance([8, 2], [10, 0]), 2), round(distance([8, 2], [5, 0]), 2))`,w:`<p><b>What is happening.</b> A 3-4-5 triangle shows the idea: the distance from [0, 0] to [3, 4] is 5.0. Then two rides described by [distance in km, load in kg]. The new ride [8, 2] is 2.83 away from [10, 0] and 3.61 from [5, 0].</p>`},
{h:"One nearest neighbour",c:R`train = [([5, 0], "fast"), ([10, 0], "fast"), ([20, 10], "slow"), ([25, 10], "slow")]

def distance(a, b):
    return sum([(x - y) ** 2 for x, y in zip(a, b)]) ** 0.5

def nearest_label(train, point):
    best = train[0]
    for item in train:
        if distance(item[0], point) < distance(best[0], point):
            best = item
    return best[1]

print(nearest_label(train, [8, 2]))
print(nearest_label(train, [22, 8]))`,w:`<p><b>What is happening.</b> The training set pairs features with labels. <code>nearest_label</code> keeps the closest example seen so far. The ride [8, 2] is nearest a fast one, and [22, 8] is nearest a slow one.</p>`},
{h:"Let k neighbours vote",c:R`train = [([5, 0], "fast"), ([10, 0], "fast"), ([20, 10], "slow"), ([25, 10], "slow"), ([12, 4], "slow")]

def distance(a, b):
    return sum([(x - y) ** 2 for x, y in zip(a, b)]) ** 0.5

def knn(train, point, k):
    ordered = sorted(train, key=lambda item: distance(item[0], point))
    votes = {}
    for item in ordered[:k]:
        votes[item[1]] = votes.get(item[1], 0) + 1
    best = None
    for label in votes:
        if best is None or votes[label] > votes[best]:
            best = label
    return best

print(knn(train, [12, 3], 1), knn(train, [12, 3], 3))`,w:`<p><b>What is happening.</b> Sorting by distance puts the closest first, and <code>ordered[:k]</code> keeps the k nearest. The votes dictionary counts labels. For the ride [12, 3], the single nearest neighbour is a slow ride, but with three neighbours the majority says fast. Different k can give different answers, which is why k is a setting to choose carefully.</p>`}],

{h:"Cross-validate two models",c:R`xs = [1, 2, 3, 4, 5, 6, 7, 8, 9]
ys = [2, 4, 5, 4, 5, 7, 8, 8, 10]
k = 3

def fit_line(a, b):
    ma = sum(a) / len(a)
    mb = sum(b) / len(b)
    slope = sum([(x - ma) * (y - mb) for x, y in zip(a, b)]) / sum([(x - ma) ** 2 for x in a])
    return slope, mb - slope * ma

mean_scores = []
line_scores = []
for f in range(k):
    test_idx = list(range(f, len(xs), k))
    train_idx = [i for i in range(len(xs)) if i not in test_idx]
    tx = [xs[i] for i in train_idx]
    ty = [ys[i] for i in train_idx]
    slope, intercept = fit_line(tx, ty)
    guess = sum(ty) / len(ty)
    mean_scores.append(sum([abs(ys[i] - guess) for i in test_idx]) / len(test_idx))
    line_scores.append(sum([abs(ys[i] - (slope * xs[i] + intercept)) for i in test_idx]) / len(test_idx))
print("mean model:", round(sum(mean_scores) / k, 2))
print("line model:", round(sum(line_scores) / k, 2))`,w:`<p><b>What is happening.</b> In each round one fold is held out for testing and the other two are used for training. Each model is scored on the held-out fold. At the end the three scores are averaged. The line model has a clearly lower average error than the mean-guess baseline, so it earns its place.</p>`},

["What leakage is",`<p>Leakage is information that sneaks into training and will not exist in real use. Three common ways:</p><ul><li><b>Using the future.</b> Predicting whether a customer will cancel using a column "date cancelled".</li><li><b>Using the answer in disguise.</b> Predicting trip speed with a feature that is calculated from speed.</li><li><b>Preparing with the test set.</b> Working out scaling numbers from all the data, test set included.</li></ul>`],

{h:"Split, baseline, and a line model",c:R`distance = [5, 10, 15, 20, 25, 30, 35]

print("baseline MAE:", round(base_err, 2))

# 5. Work out the MAE of each on the test pairs
# 6. Improvement percent = (baseline - model) / baseline * 100, rounded to 1

b:["A <b>perceptron</b> computes <code>w1*x1 + w2*x2 + bias</code> and says 1 when the total is above 0, otherwise 0.","<b>Training</b>: when the answer is wrong, move each weight by <code>learning_rate * error * input</code>. Repeat over the data many times."],

sec:[
["One artificial neuron",`<p>A neuron takes several inputs, multiplies each by a <b>weight</b>, adds them up with a <b>bias</b>, and then applies a rule: if the total is above 0, output 1, otherwise output 0. That is the whole idea. It is the weighted sum from lesson 29 plus a decision.</p>`],
["Learning from mistakes",`<p>Start with weights of 0. For each training example, make a prediction. If it is right, change nothing. If it is wrong, nudge each weight toward the right answer: <code>weight += rate * error * input</code>, where error is target minus prediction. Do the same for the bias with input 1. Repeat over all the examples a few times (called epochs).</p><p><b>Important takeaway:</b> the update rule is a small adjustment after a wrong answer. You do not need to derive the equation; trace one example through prediction, comparison, and update to see the learning loop.</p>`],
["Layers, and what one neuron cannot do",`<p>A single neuron can only draw one straight dividing line. It can learn <b>AND</b> and <b>OR</b>, but never <b>XOR</b> (true when exactly one input is true). The cure is to connect neurons in <b>layers</b>: outputs of the first layer become inputs of the next. Add many layers and you have <b>deep learning</b>. Real networks use smoother decisions and clever maths to train, but the idea of weighted sums that get adjusted is the same.</p>`]],

["The shape of a request",`<p>Most AI services use a chat shape: a <b>model</b> name, a limit on length (<b>max_tokens</b>), and a list of <b>messages</b>, each with a role (<code>user</code> or <code>assistant</code>) and some text. In Python that is a dictionary containing a list of dictionaries, exactly what you practised in lessons 3 and 7. The examples on this page build and inspect sample data; they do not contact an AI service. Sending a real request needs a key and internet access, so do that with normal Python on your own computer.</p>`],
["Reading the reply",`<p>The reply comes back as nested data. The text is usually deep inside, such as <code>reply["content"][0]["text"]</code>. A careful program uses <code>.get()</code> and checks that the list is not empty, because errors and empty replies happen. Use the retry and timeout habits from lesson 9.</p>`],
["Cost, safety and honesty",`<ul><li><b>Cost.</b> Services charge by <b>tokens</b> (roughly word pieces). Use the token count and the provider's price to estimate a request cost; set a limit before you loop. The arithmetic is just a budgeting tool, not a goal to master.</li><li><b>Keys.</b> Keep keys in environment variables or a file you never commit to git.</li><li><b>Privacy.</b> Do not send other people's private data.</li><li><b>Checking.</b> Replies can be confident and wrong. Verify facts, test generated code, and keep a human responsible for important decisions.</li></ul>`]],

["What makes a project shareable",`<p>Code that runs on your laptop is not yet code someone else can use. Add these things.</p><ul><li><b>README.md</b>: what it does, how to install, how to run, an example.</li><li><b>requirements.txt</b>: the packages and versions it needs.</li><li><b>Tests</b>: so you and others can change it safely.</li><li><b>A .gitignore</b> file: so secrets, caches and virtual environments never get committed.</li><li><b>A licence</b>: what others may do with it.</li></ul>`],
["Requirements and versions",`<p>A requirements file has one package per line, such as <code>pandas==2.2.2</code>. Anyone can then run <code>pip install -r requirements.txt</code> and get the same setup. On your computer, <code>pip freeze</code> prints what is installed.</p><p>Version numbers follow <b>major.minor.patch</b>. A bug fix raises patch (1.4.2 to 1.4.3). A new feature that does not break old code raises minor (1.4.3 to 1.5.0). A change that breaks old code raises major (1.5.0 to 2.0.0), and lower numbers reset to 0.</p>`],
["Putting it online",`<p>Start small: make sure the app runs on your own computer, then choose a host that matches what you built. GitHub Pages is for simple websites; services such as Render, Railway or PythonAnywhere can run Flask apps from your repository. You do not need to deploy a large system to share a first project.</p><ul><li><b>GitHub</b>: share the code (lesson 11). GitHub Pages hosts simple websites free.</li><li><b>Hosting a web app</b>: services such as Render, Railway or PythonAnywhere run Flask apps from your repository.</li><li><b>Notebooks</b>: share as a read-only page or on a platform like Kaggle.</li><li><b>Before you share</b>: remove keys, check the README, run the tests, and add a screenshot.</li></ul><p><b>Why the checklist matters:</b> the README helps someone start, requirements tell them what to install, tests catch accidental breakage, and a <code>.gitignore</code> keeps local files and secrets out of the public copy.</p>`]],

sol:`def mean(values):\n    return sum(values) / len(values)\n\ndef median(values):\n    s = sorted(values)\n    mid = len(s) // 2\n    if len(s) % 2 == 1:\n        return s[mid]\n    return (s[mid - 1] + s[mid]) / 2\n\ndef clean_missing(rows, key):\n    known = [r[key] for r in rows if r[key] is not None]\n    m = median(known)\n    new = []\n    for r in rows:\n        c = dict(r)\n        if c[key] is None:\n            c[key] = m\n        new.append(c)\n    return new\n\ndef group_mean(rows, key, value):\n    groups = {}\n    for r in rows:\n        if r[key] not in groups:\n            groups[r[key]] = []\n        groups[r[key]].append(r[value])\n    result = {}\n    for k in groups:\n        result[k] = mean(groups[k])\n    return result\n\ndef summary(values):\n    return {'count': len(values), 'mean': mean(values), 'min': min(values), 'max': max(values)}\n\ndef fastest(rows, key):\n    best = rows[0]\n    for r in rows:\n        if r[key] < best[key]:\n            best = r\n    return best\n`,

sol:`def split(data, n_test):\n    return (data[:-n_test], data[-n_test:])\n\ndef mae(actual, predicted):\n    total = 0\n    for i in range(len(actual)):\n        total += abs(actual[i] - predicted[i])\n    return total / len(actual)\n\ndef fit_line(xs, ys):\n    n = len(xs)\n    mx = sum(xs) / n\n    my = sum(ys) / n\n    num = 0\n    den = 0\n    for i in range(n):\n        num += (xs[i] - mx) * (ys[i] - my)\n        den += (xs[i] - mx) ** 2\n    slope = num / den\n    return (slope, my - slope * mx)\n\ndef predict(model, x):\n    return model[0] * x + model[1]\n\ndef baseline_mae(train_y, test_y):\n    guess = sum(train_y) / len(train_y)\n    total = 0\n    for y in test_y:\n        total += abs(y - guess)\n    return total / len(test_y)\n`,

    if guess < secret:
        return "too low"
    if guess > secret:

def score(tries):
    return max(0, 100 - 10 * (tries - 1))

    diff = abs(secret - guess)
    if diff <= 5:
        return "hot"
    if diff <= 15:
        return "warm"
    return "cold"

    tries = 0
    for g in guesses:
        tries += 1
        if g == secret:
            return (tries, True)
    return (tries, False)

def binary_guesses(secret, low, high):
    guesses = []
    while low <= high:
        mid = (low + high) // 2
        guesses.append(mid)
        if mid == secret:
            break
        if mid < secret:
            low = mid + 1
        else:
            high = mid - 1
    return guesses

    return "ham"

    for i in range(len(actual)):
        if predicted[i] == actual[i]:

R`def distance(a, b):
    total = 0
    for i in range(len(a)):
        total += (a[i] - b[i]) ** 2
    return total ** 0.5

def nearest_labels(train, point, k):
    pairs = []
    for features, label in train:
        pairs.append((distance(features, point), label))
    pairs.sort()
    return [label for d, label in pairs[:k]]

def majority_label(labels):
    counts = {}
    for l in labels:
        counts[l] = counts.get(l, 0) + 1
    best = None
    for l in sorted(counts):
        if best is None or counts[l] > counts[best]:
            best = l
    return best

def classify_ride(train, point, k):
    return majority_label(nearest_labels(train, point, k))

def accuracy_on(train, test, k):
    right = 0
    for point, label in test:
        if classify_ride(train, point, k) == label:
            right += 1
    return right / len(test)

def best_k(train, test, ks):
    best = None
    best_acc = -1
    for k in sorted(ks):
        a = accuracy_on(train, test, k)
        if a > best_acc:
            best = k
            best_acc = a
    return best

  if(r.out.indexOf("PASS:0")>=0){S["dy_"+today()]=1;save();$("chip_dy").className="chip p";$("chip_dy").textContent="Solved";res.innerHTML='<div class="win">Solved! See you tomorrow.</div>';award("dy"+today(),10,"daily puzzle solved");head()}
  else res.innerHTML='<div class="help"><b>Not quite yet.</b> It runs, but a test gave a different answer. Try your own print() lines.</div>';break}
 case"rvans":{const c=+t.dataset.c,q=L[i].quiz[k],key=i+"_"+k,w=$("rv_"+key);S.rv=S.rv||{};const cur=S.rv[key]||{b:0};const ok=c===q[2];const iv=[0,1,2,4,8,16];const b=ok?Math.min(cur.b+1,5):0;const d=new Date(today()+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+(ok?iv[b]:0));S.rv[key]={b:b,due:d.toISOString().slice(0,10)};save();t.parentNode.querySelectorAll(".opt").forEach((x,n)=>{x.disabled=true;if(n===q[2])x.classList.add("good")});if(!ok)t.classList.add("wrong");w.textContent=(ok?"Right. Next review in "+iv[b]+" day"+(iv[b]===1?"":"s")+". ":"Not this time. It will come back soon. ")+q[3];if(ok)award("rv"+key+today(),3,"review answer");break}
 case"plopt":{PLC[i]=+t.dataset.c;t.parentNode.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));t.classList.add("sel");break}
 case"plfinish":{let right=0,first=-1;PL.forEach((li,n)=>{const q=L[li].quiz[0];if(PLC[n]===q[2])right++;else if(first<0)first=li+1});const msg=first<0?"You got them all. Skim Phase 1 quickly, then start at lesson 25 (machine learning) or open the projects.":"You got "+right+" of "+PL.length+". Start at <a href='#l"+first+"'>lesson "+first+"</a>, the first topic you missed, and skim anything before it.";$("plres").innerHTML='<div class="win">'+msg+'</div>';break}
 case"rdme":copyText(readmeFor(i),t);break;
 case"cpsum":copyText(summaryText(),t);break;
 case"certprint":try{window.print()}catch(e){toast("Printing is not available here. Take a screenshot instead.")}break;
 case"expprog":{const j=JSON.stringify(S);const ok=await cb(j);if(!ok){$("impbox").value=j;$("impres").innerHTML='<div class="help">Copy did not work here. The text is in the box. Select it and copy it yourself.</div>'}else{t.textContent="Copied";setTimeout(()=>t.textContent="Copy my progress",1400)}break}
 case"impprog":{try{const o=JSON.parse($("impbox").value);if(!o||typeof o!=="object"||Array.isArray(o))throw 1;S=o;save();$("impres").innerHTML='<div class="win">Progress restored.</div>';applyPrefs();head()}catch(e){$("impres").innerHTML='<div class="help">That does not look like progress text. Paste exactly what you copied.</div>'}break}
 }});
document.addEventListener("change",ev=>{const t=ev.target;if(t.dataset&&t.dataset.act==="big"){S.big=t.checked;save();applyPrefs()}else if(t.dataset&&t.dataset.act==="dys"){S.dys=t.checked;save();applyPrefs()}});
document.addEventListener("input",ev=>{const t=ev.target;if(t.id==="sq")searchList(t.value);else if(t.id==="cname"){S.cname=t.value;save();const e=$("certname");if(e)e.textContent=t.value||"Your name"}});

</script>

<script>
(function(){
  var st = document.getElementById('st');
  var streakValue = document.getElementById('streak-value');
  var status = document.getElementById('lesson-status');
  var pct = document.getElementById('pt');

  function syncStreak(){
    if (!st || !streakValue) return;
    var label = st.textContent && st.textContent.trim() ? st.textContent.trim() : '0 days streak';
    streakValue.textContent = label;
  }

  function syncStatus(){
    if (!status) return;
    var text = pct && pct.textContent ? pct.textContent.trim() : '0%';
    status.textContent = text === '0%' ? 'Lesson unlocked' : 'Progress ' + text;
  }

  syncStreak();
  syncStatus();

  if (st && streakValue) {
    var obs = new MutationObserver(function(){ syncStreak(); syncStatus(); });
    obs.observe(st, { childList: true, subtree: true, characterData: true });
  }
})();
</script>
