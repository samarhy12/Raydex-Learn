{t:"CSS: backgrounds, borders and shadows",s:"Colour, gradients, rounded corners and soft shadows: the details that make a page look finished.",time:35,
goals:["Fill an element with a colour or a gradient","Add borders and round corners, including a perfect circle","Write a realistic box-shadow and understand each number in it"],
sec:[["Backgrounds and gradients",`<p><code>background-color</code> fills the box. A <b>gradient</b> is a smooth blend between colours that you write instead of using a picture:</p><ul><li><code>background: linear-gradient(to right, gold, tomato);</code> blends left to right. You can also use an angle: <code>linear-gradient(135deg, #1c6a3a, #7ad79a)</code>.</li><li><code>background: radial-gradient(circle, white, #cfe3d4);</code> blends outward from the centre.</li><li>With a picture: <code>background-image: url("pic.jpg")</code>, then <code>background-size: cover</code> (fill the box, cropping if needed) or <code>contain</code> (fit it all inside), <code>background-position: center</code>, and <code>background-repeat: no-repeat</code>.</li></ul><p>This editor cannot load pictures from the internet, so the examples use gradients.</p>`],
["Borders and rounded corners",`<p><code>border: 2px solid #333;</code> reads: thickness, style, colour. Styles include <code>solid</code>, <code>dashed</code>, <code>dotted</code> and <code>double</code>. One side only: <code>border-bottom: 3px solid gold;</code>.</p><ul><li><code>border-radius: 12px;</code> rounds the corners.</li><li>On a <b>square</b>, <code>border-radius: 50%;</code> makes a perfect <b>circle</b>. This is how round profile pictures are made.</li><li><code>border-radius: 999px;</code> on a button makes a pill shape.</li><li><code>outline</code> looks like a border but takes up no space. Browsers use it for the focus ring, so never remove it without replacing it.</li></ul>`],
["Shadows",`<p><code>box-shadow: 6px 8px 12px 0 rgba(0,0,0,.25);</code> has five parts, in this order:</p><ol><li><b>x offset</b>: how far right (negative goes left).</li><li><b>y offset</b>: how far down (negative goes up).</li><li><b>blur</b>: how soft the edge is. 0 is sharp.</li><li><b>spread</b>: how much bigger or smaller than the box.</li><li><b>colour</b>: use a transparent black, <code>rgba(0,0,0,.25)</code>, for realism.</li></ol><p>Add the word <code>inset</code> to put the shadow inside. Separate several shadows with commas. <code>text-shadow</code> works the same way on text, without spread.</p><div class="tip"><b>Designer’s tip:</b> realistic shadows are soft and faint: a small offset, a big blur, a low opacity. Hard dark shadows look cheap.</div>`],
["Shadow lab",`<p>Drag the sliders and watch the code change.</p><div class="shw"><div class="shp" id="shp">my box</div></div><div class="bmctl"><label>x <input type="range" min="-30" max="30" value="6" data-sh="x" aria-label="x offset"><output id="o-shx">6px</output></label><label>y <input type="range" min="-30" max="30" value="8" data-sh="y" aria-label="y offset"><output id="o-shy">8px</output></label><label>blur <input type="range" min="0" max="60" value="12" data-sh="b" aria-label="blur"><output id="o-shb">12px</output></label><label>spread <input type="range" min="-20" max="30" value="0" data-sh="s" aria-label="spread"><output id="o-shs">0px</output></label><label>opacity <input type="range" min="0" max="100" value="25" data-sh="o" aria-label="opacity"><output id="o-sho">25%</output></label></div><pre class="pre" id="shc">box-shadow: 6px 8px 12px 0px rgba(0,0,0,0.25);</pre>`],
["Your turn",`<p>Change the gradient angle, make the radius 50%, and add a second shadow separated by a comma.</p>`]],

{t:"CSS: pseudo-classes and pseudo-elements",s:"Style an element by its state (hovered, focused, first in a list) or style a part of it (the first letter, a decoration before it).",time:30,
goals:["Style hover, focus and active states","Pick elements by position with :first-child, :nth-child and :not","Add decorative content with ::before and ::after"],
sec:[["Pseudo-classes: state and position",`<p>A <b>pseudo-class</b> (one colon) picks an element <b>when it is in a certain state or position</b>. It is a selector with a condition, like “this button, but only while the mouse is over it”.</p><ul><li><code>a:hover</code>: while the pointer is over it.</li><li><code>button:active</code>: while it is being pressed.</li><li><code>input:focus</code>: while it is selected for typing. <code>:focus-visible</code> shows only for keyboard users, which is ideal for focus rings.</li><li><code>input:checked</code> and <code>input:disabled</code>: for checkboxes and disabled boxes.</li><li><code>li:first-child</code>, <code>li:last-child</code>: by position.</li><li><code>tr:nth-child(even)</code>: every second row. This makes <b>zebra stripes</b>. Also <code>odd</code>, <code>3</code>, and formulas like <code>3n</code>.</li><li><code>a:not(.button)</code>: everything <i>except</i>.</li></ul><div class="tip"><b>Accessibility rule:</b> never write <code>outline: none</code> without giving back a visible focus style. Keyboard users need to see where they are.</div>`],
["Pseudo-elements: parts of an element",`<p>A <b>pseudo-element</b> (two colons) styles a <b>part</b> of an element, or adds a piece that is not in the HTML.</p><ul><li><code>p::first-letter</code>: the first letter, for a drop cap. <code>p::first-line</code>.</li><li><code>::before</code> and <code>::after</code>: insert decoration before or after the element’s content. They only appear if you give them <code>content</code>, even an empty one: <code>content: "";</code></li><li><code>::placeholder</code>: the hint text in an input. <code>::selection</code>: highlighted text.</li></ul><p>Example: <code>.new::after { content: " NEW"; color: crimson; }</code> adds a red word after every element with the class new, with no extra HTML.</p>`],
["Your turn",`<p>Hover the button and the links. Change the zebra colour, then add a <code>::before</code> that puts an arrow in front of each link.</p>`]],
ex:`<style>\n  .btn { background: #1c6a3a; color: white; border: 0; padding: 10px 18px; border-radius: 8px; }\n  .btn:hover { background: #2f9a5a; }\n  .btn:active { background: #0f3d20; }\n  tr:nth-child(even) { background: #eef2ec; }\n  td { padding: 6px 12px; }\n  .new::after { content: " NEW"; color: crimson; font-weight: 700; }\n</style>\n<button class="btn">Hover me</button>\n<table><tr><td>Row 1</td></tr><tr><td>Row 2</td></tr><tr><td>Row 3</td></tr><tr><td>Row 4</td></tr></table>\n<p class="new">Fresh feature</p>`,

{t:"CSS: transitions and animations",s:"Make changes glide instead of jump, and make things move on their own.",time:35,
goals:["Write a transition that smooths a hover effect","Move, scale and rotate with transform","Create a looping animation with @keyframes"],
sec:[["Transitions: smooth changes",`<p>Normally when a style changes, such as on hover, it <b>jumps</b> instantly. A <b>transition</b> makes it glide. You put it on the <b>normal</b> state, not the hover state:</p><pre class="pre">.btn {\n  background: #1c6a3a;\n  transition: background 0.3s ease;\n}\n.btn:hover {\n  background: #2f9a5a;\n}</pre><p>The parts: <b>what</b> to animate (<code>background</code>, or <code>all</code>), <b>how long</b> (<code>0.3s</code>), the <b>speed curve</b> (<code>ease</code>, <code>linear</code>, <code>ease-in-out</code>), and optionally a <b>delay</b>. Keep UI transitions between 0.15s and 0.4s. Any slower feels sluggish.</p>`],
["transform: move, scale, rotate",`<ul><li><code>transform: translateY(-4px);</code> moves up 4px. <code>translateX</code> moves sideways.</li><li><code>transform: scale(1.05);</code> grows 5%. <code>scale(0.9)</code> shrinks.</li><li><code>transform: rotate(10deg);</code> turns it.</li><li>Combine: <code>transform: translateY(-4px) scale(1.05);</code></li></ul><p>Transform does <b>not</b> push other elements around. The element moves visually, but its original space stays. It is also very smooth, which is why professionals animate <code>transform</code> and <code>opacity</code> instead of width or margin.</p>`],
["Animations: moving by themselves",`<p>A transition needs a trigger like hover. An <b>animation</b> runs on its own. First describe the steps with <code>@keyframes</code>, then attach them:</p><pre class="pre">@keyframes pulse {\n  0%   { transform: scale(1); }\n  50%  { transform: scale(1.1); }\n  100% { transform: scale(1); }\n}\n.dot {\n  animation: pulse 1.5s ease-in-out infinite;\n}</pre><p><code>animation: name duration timing iterations</code>. Use <code>infinite</code> to loop, <code>alternate</code> to play back and forth, and <code>forwards</code> to stay on the last frame.</p><div class="tip"><b>Be kind:</b> some people get dizzy from motion. Wrap strong animation in <code>@media (prefers-reduced-motion: no-preference) { ... }</code>, or switch it off with <code>reduce</code>.</div>`],
["Your turn",`<p>Hover the card. Change the duration to 1s, then change <code>ease</code> to <code>linear</code>. Make the dot spin using <code>rotate(360deg)</code>.</p>`]],
ex:`<style>\n  .card { width: 160px; padding: 20px; background: gold; border-radius: 12px; transition: transform 0.25s ease, box-shadow 0.25s ease; }\n  .card:hover { transform: translateY(-6px) scale(1.04); box-shadow: 0 14px 24px rgba(0,0,0,.25); }\n  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }\n  .dot { width: 24px; height: 24px; margin: 24px; border-radius: 50%; background: crimson; animation: pulse 1.2s ease-in-out infinite; }\n</style>\n<div class="card">Hover me</div>\n<div class="dot"></div>`,
ch:[{p:"Make .btn lift 3px and grow slightly on hover, with a smooth 0.2s transition on transform. The transition must be on .btn, not on the hover rule.",st:`<style>\n  .btn { background: #1c6a3a; color: white; border: 0; padding: 10px 18px; border-radius: 8px; }\n</style>\n<button class="btn">Hover</button>`,k:`var t=[].map.call(document.querySelectorAll('style'),function(x){return x.textContent}).join(''),a=t.match(/\\.btn\\s*\\{([^}]*)\\}/),h=t.match(/\\.btn:hover\\s*\\{([^}]*)\\}/);return [["A transition on .btn for transform lasting 0.2s",!!a&&/transition\\s*:[^;]*transform[^;]*0?\\.2s/.test(a[1])],["A .btn:hover rule that uses transform",!!h&&/transform\\s*:/.test(h[1])],["The hover moves it up (translateY) and scales",!!h&&/translateY\\(\\s*-3px/.test(h[1])&&/scale\\(/.test(h[1])],["The transition is not placed in the hover rule",!h||!/transition/.test(h[1])]]`,h:".btn { transition: transform 0.2s ease; }  .btn:hover { transform: translateY(-3px) scale(1.05); }",sol:`<style>\n  .btn { background: #1c6a3a; color: white; border: 0; padding: 10px 18px; border-radius: 8px; transition: transform 0.2s ease; }\n  .btn:hover { transform: translateY(-3px) scale(1.05); }\n</style>\n<button class="btn">Hover</button>`},
{p:"Write a @keyframes animation called spin that rotates from 0deg to 360deg, and apply it to .loader so it spins forever, taking 1 second per turn.",st:`<style>\n  .loader { width: 40px; height: 40px; border: 5px solid #ddd; border-top-color: #1c6a3a; border-radius: 50%; }\n</style>\n<div class="loader"></div>`,k:`var t=[].map.call(document.querySelectorAll('style'),function(x){return x.textContent}).join(''),l=t.match(/\\.loader\\s*\\{([^}]*)\\}/);return [["A @keyframes named spin",/@keyframes\\s+spin\\s*\\{/.test(t)],["It rotates to 360deg",/rotate\\(\\s*360deg/.test(t)],["The loader uses animation spin for 1s",!!l&&/animation[^;]*spin/.test(l[1])&&/animation[^;]*\\b1s\\b/.test(l[1])],["It repeats forever",!!l&&/infinite/.test(l[1])]]`,h:"@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }  .loader { animation: spin 1s linear infinite; }",sol:`<style>\n  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }\n  .loader { width: 40px; height: 40px; border: 5px solid #ddd; border-top-color: #1c6a3a; border-radius: 50%; animation: spin 1s linear infinite; }\n</style>\n<div class="loader"></div>`}],
quiz:[["Where should the transition property be written?",["On the hover rule","On the normal state of the element","On the body only"],1,"Put it on the normal rule so the change glides both in and out."],["Which properties are best to animate for smooth motion?",["width and margin","transform and opacity","font-family"],1,"Transform and opacity animate smoothly and do not shift other elements."]]},

{t:"CSS: variables and dark mode",s:"Write a colour once and use it everywhere, then re-theme your whole site by changing a few lines.",time:30,
goals:["Define a custom property on :root and use it with var()","Explain why variables make a site easy to re-theme","Add automatic dark mode with prefers-color-scheme"],
sec:[["Say it once",`<p>Imagine your brand green appears 40 times in your CSS. If you change your mind, you must find and edit 40 places. <b>CSS variables</b>, properly called <b>custom properties</b>, solve this. You store a value once under a name that starts with <code>--</code>, then use it by name:</p><pre class="pre">:root {\n  --brand: #1c6a3a;\n  --radius: 12px;\n}\n.btn { background: var(--brand); border-radius: var(--radius); }\nh1   { color: var(--brand); }</pre><p><code>:root</code> means the whole page, so everything can read the variable. Change <code>--brand</code> once and every use updates. A fallback goes second: <code>var(--brand, green)</code>.</p>`],
["Scope: override in one place",`<p>A variable can be changed inside any element, and only that element and its children see the new value:</p><pre class="pre">.warning { --brand: crimson; }</pre><p>Every <code>var(--brand)</code> inside <code>.warning</code> is now red. This is how a single button component can have several colour versions.</p>`],
["Dark mode in a few lines",`<p>Because everything uses variables, a dark theme means redefining the variables. The browser tells you when the user prefers dark:</p><pre class="pre">:root { --bg: white; --text: #222; }\n@media (prefers-color-scheme: dark) {\n  :root { --bg: #111; --text: #eee; }\n}\nbody { background: var(--bg); color: var(--text); }</pre><p>No other rule changes. This course page itself works exactly like this.</p>`],
["Your turn",`<p>Change <code>--brand</code> to another colour and watch everything follow. Then change the dark values.</p>`]],
ex:`<style>\n  :root { --brand: #1c6a3a; --bg: #ffffff; --text: #222222; --radius: 12px; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #111111; --text: #eeeeee; } }\n  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 12px; }\n  h1 { color: var(--brand); }\n  .btn { background: var(--brand); color: white; border: 0; padding: 10px 18px; border-radius: var(--radius); }\n  .warning { --brand: crimson; }\n</style>\n<h1>Themed page</h1>\n<button class="btn">Normal</button>\n<div class="warning"><button class="btn">Warning</button></div>`,
ch:[{p:"Define a --brand colour on :root, and use it with var() in two different rules: the h1 colour and the .btn background.",st:`<style>\n  h1 { color: #1c6a3a; }\n  .btn { background: #1c6a3a; color: white; padding: 8px 16px; border: 0; }\n</style>\n<h1>Title</h1>\n<button class="btn">Go</button>`,k:`var t=[].map.call(document.querySelectorAll('style'),function(x){return x.textContent}).join(''),d=t.match(/:root\\s*\\{[^}]*(--[\\w-]+)\\s*:/),n=d?d[1]:'',u=n?new RegExp('var\\\\(\\\\s*'+n+'\\\\s*[,)]','g'):null;return [["A custom property is defined on :root",!!d],["h1 uses it with var()",!!u&&/h1\\s*\\{[^}]*var\\(/.test(t)],[".btn uses it with var()",!!u&&/\\.btn\\s*\\{[^}]*var\\(/.test(t)],["It is used at least twice",!!u&&(t.match(u)||[]).length>=2]]`,h:":root { --brand: #1c6a3a; }  h1 { color: var(--brand); }  .btn { background: var(--brand); }",sol:`<style>\n  :root { --brand: #1c6a3a; }\n  h1 { color: var(--brand); }\n  .btn { background: var(--brand); color: white; padding: 8px 16px; border: 0; }\n</style>\n<h1>Title</h1>\n<button class="btn">Go</button>`},
{p:"Add dark mode: define --bg and --text on :root for light mode, then redefine both inside @media (prefers-color-scheme: dark). The body must use var(--bg) and var(--text).",st:`<style>\n  body { background: white; color: #222; }\n</style>\n<p>Hello</p>`,k:`var t=[].map.call(document.querySelectorAll('style'),function(x){return x.textContent}).join('');return [["Defines --bg and --text on :root",/:root\\s*\\{[^}]*--bg\\s*:[^}]*--text\\s*:|:root\\s*\\{[^}]*--text\\s*:[^}]*--bg\\s*:/.test(t)],["Has a prefers-color-scheme: dark media query",/@media\\s*\\(\\s*prefers-color-scheme\\s*:\\s*dark\\s*\\)/.test(t)],["Redefines the variables in dark mode",/prefers-color-scheme\\s*:\\s*dark[\\s\\S]*:root\\s*\\{[^}]*--bg/.test(t)],["The body uses var(--bg) and var(--text)",/body\\s*\\{[^}]*var\\(--bg\\)[^}]*\\}|body\\s*\\{[^}]*var\\(--text\\)/.test(t)&&/var\\(--bg/.test(t)&&/var\\(--text/.test(t)]]`,h:":root { --bg: white; --text: #222; }  @media (prefers-color-scheme: dark) { :root { --bg: #111; --text: #eee; } }  body { background: var(--bg); color: var(--text); }",sol:`<style>\n  :root { --bg: white; --text: #222; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #111; --text: #eee; } }\n  body { background: var(--bg); color: var(--text); }\n</style>\n<p>Hello</p>`}],

{t:"Checkpoint 2: build a responsive landing page",s:"Combine everything from the CSS part into one polished, responsive page, and check it against a list of requirements.",time:75,
goals:["Plan a page with a header, hero, features and footer","Use variables, flexbox, grid, a media query, shadows and a hover transition together","Use a checklist to find and fix what is missing"],
sec:[["The brief",`<p>Build a landing page for a real or made-up product. There is no worked example. You already know every tool you need. It must contain:</p><ul><li>A proper head: language, title, viewport meta tag.</li><li>A <b>header</b> with a <b>nav</b> of three or more links, laid out with flexbox.</li><li>A <b>main</b> with at least three sections: a <b>hero</b> with a gradient background and a button, a <b>features</b> area with three or more cards in a <b>grid</b>, and a contact section.</li><li>A <b>footer</b>.</li><li>CSS variables on <code>:root</code> (at least two), used with <code>var()</code> at least three times.</li><li>Cards with rounded corners and a shadow. Buttons with a hover effect and a transition.</li><li>A <b>mobile-first</b> design: one column by default, and a <b>media query</b> that makes the features three columns on wide screens.</li><li><code>box-sizing: border-box</code> on everything.</li></ul>`],
["How to work",`<ol><li>Sketch the page for a phone first.</li><li>Write the HTML skeleton with semantic tags.</li><li>Write the variables and the base styles.</li><li>Style one section at a time, pressing Check after each.</li><li>Add the media query last.</li><li>Fix every ✗ item.</li></ol>`],
["Practice space",`<p>Experiment here. The graded project is the next box.</p>`]],
ex:`<h1>Try things here</h1>`,
ch:[{ty:"Project",p:"Build the landing page from the brief. Use the checklist to see what is still missing.",st:`<!DOCTYPE html>\n<html>\n<head>\n  <!-- 1. lang on html, a title, the viewport meta tag -->\n  <style>\n    /* 2. box-sizing, :root variables, base styles */\n    /* 3. nav (flex), hero (gradient), .btn (+ hover and transition) */\n    /* 4. .features (grid), .card (radius + shadow) */\n    /* 5. a media query for wide screens */\n  </style>\n</head>\n<body>\n  <!-- header > nav, main > three sections, footer -->\n</body>\n</html>`,k:`var d=document,q=function(s){return d.querySelector(s)},n=function(s){return d.querySelectorAll(s).length},t=[].map.call(d.querySelectorAll('style'),function(x){return x.textContent}).join(''),v=(t.match(/var\\(--/g)||[]).length,rt=t.match(/:root\\s*\\{([^}]*)\\}/),props=rt?(rt[1].match(/--[\\w-]+\\s*:/g)||[]).length:0,nav=q('nav'),f=q('.features'),cb=t.match(/\\.card\\s*\\{([^}]*)\\}/),bt=t.match(/\\.btn\\s*\\{([^}]*)\\}/);return [["Language, a title and the viewport meta tag",d.documentElement.getAttribute('lang')==="en"&&d.title.trim().length>0&&!!q('meta[name=viewport]')],["One h1, a header, a main and a footer",n('h1')===1&&!!q('header')&&!!q('main')&&!!q('body>footer')],["A nav with 3+ links, laid out with flexbox",!!nav&&nav.querySelectorAll('a').length>=3&&getComputedStyle(nav).display==="flex"],["At least three sections inside main",n('main section')>=3],["At least two custom properties on :root",props>=2],["Variables used with var() at least three times",v>=3],["The hero uses a linear-gradient",/linear-gradient\\(/.test(t)],["The features area is a grid with 3+ cards",!!f&&getComputedStyle(f).display==="grid"&&f.children.length>=3],["Cards have a border-radius and a box-shadow",!!cb&&/border-radius/.test(cb[1])&&/box-shadow/.test(cb[1])],["Buttons have a transition and a :hover rule",!!bt&&/transition/.test(bt[1])&&/\\.btn:hover/.test(t)],["A min-width media query",/@media[^{]*min-width/.test(t)],["box-sizing: border-box on everything",/\\*\\s*\\{[^}]*box-sizing\\s*:\\s*border-box/.test(t)]]`,h:"Read each ✗. The grid is on the .features section and the cards are its direct children. Variables: :root { --brand: #1c6a3a; } then var(--brand).",sol:`<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Acme Studio</title>\n<style>\n* { box-sizing: border-box; }\n:root { --brand: #1c6a3a; --light: #eaf5ee; --radius: 12px; }\nbody { margin: 0; font-family: system-ui, sans-serif; }\nnav { display: flex; gap: 16px; padding: 14px; background: var(--brand); }\nnav a { color: white; text-decoration: none; }\n.hero { padding: 48px 16px; text-align: center; color: white; background: linear-gradient(135deg, var(--brand), #7ad79a); }\n.btn { display: inline-block; padding: 10px 20px; background: white; color: var(--brand); border-radius: var(--radius); transition: transform .2s; }\n.btn:hover { transform: translateY(-3px); }\n.features { display: grid; gap: 16px; padding: 24px 16px; grid-template-columns: 1fr; }\n.card { padding: 20px; border-radius: var(--radius); box-shadow: 0 8px 20px rgba(0,0,0,.15); background: var(--light); }\n@media (min-width: 700px) { .features { grid-template-columns: repeat(3, 1fr); } }\nfooter { padding: 16px; text-align: center; background: #ddd; }\n</style>\n</head>\n<body>\n<header><nav><a href="#">Home</a><a href="#features">Features</a><a href="#contact">Contact</a></nav></header>\n<main>\n<section class="hero"><h1>Build great things</h1><p>Learn, build, launch.</p><a class="btn" href="#">Get started</a></section>\n<section id="features" class="features"><div class="card">One</div><div class="card">Two</div><div class="card">Three</div></section>\n<section id="contact"><p>Say hello.</p></section>\n</main>\n<footer>© Acme Studio</footer>\n</body>\n</html>`}],

const NJ=[
{t:"JavaScript: your first program and console.log",js:true,s:"Start the full JavaScript foundations here: give the computer clear instructions, then use and change values one step at a time.",time:30,
goals:["Explain what a program is, and the order a computer follows it in","Print text and numbers with console.log","Write comments, and read a simple error message"],
sec:[["Quick bridge from the preview",`<p><b>Try this before reading on:</b> what will the console show, and in what order?</p><pre class="pre">console.log("Start");
console.log("Ready");</pre><p><b>Expected console:</b></p><pre class="pre">Start
Ready</pre><p>The preview changed words on a page; here you are reading the small instructions that make a program work.</p>`],
["A program is a recipe",`<p>A <b>program</b> is a list of instructions that the computer follows, one at a time, <b>from the top line to the bottom line</b>, exactly like a recipe. The computer is extremely obedient and extremely literal. It does precisely what you write, nothing more and nothing less. If you write the steps in the wrong order, you get the wrong result, just as in cooking.</p><p>JavaScript is the programming language that web browsers understand, so it is the language of the web. Each instruction is called a <b>statement</b>, and each one usually sits on its own line, ending with a semicolon <code>;</code> (like the full stop of a sentence).</p>`],
["console.log: making the computer speak",`<p>The first thing every programmer learns is how to make the computer <b>say something</b>. We use <code>console.log(...)</code>. Think of the <b>console</b> as a notebook where the program writes notes to you. Whatever you put between the brackets is written there.</p><p><code>console.log("Hello, world!");</code></p><ul><li>Text must sit inside quotes <code>"like this"</code>. Text in quotes is called a <b>string</b>.</li><li>Numbers need no quotes: <code>console.log(2 + 3);</code> prints <code>5</code>. The computer does the sum first.</li><li>Each <code>console.log</code> prints on a <b>new line</b>.</li></ul><p>Below the editor you will see a <b>Console</b> box. It is where your program’s output appears.</p>`],
["Comments: notes for humans",`<p>Anything after <code>//</code> on a line is a <b>comment</b>. The computer ignores it. Use comments to explain your thinking, or to switch a line off for a moment.</p><p><code>// this line is only a note</code></p>`],
["Errors are normal",`<div class="tip"><b>Every programmer sees errors every day.</b> They are not a sign you are bad at this. They are the computer telling you where it got confused.</div><p>Common causes: a missing closing quote or bracket, and a spelling or <b>capital letter</b> mistake. JavaScript is <b>case-sensitive</b>: <code>console.log</code> works, but <code>Console.log</code> does not. An error appears in the Console box as <code>Error: ...</code>. Read the message, then check the line you just wrote.</p>`],
["Your turn",`<p>Press Run and read the output. Then add two lines of your own: one printing your name, and one printing a sum.</p>`]],
we:{t:"reading a program like the computer does",s:[["The program","console.log(\"Start\");\nconsole.log(10 + 5);\nconsole.log(\"End\");","Three statements, three lines."],["Go top to bottom, one at a time","Line 1 -> prints: Start\nLine 2 -> works out 10 + 5, prints: 15\nLine 3 -> prints: End","The computer never skips ahead or goes back."],["The console shows","Start\n15\nEnd","Quotes tell the computer “this is text”. Without quotes, it is worked out like a sum."]]},
ps:[{p:"These three lines print a short story, but they are shuffled. Put them in the order the story should be told.",lines:["console.log(\"First, I woke up.\");","console.log(\"Then I ate breakfast.\");","console.log(\"Finally, I went to school.\");"],h:"Think about the order of events. Waking up comes first, then breakfast, then school."}],
ex:`// My first program\nconsole.log("Hello, world!");\nconsole.log("I am learning JavaScript.");\nconsole.log(7 * 6);`,
ch:[{p:"Print your name as text on the first line, then print the number 2026 on the second line.",st:`// Write your two console.log lines below\n`,k:`return [["Two or more lines were printed",LOG.length>=2],["The first line is some text",LOG.length>0&&/[A-Za-z]/.test(LOG[0])],["The second line is exactly 2026",LOG[1]==="2026"]]`,h:"console.log(\"Ama\"); on one line, and console.log(2026); on the next.",sol:`console.log("Ama");\nconsole.log(2026);`},
{ty:"Fix the bug",p:"This program should print three lines, but it has two typing mistakes and prints errors instead. Find and fix them.",st:`console.log("Hello, world!");\nconsole.log('I am learning JavaScript);\nConsole.log("Almost there");`,k:`return [["No errors",!LOG.some(function(l){return l.indexOf("Error")===0})],["Three lines were printed",LOG.length===3],["The last line is Almost there",LOG[2]==="Almost there"]]`,h:"Line 2 has an opening quote but no closing quote. Line 3 starts with a capital C, which JavaScript does not accept.",sol:`console.log("Hello, world!");\nconsole.log('I am learning JavaScript');\nconsole.log("Almost there");`}],
quiz:[["In what order does the computer follow a program?",["Bottom to top","Top to bottom, one line at a time","Randomly"],1,"A program is followed from the first line to the last, in order."],["Which line works?",["console.log(\"Hi\");","Console.log(\"Hi\");","console.log(\"Hi);"],0,"JavaScript is case-sensitive and every quote needs a partner."]]},

{t:"JavaScript: variables",js:true,s:"A variable is a labelled box that remembers a value, so you can use it again and change it later.",time:35,
goals:["Explain a variable as a labelled box","Create variables with let and const, and know which to choose","Follow how values move when variables change"],
sec:[["A variable is a labelled box",`<p>Programs need to <b>remember</b> things: a score, a name, a price. A <b>variable</b> is a box with a label stuck on it. You put a value inside, and later you ask for it back <b>by its label</b>.</p><svg viewBox="0 0 520 170" style="width:100%;max-width:560px;height:auto;display:block;margin:10px auto" role="img" aria-label="Three labelled boxes: age holds 25, city holds Accra, isStudent holds true"><g font-family="sans-serif" text-anchor="middle"><rect x="40" y="10" width="110" height="28" rx="5" fill="#d98a0b"/><text x="95" y="29" fill="#fff" font-weight="700" font-size="14">age</text><rect x="20" y="44" width="150" height="66" rx="6" fill="rgba(60,120,220,.85)"/><text x="95" y="85" fill="#fff" font-weight="700" font-size="22">25</text><rect x="215" y="10" width="110" height="28" rx="5" fill="#d98a0b"/><text x="270" y="29" fill="#fff" font-weight="700" font-size="14">city</text><rect x="195" y="44" width="150" height="66" rx="6" fill="rgba(60,120,220,.85)"/><text x="270" y="85" fill="#fff" font-weight="700" font-size="20">"Accra"</text><rect x="390" y="10" width="110" height="28" rx="5" fill="#d98a0b"/><text x="445" y="29" fill="#fff" font-weight="700" font-size="14">isStudent</text><rect x="370" y="44" width="150" height="66" rx="6" fill="rgba(60,120,220,.85)"/><text x="445" y="85" fill="#fff" font-weight="700" font-size="22">true</text><g style="fill:var(--ink)" font-size="13" font-family="monospace"><text x="95" y="140">let age = 25;</text><text x="270" y="140">let city = "Accra";</text><text x="445" y="140">let isStudent = true;</text></g></g></svg><p>Read <code>let score = 10;</code> as: <b>“make a box labelled score, and put 10 in it.”</b> The <code>=</code> sign here does not mean “equals”. It means <b>put into</b>.</p>`],
["let and const",`<ul><li><code>let</code> makes a box whose contents can <b>change</b>: a score, a counter.</li><li><code>const</code> makes a box that is <b>sealed</b>. You can read it but never replace what is inside: your date of birth, the value of pi.</li></ul><p>A good habit: <b>use <code>const</code> by default</b>, and switch to <code>let</code> only when you know the value must change. Trying to change a <code>const</code> gives an error. You will also see old code using <code>var</code>. Avoid it.</p><p>Changing a let box: <code>score = score + 1;</code> means “take what is in score, add 1, put the answer back”. Shortcuts: <code>score += 1;</code> and <code>score++;</code></p>`],
["Naming rules",`<ul><li>Use letters, digits, <code>_</code> and <code>$</code>. No spaces. Cannot start with a digit.</li><li>Names are <b>case-sensitive</b>: <code>score</code> and <code>Score</code> are different boxes.</li><li>By convention we write <b>camelCase</b>: the first word small, each next word with a capital: <code>firstName</code>, <code>totalPrice</code>.</li><li>Choose names that <b>say what is inside</b>. <code>price</code> is far better than <code>x</code>.</li></ul>`],
["Your turn",`<p>Run the example. Then change the first value, and add a new variable of your own and print it.</p>`]],
we:{t:"tracing how values move",s:[["Read the program","let a = 5;\nlet b = a;\na = 10;\nconsole.log(a);\nconsole.log(b);","Predict the output before you run it."],["Follow the boxes line by line","let a = 5;   -> a: 5\nlet b = a;   -> b: 5   (a COPY of what is in a)\na = 10;      -> a: 10  (b is untouched)","b took a copy. Changing a later does not change b."],["The console shows","10\n5","Each box keeps its own value."]]},
ps:[{p:"Put the lines in order so the program works out a total with tax. A variable must be created before another line uses it.",lines:["let price = 100;","let tax = price * 0.1;","let total = price + tax;","console.log(total);"],h:"price first. tax uses price, so it comes second. total uses both, then print it."}],
ex:`let name = "Kofi";\nlet score = 10;\nconsole.log(name);\nconsole.log(score);\n\nscore = score + 5;   // change the box\nconsole.log(score);`,
ch:[{p:"Make a const called city holding the name of your city (as text), and a let called visits that starts at 1. Add 1 to visits. Then print city first and visits second. For example, if city is Accra, the console should show Accra, then 2.",st:`// your code here\n`,k:`return [["city is a non-empty text value",typeof city==="string"&&city.length>0],["visits is now 2",visits===2],["It prints city, then 2",LOG.length>=2&&LOG[0]===city&&LOG[1]==="2"]]`,h:"const city = \"Accra\"; let visits = 1; visits = visits + 1; console.log(city); console.log(visits);",sol:`const city = "Accra";\nlet visits = 1;\nvisits = visits + 1;\nconsole.log(city);\nconsole.log(visits);`},
{ty:"Fix the bug",p:"This program should print 10, but it prints an error, because a sealed box was changed. Fix it with one small edit.",st:`const score = 0;\nscore = score + 10;\nconsole.log(score);`,k:`return [["No errors",!LOG.some(function(l){return l.indexOf("Error")===0})],["It prints 10",LOG[0]==="10"]]`,h:"A const cannot be changed. Which word makes a box whose value can change?",sol:`let score = 0;\nscore = score + 10;\nconsole.log(score);`}],
quiz:[["After let x = 5; let y = x; x = 9; what is y?",["9","5","14"],1,"y took a copy of 5. Changing x later does not change y."],["Which keyword makes a value that can never be changed?",["let","var","const"],2,"const is a sealed box."]]},

{t:"JavaScript: types, numbers and text",js:true,s:"Values come in different kinds. Learn the five basic kinds, do maths, and build sentences from pieces.",time:40,
goals:["Name the basic types: string, number, boolean, undefined and null","Use the maths operators, including % and **","Build text with template literals, and avoid the “5” + 3 trap"],
sec:[["Different kinds of value",`<p>Every value has a <b>type</b>, which tells the computer what it is and what you can do with it. The ones you will meet constantly:</p><ul><li><b>String</b>: text in quotes. <code>"Ama"</code>, <code>'hello'</code>.</li><li><b>Number</b>: whole or decimal, no quotes. <code>42</code>, <code>3.14</code>.</li><li><b>Boolean</b>: only <code>true</code> or <code>false</code>, like a light switch. Used for yes/no decisions.</li><li><b>undefined</b>: a box that exists but nothing was put in it yet.</li><li><b>null</b>: a box that is <i>deliberately</i> empty.</li></ul><p>Ask for the type with <code>typeof</code>: <code>console.log(typeof 42);</code> prints <code>number</code>.</p>`],
["Maths",`<ul><li><code>+ - * /</code> add, subtract, multiply, divide.</li><li><code>%</code> the <b>remainder</b> after dividing. <code>17 % 5</code> is <code>2</code> (17 = 3 × 5 + 2). Handy for “is this number even?”: <code>n % 2</code> is 0 for even numbers.</li><li><code>**</code> power. <code>2 ** 10</code> is 1024.</li><li>Normal maths order applies, and brackets change it: <code>(2 + 3) * 4</code> is 20.</li><li><code>Math.round(2.6)</code> gives 3, <code>Math.floor(2.6)</code> gives 2.</li></ul><div class="tip"><b>A famous oddity:</b> <code>0.1 + 0.2</code> gives <code>0.30000000000000004</code>. Computers store decimals in binary, which cannot hold 0.1 exactly. Every language has this. Round when you display money.</div>`],
["Text, and the plus trap",`<p>Gluing strings together is called <b>concatenation</b>, using <code>+</code>: <code>"Hello, " + "Ama"</code>. Careful: <code>"5" + 3</code> gives the text <code>"53"</code>, not 8. With a string involved, <code>+</code> sticks things together instead of adding.</p><p>There is a nicer way: the <b>template literal</b>. Use backtick characters (the key below Esc on most keyboards) and put variables inside <code>$\u007b ... }</code>:</p><p><code>\u0060Hello, $\u007bname}! You are $\u007bage} years old.\u0060</code></p><p>Strings also have built-in tools: <code>name.length</code> counts the characters, <code>name.toUpperCase()</code> shouts it.</p>`],
["Your turn",`<p>Run it, then predict what <code>"5" + 3</code> prints before you try it. Change the numbers in the sum and see.</p>`]],
ex:`const userName = "Ama";\nconst age = 21;\nconsole.log(typeof userName);\nconsole.log(typeof age);\nconsole.log(17 % 5);\nconsole.log(2 ** 10);\nconsole.log("5" + 3);\nconsole.log(\u0060Hello, $\u007buserName}! You are $\u007bage}.\u0060);\nconsole.log(userName.toUpperCase());`,
ch:[{p:"Print the remainder of 17 divided by 5 on the first line, then 2 to the power of 10 on the second line. Expected console: 2, then 1024.",st:`// two console.log lines\n`,k:`return [["The first line is 2",LOG[0]==="2"],["The second line is 1024",LOG[1]==="1024"]]`,h:"console.log(17 % 5); and console.log(2 ** 10);",sol:`console.log(17 % 5);\nconsole.log(2 ** 10);`},
{p:"Print exactly: My name is Ama and I am 21 years old. Use a template literal with the two variables. Do not type the values into the sentence.",st:`const userName = "Ama";\nconst age = 21;\n// print the sentence below with a template literal\n`,k:`return [["The sentence is correct",LOG[0]==="My name is "+userName+" and I am "+age+" years old."],["It uses a template literal",SRC.indexOf(String.fromCharCode(96))>=0],["It uses the variables",SRC.indexOf(String.fromCharCode(36,123)+"userName")>=0&&SRC.indexOf(String.fromCharCode(36,123)+"age")>=0]]`,h:"Use backticks, and put $\\u007buserName} and $\\u007bage} inside the text.",sol:`const userName = "Ama";\nconst age = 21;\nconsole.log(\u0060My name is $\u007buserName} and I am $\u007bage} years old.\u0060);`}],
quiz:[["What does \"5\" + 3 give?",["8","\"53\"","An error"],1,"With a string involved, + joins text. So 5 and 3 are glued into 53."],["What is 7 % 3?",["2","1","2.33"],1,"7 divided by 3 is 2 with a remainder of 1."]]}
];

{t:"JavaScript: making decisions",js:true,s:"Programs become useful when they can choose. Learn to compare values and run different code depending on the answer.",time:40,
goals:["Compare values with ===, !==, <, >, <= and >=","Write if, else if and else","Combine conditions with && (and), || (or) and ! (not)"],
sec:[["Questions with yes/no answers",`<p>A <b>comparison</b> asks a question and the answer is always a boolean: <code>true</code> or <code>false</code>. <code>5 > 3</code> is true. <code>5 === 3</code> is false.</p><ul><li><code>===</code> equal to. <code>!==</code> not equal to.</li><li><code>&lt;</code> less than, <code>&gt;</code> greater than, <code>&lt;=</code> and <code>&gt;=</code> with “or equal”.</li></ul><div class="tip"><b>The most common beginner mistake:</b> one equals sign <code>=</code> <b>puts a value into a box</b>. Three, <code>===</code>, <b>asks a question</b>. Never write <code>if (x = 5)</code>.</div>`],
["if, else if, else",`<p>An <code>if</code> runs its block <b>only when the condition is true</b>. Add <code>else</code> for “otherwise”. Like a fork in the road: the computer takes exactly one path.</p><pre class="pre">if (score >= 70) {\n  console.log("Distinction");\n} else if (score >= 50) {\n  console.log("Pass");\n} else {\n  console.log("Try again");\n}</pre><p>The computer tests from the top, takes the <b>first</b> branch that is true, and skips the rest. The condition goes in brackets, the code in curly braces, indented so you can read it.</p>`],
["Combining conditions",`<ul><li><code>&amp;&amp;</code> means <b>and</b>: both sides must be true. <code>age >= 18 &amp;&amp; hasID</code></li><li><code>||</code> means <b>or</b>: at least one side must be true.</li><li><code>!</code> means <b>not</b>: flips true and false. <code>!isRaining</code></li></ul><p>Careful: write <code>mark >= 50 &amp;&amp; mark &lt;= 100</code>, not <code>50 &lt;= mark &lt;= 100</code>. Each comparison is separate.</p>`],
["Your turn",`<p>Change <code>score</code> to values like 40, 55 and 90 and predict the output before running.</p>`]],
we:{t:"tracing an if / else if / else",s:[["The program","let score = 55;\nif (score >= 70) {\n  console.log(\"Distinction\");\n} else if (score >= 50) {\n  console.log(\"Pass\");\n} else {\n  console.log(\"Try again\");\n}","Three possible paths. Only one will run."],["Test the conditions top to bottom","55 >= 70 ?  false  -> skip\n55 >= 50 ?  true   -> run this block, then STOP","Once one branch runs, the rest are skipped."],["The console shows","Pass","If score were 40, both tests fail and the else runs."]]},
ps:[{p:"Put the lines in order to make a working if/else. The condition decides which console.log runs.",lines:["let score = 72;","if (score >= 70) {","  console.log(\"Distinction\");","} else {","  console.log(\"Keep going\");","}"],h:"Create the variable, open the if, its block, then else with its block, then the closing brace."}],
ex:`let score = 72;\n\nif (score >= 70) {\n  console.log("Distinction");\n} else if (score >= 50) {\n  console.log("Pass");\n} else {\n  console.log("Try again");\n}`,
ch:[{p:"The temperature is 34. Use an if / else to print Hot when the temperature is above 30, and Pleasant otherwise. Compare using the variable, not a typed number.",st:`const temperature = 34;\n// your if / else here\n`,k:`return [["It prints Hot",LOG[0]==="Hot"],["It uses if and else",/\\bif\\s*\\(/.test(SRC)&&/\\belse\\b/.test(SRC)],["It compares temperature with 30",/temperature\\s*>\\s*30/.test(SRC)]]`,h:"if (temperature > 30) { console.log(\"Hot\"); } else { console.log(\"Pleasant\"); }",sol:`const temperature = 34;\nif (temperature > 30) {\n  console.log("Hot");\n} else {\n  console.log("Pleasant");\n}`},
{ty:"Fix the bug",p:"This should print Minor for a 16-year-old, but it prints an error. There is a one-character mistake in the condition. Fix it so it prints Minor.",st:`const age = 16;\nif (age = 18) {\n  console.log("Adult");\n} else {\n  console.log("Minor");\n}`,k:`return [["No errors",!LOG.some(function(l){return l.indexOf("Error")===0})],["It prints Minor",LOG[0]==="Minor"],["It tests age >= 18",/age\\s*>=\\s*18/.test(SRC)]]`,h:"A single = puts a value into a box. You want to ask a question: age >= 18.",sol:`const age = 16;\nif (age >= 18) {\n  console.log("Adult");\n} else {\n  console.log("Minor");\n}`},
{p:"Print Pass only if the mark is at least 50 AND attendance is at least 75. Otherwise print Fail.",st:`const mark = 60;\nconst attendance = 80;\n// your code here\n`,k:`return [["It prints Pass",LOG[0]==="Pass"],["It uses && to combine the two conditions",/&&/.test(SRC)],["It tests the mark and the attendance",/mark\\s*>=\\s*50/.test(SRC)&&/attendance\\s*>=\\s*75/.test(SRC)],["It has an else branch",/\\belse\\b/.test(SRC)]]`,h:"if (mark >= 50 && attendance >= 75) { ... } else { ... }",sol:`const mark = 60;\nconst attendance = 80;\nif (mark >= 50 && attendance >= 75) {\n  console.log("Pass");\n} else {\n  console.log("Fail");\n}`}],

{t:"JavaScript: loops",js:true,s:"Computers are brilliant at repeating things. Learn to run the same code many times without writing it many times.",time:40,
goals:["Write a for loop and read its three parts","Use a while loop","Build up a total inside a loop"],
sec:[["Repeating without copy-paste",`<p>Imagine printing the numbers 1 to 1000. You would never type 1000 lines. A <b>loop</b> repeats a block of code for you.</p><pre class="pre">for (let i = 1; i &lt;= 5; i++) {\n  console.log(i);\n}</pre><p>Read the line in brackets as three instructions separated by semicolons:</p><ol><li><code>let i = 1</code>: <b>start</b>. Make a counter called i, starting at 1.</li><li><code>i &lt;= 5</code>: <b>keep going while</b> this is true.</li><li><code>i++</code>: <b>after each round</b>, add 1 to i.</li></ol><p>The code in the braces is the <b>loop body</b>. It runs once per round: round 1 prints 1, round 2 prints 2, and so on until i becomes 6, the test fails, and the loop ends.</p>`],
["Building a total",`<p>Loops shine when a value grows each round. Make a box <b>before</b> the loop, and update it inside:</p><pre class="pre">let total = 0;\nfor (let i = 1; i &lt;= 5; i++) {\n  total = total + i;\n}\nconsole.log(total);  // 15</pre>`],
["while loops, and two warnings",`<p>A <code>while</code> loop repeats <b>while a condition stays true</b>: <code>while (energy > 0) { ... }</code>. Use it when you do not know in advance how many rounds you need.</p><div class="tip"><b>Warning 1, endless loops:</b> if the condition can never become false, the loop never ends and your page freezes. In a while loop, always change something inside the body. If the editor freezes, reload the page.<br><b>Warning 2, off by one:</b> <code>i &lt; 5</code> stops at 4, while <code>i &lt;= 5</code> stops at 5. Check the first and the last value.</div>`],
["Your turn",`<p>Change 5 to 10, then make it count down by starting at 10 and using <code>i--</code> with <code>i >= 1</code>.</p>`]],
we:{t:"following a loop round by round",s:[["The program","let total = 0;\nfor (let i = 1; i <= 3; i++) {\n  total = total + i;\n}\nconsole.log(total);","Predict the final total before you read on."],["Trace each round","start      i=1, total=0\nround 1    total = 0 + 1 = 1\nround 2    i=2, total = 1 + 2 = 3\nround 3    i=3, total = 3 + 3 = 6\ni becomes 4, 4 <= 3 is false: stop","A table of values is the best way to understand any loop."],["The console shows","6","The print is after the loop, so it runs once, at the end."]]},
ps:[{p:"Put the lines in order to add up the numbers 1 to 5 and print the total.",lines:["let total = 0;","for (let i = 1; i <= 5; i++) {","  total = total + i;","}","console.log(total);"],h:"The total box comes first. Then the loop with its body, then print after the loop closes."}],
ex:`for (let i = 1; i <= 5; i++) {\n  console.log("Round " + i);\n}\n\nlet total = 0;\nfor (let i = 1; i <= 5; i++) {\n  total = total + i;\n}\nconsole.log("Total: " + total);`,
ch:[{p:"Use a loop to print the numbers 1, 2, 3, 4 and 5, each on its own line.",st:`// your loop here\n`,k:`return [["It prints 1 to 5, one per line",LOG.join(",")==="1,2,3,4,5"],["It uses a loop",/\\b(for|while)\\b/.test(SRC)]]`,h:"for (let i = 1; i <= 5; i++) { console.log(i); }",sol:`for (let i = 1; i <= 5; i++) {\n  console.log(i);\n}`},
{p:"Add up all the numbers from 1 to 100 using a loop, and print only the final total, once.",st:`let total = 0;\n// your loop here\n`,k:`return [["It prints 5050",LOG[0]==="5050"],["It prints exactly one line",LOG.length===1],["It uses a loop",/\\b(for|while)\\b/.test(SRC)]]`,h:"Loop i from 1 to 100, doing total = total + i inside, then print total after the loop.",sol:`let total = 0;\nfor (let i = 1; i <= 100; i++) {\n  total = total + i;\n}\nconsole.log(total);`},
{ty:"Fix the bug",p:"This loop should print 1 to 5, but it stops one number early. Fix the off-by-one mistake.",st:`for (let i = 1; i < 5; i++) {\n  console.log(i);\n}`,k:`return [["No errors",!LOG.some(function(l){return l.indexOf("Error")===0})],["It prints 1 to 5",LOG.join(",")==="1,2,3,4,5"]]`,h:"i < 5 stops before 5. Use i <= 5.",sol:`for (let i = 1; i <= 5; i++) {\n  console.log(i);\n}`}],
quiz:[["In for (let i = 1; i <= 3; i++), how many times does the body run?",["2","3","4"],1,"i takes the values 1, 2 and 3."],["Why must a while loop change something inside its body?",["For speed","Otherwise the condition may never become false and it runs forever","It is a style rule"],1,"An endless loop freezes the page."]]},

{t:"JavaScript: functions",js:true,s:"A function is a named recipe you write once and use whenever you like, with different ingredients each time.",time:45,
goals:["Define a function and call it","Use parameters to pass values in, and return to get a value out","Explain the difference between printing and returning"],
sec:[["A named, reusable recipe",`<p>Writing the same code again and again is slow and error-prone. A <b>function</b> packages instructions under a name so you can run them whenever you need.</p><pre class="pre">function greet(name) {\n  return "Hello, " + name + "!";\n}\n\nconsole.log(greet("Ama"));   // Hello, Ama!\nconsole.log(greet("Kofi"));  // Hello, Kofi!</pre><ul><li><code>function greet(...)</code> <b>defines</b> the recipe. Nothing runs yet.</li><li><code>name</code> is a <b>parameter</b>: a labelled box that gets filled with whatever you pass in.</li><li><code>greet("Ama")</code> <b>calls</b> the function. The value “Ama” is the <b>argument</b>.</li></ul>`],
["return: handing an answer back",`<p><code>return</code> <b>sends a value back</b> to whoever called the function, and ends the function. Think of a vending machine: you give it money (arguments), and it hands something back (the return value).</p><div class="tip"><b>Printing is not returning.</b> <code>console.log</code> only shows something on the screen for humans. It gives the rest of your program nothing to use. If another line needs the answer, the function must <code>return</code> it. A function with no return gives back <code>undefined</code>.</div>`],
["Several parameters, and naming",`<p>Separate parameters with commas: <code>function add(a, b) { return a + b; }</code> then <code>add(2, 3)</code> gives 5. Name functions with a verb in camelCase that says what they do: <code>calculateTotal</code>, <code>isEven</code>. Variables made inside a function live only inside it (<b>local</b> variables) and disappear when it ends.</p>`],
["Your turn",`<p>Add a function <code>square(n)</code> that returns <code>n * n</code>, and print <code>square(7)</code>.</p>`]],
we:{t:"building a function step by step",s:[["Say what it should do","Goal: double a number.\nInput: a number. Output: that number times 2.","Always name the input and the output first."],["Write the recipe","function double(n) {\n  return n * 2;\n}","n is the input box. return hands the answer back."],["Use it","console.log(double(4));   // 8\nconsole.log(double(10));  // 20","One definition, many uses."]]},
ps:[{p:"Put the lines in order to define a function that adds two numbers, then call it and print the result.",lines:["function add(a, b) {","  return a + b;","}","console.log(add(2, 3));"],h:"Define the function first, with its body and closing brace. Call it afterwards."}],
ex:`function greet(name) {\n  return "Hello, " + name + "!";\n}\n\nfunction add(a, b) {\n  return a + b;\n}\n\nconsole.log(greet("Ama"));\nconsole.log(add(2, 3));`,
ch:[{p:"Write a function called double that takes a number and returns twice that number. Then print double(8). Expected console: 16.",st:`// write the function, then print double(8)\n`,k:`return [["double is a function",typeof double==="function"],["double(4) returns 8",typeof double==="function"&&double(4)===8],["double(-3) returns -6",typeof double==="function"&&double(-3)===-6],["It printed 16",LOG[0]==="16"]]`,h:"function double(n) { return n * 2; }  then  console.log(double(8));",sol:`function double(n) {\n  return n * 2;\n}\nconsole.log(double(8));`},
{p:"Write a function greet that takes a name and returns Hello, NAME! (with the name inserted). Print greet(\"Ama\"). Expected console: Hello, Ama!",st:`// your function here\n`,k:`return [["greet is a function",typeof greet==="function"],["greet of Ama returns Hello, Ama!",typeof greet==="function"&&greet("Ama")==="Hello, Ama!"],["greet of Kofi returns Hello, Kofi!",typeof greet==="function"&&greet("Kofi")==="Hello, Kofi!"],["It printed Hello, Ama!",LOG[0]==="Hello, Ama!"]]`,h:"return \"Hello, \" + name + \"!\";",sol:`function greet(name) {\n  return "Hello, " + name + "!";\n}\nconsole.log(greet("Ama"));`},
{ty:"Fix the bug",p:"add(2, 3) should give back 5, but it prints 5 and then undefined, because the function prints instead of returning. Fix the function.",st:`function add(a, b) {\n  console.log(a + b);\n}\nconsole.log(add(2, 3));`,k:`return [["add(2, 3) returns 5",add(2,3)===5],["The output is just 5, once",LOG.filter(function(l){return l==="5"}).length>=1&&LOG.indexOf("undefined")<0]]`,h:"Replace console.log(a + b); with return a + b; inside the function.",sol:`function add(a, b) {\n  return a + b;\n}\nconsole.log(add(2, 3));`}],
quiz:[["What does a function without a return statement give back?",["0","undefined","An error"],1,"With no return, the result is undefined."],["What is the difference between a parameter and an argument?",["A parameter is the labelled box in the definition, and an argument is the value you pass in","None","Arguments are only for strings"],0,"Parameters are in the definition, arguments are in the call."]]}
];

{t:"JavaScript: arrays",js:true,s:"A list of values kept together in one variable, like a row of numbered lockers.",time:40,
goals:["Create an array and read items by their index (starting at 0)","Add and remove items with push and pop","Loop over every item in an array"],
sec:[["A row of numbered lockers",`<p>So far each variable held one value. But what about a shopping list, or the marks of 40 students? An <b>array</b> holds many values in order, inside square brackets: <code>const fruits = ["mango", "pawpaw", "banana"];</code></p><p>Each item sits in a numbered slot called its <b>index</b>. <b>Counting starts at 0</b>, not 1. This surprises everyone at first, so say it out loud: the first item is number zero.</p><ul><li><code>fruits[0]</code> is "mango". <code>fruits[2]</code> is "banana".</li><li><code>fruits.length</code> is 3, how many items there are.</li><li>The last item is always <code>fruits[fruits.length - 1]</code>.</li><li>Change one: <code>fruits[1] = "orange";</code></li></ul>`],
["Adding, removing and looking",`<ul><li><code>push(x)</code> adds to the <b>end</b>. <code>pop()</code> removes the last item and hands it back.</li><li><code>unshift(x)</code> adds to the <b>start</b>. <code>shift()</code> removes the first.</li><li><code>includes(x)</code> answers true or false: is it in the list?</li><li><code>indexOf(x)</code> gives its index, or -1 if it is missing.</li><li><code>join(", ")</code> glues all items into one string.</li></ul><p>A <code>const</code> array can still change its <i>contents</i>. What <code>const</code> forbids is pointing the name at a different array.</p>`],
["Looping over an array",`<p>The easiest loop for arrays is <code>for...of</code>. Read it as “for each fruit in the fruits list”:</p><pre class="pre">for (const fruit of fruits) {\n  console.log(fruit);\n}</pre><p>Use the classic <code>for</code> loop with <code>i</code> when you also need the index.</p>`],
["Your turn",`<p>Push a fourth fruit, then print the whole list with <code>join</code>.</p>`]],
we:{t:"how push and indexes work",s:[["Start","const nums = [10, 20, 30];","Index 0 holds 10, index 1 holds 20, index 2 holds 30. Length is 3."],["Change it","nums.push(40);       // [10, 20, 30, 40]\nnums[0] = 99;        // [99, 20, 30, 40]\nnums.pop();          // removes 40 -> [99, 20, 30]","push adds at the end, pop removes from the end."],["Read it","console.log(nums[1]);       // 20\nconsole.log(nums.length);   // 3","Always remember: the first item is index 0."]]},
ps:[{p:"Put the lines in order so the program prints every fruit on its own line.",lines:["const fruits = [\"mango\", \"pawpaw\", \"banana\"];","for (const fruit of fruits) {","  console.log(fruit);","}"],h:"Create the array first. Then the loop, its body, and the closing brace."}],
ex:`const fruits = ["mango", "pawpaw", "banana"];\nconsole.log(fruits[0]);\nconsole.log(fruits.length);\n\nfruits.push("orange");\nfor (const fruit of fruits) {\n  console.log(fruit);\n}\nconsole.log(fruits.join(", "));`,
ch:[{p:"Create a const array called colours holding three colour names as text. Then print the second colour.",st:`// your array here\n`,k:`return [["colours is an array of 3 items",typeof colours!=="undefined"&&Array.isArray(colours)&&colours.length===3],["It prints the second colour",typeof colours!=="undefined"&&LOG[0]===colours[1]]]`,h:"const colours = [\"red\", \"green\", \"blue\"]; console.log(colours[1]);",sol:`const colours = ["red", "green", "blue"];\nconsole.log(colours[1]);`},
{p:"Add up every number in the array using a loop, and print the total.",st:`const numbers = [4, 8, 15, 16, 23, 42];\nlet total = 0;\n// your loop here\n`,k:`return [["It prints 108",LOG[0]==="108"],["It uses a loop",/\\b(for|while)\\b/.test(SRC)],["It prints once",LOG.length===1]]`,h:"for (const n of numbers) { total = total + n; } then print total.",sol:`const numbers = [4, 8, 15, 16, 23, 42];\nlet total = 0;\nfor (const n of numbers) {\n  total = total + n;\n}\nconsole.log(total);`},
{ty:"Fix the bug",p:"This should print the LAST fruit, but it prints undefined. Fix it so it works for any length of list.",st:`const fruits = ["mango", "pawpaw", "banana"];\nconsole.log(fruits[3]);`,k:`return [["It prints banana",LOG[0]==="banana"],["It uses length, so it works for any list",/length/.test(SRC)]]`,h:"The last index is length minus 1: fruits[fruits.length - 1].",sol:`const fruits = ["mango", "pawpaw", "banana"];\nconsole.log(fruits[fruits.length - 1]);`}],
quiz:[["What is the index of the FIRST item in an array?",["1","0","-1"],1,"Counting starts at zero."],["Which method adds an item to the end?",["push","pop","shift"],0,"push adds to the end. pop removes from the end."]]},

{t:"JavaScript: objects",js:true,s:"An object describes one thing with labelled properties, like a record card for a student.",time:40,
goals:["Create an object and read properties with dot notation","Add, change and delete properties","Combine arrays and objects, the shape of almost all real data"],
sec:[["A record card",`<p>An array is a list. But how do you describe <i>one thing</i> that has several facts: a student with a name, an age and a score? You use an <b>object</b>: a collection of <b>key: value</b> pairs in curly braces.</p><pre class="pre">const student = {\n  name: "Ama",\n  age: 21,\n  passed: true\n};</pre><p>Each <b>key</b> is the label (<code>name</code>), each <b>value</b> is what is on the card (<code>"Ama"</code>). Pairs are separated by commas.</p>`],
["Reading and changing",`<ul><li><b>Read:</b> <code>student.name</code> gives "Ama". (Also <code>student["name"]</code>.)</li><li><b>Change:</b> <code>student.age = 22;</code></li><li><b>Add:</b> <code>student.city = "Accra";</code></li><li><b>Remove:</b> <code>delete student.passed;</code></li><li>Asking for a key that does not exist gives <code>undefined</code>. Keys are <b>case-sensitive</b>: <code>student.Name</code> is not <code>student.name</code>.</li></ul>`],
["Arrays of objects",`<p>Real data is usually a <b>list of records</b>: an array whose items are objects.</p><pre class="pre">const students = [\n  { name: "Ama", score: 72 },\n  { name: "Kofi", score: 45 }\n];\nfor (const s of students) {\n  console.log(s.name + ": " + s.score);\n}</pre><p>This exact shape, objects and arrays together, is what web servers send back to apps. It is called <b>JSON</b>.</p>`],
["Your turn",`<p>Add a third student, and a new property on one of them.</p>`]],
we:{t:"reading data out of an array of objects",s:[["The data","const students = [\n  { name: \"Ama\", score: 72 },\n  { name: \"Kofi\", score: 45 }\n];","A list with two record cards."],["Reach in step by step","students[0]            -> { name: \"Ama\", score: 72 }\nstudents[0].name       -> \"Ama\"\nstudents[1].score      -> 45","First the array index, then the dot and the key."],["Loop over it","for (const s of students) {\n  console.log(s.name);\n}","s is each card in turn. s.name reads its name."]]},
ex:`const student = { name: "Ama", age: 21, passed: true };\nconsole.log(student.name);\nstudent.age = 22;\nstudent.city = "Accra";\nconsole.log(student);\n\nconst students = [\n  { name: "Ama", score: 72 },\n  { name: "Kofi", score: 45 }\n];\nfor (const s of students) {\n  console.log(s.name + ": " + s.score);\n}`,
ch:[{p:"Create a const object called book with a title (text), an author (text) and pages (a number). Print the title.",st:`// your object here\n`,k:`return [["book has a title and an author",typeof book!=="undefined"&&typeof book.title==="string"&&typeof book.author==="string"],["pages is a number",typeof book!=="undefined"&&typeof book.pages==="number"],["It prints the title",typeof book!=="undefined"&&LOG[0]===book.title]]`,h:"const book = { title: \"...\", author: \"...\", pages: 200 }; console.log(book.title);",sol:`const book = { title: "Things Fall Apart", author: "Chinua Achebe", pages: 209 };\nconsole.log(book.title);`},
{p:"Loop over the students and print the name of everyone whose score is 50 or more, one per line.",st:`const students = [\n  { name: "Ama", score: 72 },\n  { name: "Kofi", score: 45 },\n  { name: "Efua", score: 88 },\n  { name: "Yaw", score: 50 }\n];\n// your loop here\n`,k:`return [["It prints Ama, Efua and Yaw",LOG.join(",")==="Ama,Efua,Yaw"],["It uses a loop and an if",/\\b(for|while)\\b/.test(SRC)&&/\\bif\\b/.test(SRC)]]`,h:"for (const s of students) { if (s.score >= 50) { console.log(s.name); } }",sol:`const students = [\n  { name: "Ama", score: 72 },\n  { name: "Kofi", score: 45 },\n  { name: "Efua", score: 88 },\n  { name: "Yaw", score: 50 }\n];\nfor (const s of students) {\n  if (s.score >= 50) {\n    console.log(s.name);\n  }\n}`},
{ty:"Fix the bug",p:"This prints undefined instead of the name. A key is spelt differently from how it was created. Fix it.",st:`const person = { name: "Ama", age: 21 };\nconsole.log(person.Name);`,k:`return [["It prints Ama",LOG[0]==="Ama"]]`,h:"Keys are case-sensitive. The key was written name, in lower case.",sol:`const person = { name: "Ama", age: 21 };\nconsole.log(person.name);`}],
quiz:[["How do you read the age of student?",["student(age)","student.age","student->age"],1,"Use a dot, then the key."],["What does an array of objects look like?",["A list of records, like [{...}, {...}]","One object with many arrays","A string"],0,"It is a list whose items are record cards."]]},

{t:"JavaScript: array methods (map, filter, find)",js:true,s:"Powerful one-line tools that transform, filter and search whole lists. Professionals use them every day.",time:45,
goals:["Read an arrow function","Use map to transform every item, and filter to keep some","Use find, some, every and reduce"],
sec:[["Arrow functions: a short recipe",`<p>These methods take a small function as an input. JavaScript has a compact way to write one, the <b>arrow function</b>:</p><p><code>const double = (n) =&gt; n * 2;</code></p><p>Read it as: “take n, give back n times 2”. It is the same as <code>function double(n) { return n * 2; }</code> but shorter. With one input you may drop the brackets: <code>n =&gt; n * 2</code>.</p>`],
["map, filter and find",`<ul><li><b>map</b> is a <b>conveyor belt that changes every item</b>, and gives you a new array the same length: <code>[1, 2, 3].map(n =&gt; n * 2)</code> gives <code>[2, 4, 6]</code>.</li><li><b>filter</b> is a <b>sieve</b>. It keeps only the items that pass a test: <code>[1, 2, 3, 4].filter(n =&gt; n % 2 === 0)</code> gives <code>[2, 4]</code>.</li><li><b>find</b> returns the <b>first</b> item that passes the test (or undefined).</li><li><b>some</b> asks “does any item pass?”, and <b>every</b> asks “do all pass?”. Both give true or false.</li></ul><p>None of these change the original array. They give back something new.</p>`],
["reduce: boiling a list down to one value",`<p><code>reduce</code> walks through a list carrying a running total:</p><pre class="pre">const total = [1, 2, 3, 4].reduce((sum, n) =&gt; sum + n, 0);\n// 10</pre><p>Read it as: “start the sum at 0 (the last argument), and for each n, add it to the sum”.</p><div class="tip"><b>Sorting warning:</b> <code>[10, 9, 1].sort()</code> sorts as <i>text</i> and gives <code>[1, 10, 9]</code>. For numbers, use <code>.sort((a, b) =&gt; a - b)</code>.</div>`],
["Your turn",`<p>Predict each result before running. Then make a new array of the names in capitals using <code>map</code> and <code>toUpperCase()</code>.</p>`]],
we:{t:"following filter and map step by step",s:[["The data and the goal","const nums = [1, 2, 3, 4, 5, 6];\nGoal: the squares of only the even numbers.","Two steps: keep the evens, then square them."],["Write it as a chain","const result = nums\n  .filter(n => n % 2 === 0)   // [2, 4, 6]\n  .map(n => n * n);          // [4, 16, 36]","Each method hands its result to the next one."],["Print","console.log(result);   // [4,16,36]","Chaining small steps is the heart of modern JavaScript."]]},
ex:`const nums = [1, 2, 3, 4, 5, 6];\nconsole.log(nums.map(n => n * 2));\nconsole.log(nums.filter(n => n % 2 === 0));\nconsole.log(nums.find(n => n > 3));\nconsole.log(nums.reduce((sum, n) => sum + n, 0));\n\nconst names = ["ama", "kofi"];\nconsole.log(names.map(n => n.toUpperCase()));`,
ch:[{p:"Use map to make a new array called doubled, with every number in nums doubled. Print doubled.",st:`const nums = [1, 2, 3, 4];\n// your code here\n`,k:`return [["doubled is [2, 4, 6, 8]",typeof doubled!=="undefined"&&JSON.stringify(doubled)==="[2,4,6,8]"],["It uses map",/\\.map\\(/.test(SRC)],["The original nums is unchanged",JSON.stringify(nums)==="[1,2,3,4]"]]`,h:"const doubled = nums.map(n => n * 2); console.log(doubled);",sol:`const nums = [1, 2, 3, 4];\nconst doubled = nums.map(n => n * 2);\nconsole.log(doubled);`},
{p:"Use filter to keep only the scores of 50 or more, in an array called passed. Print passed.",st:`const scores = [72, 45, 88, 50, 31];\n// your code here\n`,k:`return [["passed is [72, 88, 50]",typeof passed!=="undefined"&&JSON.stringify(passed)==="[72,88,50]"],["It uses filter",/\\.filter\\(/.test(SRC)]]`,h:"const passed = scores.filter(s => s >= 50);",sol:`const scores = [72, 45, 88, 50, 31];\nconst passed = scores.filter(s => s >= 50);\nconsole.log(passed);`},
{p:"Use reduce to add up all the prices and store the answer in a variable called total. Print total.",st:`const prices = [12, 8, 20, 5];\n// your code here\n`,k:`return [["total is 45",typeof total!=="undefined"&&total===45],["It uses reduce",/\\.reduce\\(/.test(SRC)],["It prints 45",LOG[0]==="45"]]`,h:"const total = prices.reduce((sum, p) => sum + p, 0);",sol:`const prices = [12, 8, 20, 5];\nconst total = prices.reduce((sum, p) => sum + p, 0);\nconsole.log(total);`}],
quiz:[["What does map return?",["A new array of the same length, with every item transformed","Only the first match","A single number"],0,"map transforms every item into a new array."],["Which method keeps only the items that pass a test?",["map","filter","find"],1,"filter is the sieve."]]},

{t:"JavaScript: changing the page (the DOM)",s:"The browser turns your HTML into a living tree you can reach into with JavaScript, and change while the page is open.",time:45,
goals:["Explain what the DOM is","Select elements with querySelector","Change text, styles and classes, and create new elements"],
sec:[["The page is a tree of objects",`<p>When the browser loads your HTML, it builds a live model of the page in memory: a family tree where every tag becomes an <b>object</b>. This model is the <b>DOM</b> (Document Object Model). When JavaScript changes the DOM, <b>the page on screen changes instantly</b>. Nothing is reloaded.</p><p>That is how a page reacts: HTML makes the first version, and JavaScript edits the tree afterwards.</p>`],
["Find it, then change it",`<p>Two steps, always. <b>Step 1: find</b> the element: <code>document.querySelector("#title")</code> (the same selectors you used in CSS: <code>#id</code>, <code>.class</code>, <code>p</code>). <b>Step 2: change</b> it:</p><ul><li><code>el.textContent = "New words";</code> changes the text.</li><li><code>el.style.color = "tomato";</code> changes one style. (CSS names with dashes become camelCase: <code>backgroundColor</code>.)</li><li><code>el.classList.add("big")</code>, <code>.remove("big")</code>, <code>.toggle("big")</code> change classes. This is the best way to restyle: write the style in CSS, switch it on with a class.</li><li><code>el.setAttribute("href", "#")</code> changes an attribute.</li></ul><div class="tip"><b>Put your script at the end of the body,</b> after the elements. The browser reads top to bottom, and an element that has not been read yet cannot be found.</div>`],
["Creating new elements",`<pre class="pre">const li = document.createElement("li");\nli.textContent = "Mango";\ndocument.querySelector("#list").appendChild(li);</pre><p>Make the element, fill it, then attach it to a parent. Until you append it, it does not appear on the page.</p>`],
["Your turn",`<p>Run it and see the page change. Then change the colour, the text and the class.</p>`]],
ps:[{p:"Put the lines in order: the heading must exist before the script looks for it, and the script runs inside its tags.",lines:["<h1 id=\"title\">Hello</h1>","<script>","  const title = document.querySelector(\"#title\");","  title.textContent = \"Welcome!\";","<\/script>"],h:"The element first, then the script tag, find the element, change it, close the script."}],

{t:"JavaScript: events and interaction",s:"Make pages respond: when someone taps, types or submits, your code runs.",time:45,
goals:["Listen for click and input events with addEventListener","Read what the user typed","Keep a value in a variable and show it on the page"],
sec:[["Waiting for something to happen",`<p>A web page spends most of its life <b>waiting</b>. It does nothing until the user does something: taps a button, types a letter, submits a form. Each of these is an <b>event</b>. You tell the browser: <i>“when this happens to that element, run this function.”</i></p><pre class="pre">button.addEventListener("click", function () {\n  console.log("Tapped!");\n});</pre><p>Three parts: <b>which element</b> (<code>button</code>), <b>which event</b> (<code>"click"</code>), <b>what to do</b> (the function). The function does not run now. It runs <b>every time</b> the event happens.</p>`],
["Common events",`<ul><li><code>"click"</code>: tapped or clicked.</li><li><code>"input"</code>: the text in a box changed (fires on every key press). Read it with <code>box.value</code>.</li><li><code>"keydown"</code>: a key was pressed.</li><li><code>"submit"</code>: a form was sent. Call <code>event.preventDefault()</code> inside to stop the page reloading.</li></ul>`],
["Remembering things: state",`<p>To count taps, keep a number in a variable <b>outside</b> the function, so it survives between taps. Each tap: update the variable, then <b>show it on the page</b>.</p><pre class="pre">let count = 0;\nbutton.addEventListener("click", function () {\n  count = count + 1;\n  display.textContent = count;\n});</pre><p>This pattern, <b>update the data, then update the screen</b>, is the foundation of every app.</p>`],
["Your turn",`<p>Tap the button and type in the box. Then add a button that resets the count to 0.</p>`]],
we:{t:"building a tap counter",s:[["Find the elements","const plus = document.querySelector('#plus');\nconst display = document.querySelector('#count');","First find what you need."],["Keep the count outside the function","let count = 0;","A variable declared outside survives from tap to tap."],["React to the click","plus.addEventListener('click', function () {\n  count = count + 1;\n  display.textContent = count;\n});","Update the data, then show it."]]},
ex:`<button id="plus">+1</button> <span id="count">0</span>\n<p><input id="name" placeholder="Your name"></p>\n<p id="hello"></p>\n<script>\n  let count = 0;\n  const countEl = document.querySelector("#count");\n  document.querySelector("#plus").addEventListener("click", function () {\n    count = count + 1;\n    countEl.textContent = count;\n  });\n  const nameInput = document.querySelector("#name");\n  nameInput.addEventListener("input", function () {\n    document.querySelector("#hello").textContent = "Hello, " + nameInput.value;\n  });\n<\/script>`,
ch:[{p:"Make the button count: every tap adds 1 to the number shown in the span.",st:`<button id="plus">+1</button> <span id="count">0</span>\n<script>\n  // your code here\n<\/script>`,k:`var b=document.getElementById('plus'),c=document.getElementById('count');b.click();b.click();b.click();return [["Three taps show 3",c.textContent.trim()==="3"]]`,h:"let count = 0; plus.addEventListener('click', function () { count = count + 1; display.textContent = count; });",sol:`<button id="plus">+1</button> <span id="count">0</span>\n<script>\n  let count = 0;\n  document.querySelector("#plus").addEventListener("click", function () {\n    count = count + 1;\n    document.querySelector("#count").textContent = count;\n  });\n<\/script>`},

{p:"Build a dark-mode switch: each tap on the button toggles the class dark on the body.",st:`<button id="toggle">Toggle dark mode</button>\n<script>\n  // your code here\n<\/script>`,k:`var b=document.getElementById('toggle');b.click();var a=document.body.classList.contains('dark');b.click();var c=document.body.classList.contains('dark');return [["The first tap adds dark to the body",a],["The second tap removes it",!c]]`,h:"document.body.classList.toggle('dark') inside a click listener.",sol:`<button id="toggle">Toggle dark mode</button>\n<script>\n  document.querySelector("#toggle").addEventListener("click", function () {\n    document.body.classList.toggle("dark");\n  });\n<\/script>`}],
