proj("JS Project 1: tip calculator","A calculator that works out the tip, the total, and what each person pays.",["Update all three results whenever the bill, tip or number of people changes","Show every amount with exactly two decimals, such as 28.75","Treat a negative bill as 0.00, and treat zero people as one person"],PC,`<div class="app"><h1>Tip calculator</h1><label for="bill">Bill amount</label><input id="bill" type="number" min="0" step="0.01" value="0"><label for="tip">Tip percentage</label><input id="tip" type="number" min="0" value="10"><label for="people">Number of people</label><input id="people" type="number" min="1" value="1"><div class="out"><div class="muted">Tip</div><div class="big" id="tipAmount">0.00</div><div class="muted">Total</div><div class="big" id="total">0.00</div><div class="muted">Each person pays</div><div class="big" id="each">0.00</div></div></div>`,`const bill=document.querySelector("#bill"),tip=document.querySelector("#tip"),people=document.querySelector("#people");\nfunction update(){\n  const b=Math.max(0,parseFloat(bill.value)||0),t=Math.max(0,parseFloat(tip.value)||0),p=Math.max(1,parseInt(people.value)||1);\n  const tipAmount=b*t/100,total=b+tipAmount;\n  document.querySelector("#tipAmount").textContent=tipAmount.toFixed(2);\n  document.querySelector("#total").textContent=total.toFixed(2);\n  document.querySelector("#each").textContent=(total/p).toFixed(2);\n}\n[bill,tip,people].forEach(function(el){el.addEventListener("input",update);});\nupdate();`,`function set(id,v){var e=document.getElementById(id);e.value=v;e.dispatchEvent(new Event('input'))}function txt(id){return document.getElementById(id).textContent.trim()}set('bill','100');set('tip','15');set('people','1');var a=[txt('tipAmount'),txt('total')];set('people','4');var b=txt('each');set('bill','80.5');set('tip','10');set('people','3');var c=[txt('tipAmount'),txt('total'),txt('each')];set('bill','-5');var d=txt('total');set('people','0');set('bill','50');set('tip','20');var e=txt('each');return [["100 at 15% shows a tip of 15.00",a[0]==="15.00"],["...and a total of 115.00",a[1]==="115.00"],["Split between 4, each pays 28.75",b==="28.75"],["80.5 at 10% for 3 people: tip 8.05, total 88.55, each 29.52",c[0]==="8.05"&&c[1]==="88.55"&&c[2]==="29.52"],["A negative bill gives a total of 0.00",d==="0.00"],["Zero people counts as one person (each pays 60.00)",e==="60.00"]]`,"Write update() that reads the three inputs with parseFloat, calculates, and sets textContent with toFixed(2). Call update on every input event, and once at the start. Use Math.max to guard bad values.",600),
proj("JS Project 2: dark mode toggle","A theme switch that flips a whole page between light and dark, and tells assistive technology its state.",["Start in light mode, with the button saying Dark mode: off","Each tap toggles the class dark on the body","The button text switches between on and off, and aria-pressed switches between true and false"],PC+"body.dark{background:#0f1a15;color:#e8f0ea}body.dark .app{background:#1b2a24}body.dark .out{background:#12201a}body.dark .muted{color:#9bb0a3}",`<div class="app"><h1>Theme switch</h1><p>Flip the switch and the whole page changes colour.</p><button id="theme" aria-pressed="false">Dark mode: off</button><div class="out"><div class="muted">Preview card</div><div class="big">Hello, world</div></div></div>`,`const btn=document.querySelector("#theme");\nbtn.addEventListener("click",function(){\n  const on=document.body.classList.toggle("dark");\n  btn.textContent="Dark mode: "+(on?"on":"off");\n  btn.setAttribute("aria-pressed",String(on));\n});`,`var b=document.getElementById('theme');var r=[["It starts in light mode",!document.body.classList.contains('dark')&&b.textContent.trim()==='Dark mode: off']];b.click();r.push(["First tap: the body gets the class dark",document.body.classList.contains('dark')]);r.push(["The button says Dark mode: on",b.textContent.trim()==='Dark mode: on']);r.push(["aria-pressed is true",b.getAttribute('aria-pressed')==='true']);b.click();r.push(["Second tap: the class dark is removed",!document.body.classList.contains('dark')]);r.push(["The button says Dark mode: off again",b.textContent.trim()==='Dark mode: off']);r.push(["aria-pressed is false again",b.getAttribute('aria-pressed')==='false']);return r`,"classList.toggle returns true when the class was added. Use that to pick the words on / off, and setAttribute('aria-pressed', String(on)).",360),
proj("JS Project 3: colour picker","A mixer with three sliders that shows the colour, its hex code, and a palette of saved colours.",["Update the swatch, the hex code (like #1c6a3a, with leading zeros) and the rgb text as any slider moves","Save colour adds a round chip to the palette","Clicking a chip loads that colour back into the sliders"],PC+".chip{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cfd8cc;padding:0}input[type=range]{padding:0}",`<div class="app"><h1>Colour picker</h1><div id="swatch" style="height:90px;border-radius:12px;background:#000"></div><label for="r">Red</label><input id="r" type="range" min="0" max="255" value="0"><label for="g">Green</label><input id="g" type="range" min="0" max="255" value="0"><label for="b">Blue</label><input id="b" type="range" min="0" max="255" value="0"><div class="out"><div class="big" id="hex">#000000</div><div class="muted" id="rgb">rgb(0, 0, 0)</div></div><button id="save" style="margin-top:12px">Save colour</button><div id="palette" class="row" style="margin-top:12px;flex-wrap:wrap"></div></div>`,`const R=document.querySelector("#r"),G=document.querySelector("#g"),B=document.querySelector("#b");\nconst swatch=document.querySelector("#swatch"),palette=document.querySelector("#palette");\nfunction toHex(n){return Number(n).toString(16).padStart(2,"0");}\nfunction show(){\n  const r=+R.value,g=+G.value,b=+B.value,hex="#"+toHex(r)+toHex(g)+toHex(b);\n  swatch.style.background=hex;\n  document.querySelector("#hex").textContent=hex;\n  document.querySelector("#rgb").textContent="rgb("+r+", "+g+", "+b+")";\n}\n[R,G,B].forEach(function(s){s.addEventListener("input",show);});\nconst saved=[];\nfunction render(){\n  palette.innerHTML="";\n  saved.forEach(function(c){\n    const chip=document.createElement("button");\n    chip.className="chip";\n    chip.style.background="rgb("+c.join(",")+")";\n    chip.addEventListener("click",function(){R.value=c[0];G.value=c[1];B.value=c[2];show();});\n    palette.appendChild(chip);\n  });\n}\ndocument.querySelector("#save").addEventListener("click",function(){saved.push([+R.value,+G.value,+B.value]);render();});\nshow();`,`function set(id,v){var e=document.getElementById(id);e.value=v;e.dispatchEvent(new Event('input'))}function t(id){return document.getElementById(id).textContent.trim()}set('r','255');set('g','0');set('b','0');var h1=t('hex'),g1=t('rgb'),bg=getComputedStyle(document.getElementById('swatch')).backgroundColor;set('r','5');set('g','5');set('b','5');var h3=t('hex');set('r','28');set('g','106');set('b','58');var h2=t('hex');document.getElementById('save').click();var n1=document.querySelectorAll('#palette .chip').length;set('r','255');set('g','255');set('b','255');document.getElementById('save').click();var n2=document.querySelectorAll('#palette .chip').length;document.querySelectorAll('#palette .chip')[0].click();var back=document.getElementById('r').value+','+document.getElementById('g').value+','+document.getElementById('b').value;return [["255, 0, 0 shows #ff0000",h1==='#ff0000'],["...and rgb(255, 0, 0) in the text",g1==='rgb(255, 0, 0)'],["The swatch turns red",bg==='rgb(255, 0, 0)'],["5, 5, 5 shows #050505 (numbers are padded with a zero)",h3==='#050505'],["28, 106, 58 shows #1c6a3a",h2==='#1c6a3a'],["Save adds one chip to the palette",n1===1],["A second save adds a second chip",n2===2],["Clicking the first chip loads 28, 106, 58 back into the sliders",back==='28,106,58']]`,"Convert with Number(n).toString(16).padStart(2, '0'). Keep the saved colours in an array, and write render() to rebuild the chips from it. Each chip's click handler sets the three slider values, then calls show().",700),
proj("JS Project 4: accordion and tabs","Two of the most common interface patterns on the web, built from scratch.",["Accordion: clicking a heading opens its panel and closes the others. Clicking an open heading closes it","Keep aria-expanded true or false on each heading to match","Tabs: clicking a tab makes it the only active tab, and shows only its own panel"],PC+".acc{border:1px solid #cfd8cc;border-radius:10px;margin:8px 0;overflow:hidden}.acc-head{width:100%;text-align:left;background:#f4f8f2;color:#222;border-radius:0}.acc-body{display:none;padding:12px}.acc.open .acc-body{display:block}.tabs{display:flex;gap:6px;margin-top:20px}.tab{background:#e4ebe0;color:#333}.tab.active{background:#1c6a3a;color:#fff}.panel{display:none;padding:14px;background:#eaf5ee;border-radius:10px;margin-top:8px}.panel.active{display:block}",`<div class="app"><h1>Accordion and tabs</h1><div class="acc"><button class="acc-head" aria-expanded="false">What is HTML?</button><div class="acc-body">The structure of a page.</div></div><div class="acc"><button class="acc-head" aria-expanded="false">What is CSS?</button><div class="acc-body">The style of a page.</div></div><div class="acc"><button class="acc-head" aria-expanded="false">What is JavaScript?</button><div class="acc-body">The behaviour of a page.</div></div><div class="tabs"><button class="tab active" data-tab="a">One</button><button class="tab" data-tab="b">Two</button><button class="tab" data-tab="c">Three</button></div><div class="panel active" id="pa">Panel one</div><div class="panel" id="pb">Panel two</div><div class="panel" id="pc">Panel three</div></div>`,`const items=document.querySelectorAll(".acc");\nitems.forEach(function(item){\n  const head=item.querySelector(".acc-head");\n  head.addEventListener("click",function(){\n    const wasOpen=item.classList.contains("open");\n    items.forEach(function(i){i.classList.remove("open");i.querySelector(".acc-head").setAttribute("aria-expanded","false");});\n    if(!wasOpen){item.classList.add("open");head.setAttribute("aria-expanded","true");}\n  });\n});\nconst tabs=document.querySelectorAll(".tab"),panels=document.querySelectorAll(".panel");\ntabs.forEach(function(tab){\n  tab.addEventListener("click",function(){\n    tabs.forEach(function(t){t.classList.remove("active");});\n    panels.forEach(function(p){p.classList.remove("active");});\n    tab.classList.add("active");\n    document.querySelector("#p"+tab.dataset.tab).classList.add("active");\n  });\n});`,`var heads=document.querySelectorAll('.acc-head'),accs=document.querySelectorAll('.acc'),tabs=document.querySelectorAll('.tab');var r=[["Everything starts closed",document.querySelectorAll('.acc.open').length===0]];heads[0].click();r.push(["Clicking the first heading opens it",accs[0].classList.contains('open')&&heads[0].getAttribute('aria-expanded')==='true']);heads[1].click();r.push(["Opening the second closes the first",accs[1].classList.contains('open')&&!accs[0].classList.contains('open')]);r.push(["aria-expanded follows (second true, first false)",heads[1].getAttribute('aria-expanded')==='true'&&heads[0].getAttribute('aria-expanded')==='false']);heads[1].click();r.push(["Clicking an open heading closes it",document.querySelectorAll('.acc.open').length===0]);tabs[1].click();r.push(["Clicking tab two shows panel two",document.getElementById('pb').classList.contains('active')]);r.push(["...and hides panel one",!document.getElementById('pa').classList.contains('active')]);r.push(["Only one tab is active",document.querySelectorAll('.tab.active').length===1&&tabs[1].classList.contains('active')]);tabs[2].click();r.push(["Tab three then shows only panel three",document.querySelectorAll('.panel.active').length===1&&document.getElementById('pc').classList.contains('active')]);return r`,"Use querySelectorAll + forEach. In each click handler, first remove open/active from everything, then add it to the clicked one. Remember to remember wasOpen before clearing, so a second click can close it.",640)

{t:"JavaScript: dates, time and timers",js:true,s:"Use familiar code to inspect the clock, format a display, and schedule an action for later.",time:40,
goals:["Read the current date and time with Date","Format numbers with padStart so 5 becomes 05","Use setTimeout and setInterval, and stop a timer with clearInterval"],
sec:[["Quick recap: follow the values",`<p><b>Before moving on:</b> trace this from the first line to the last. Which value gets reused?</p><pre class="pre">const label = "Timer";
console.log("Before");
console.log(label);
console.log("After");</pre><p><b>Expected console:</b> Before, then Timer, then After, one line at a time. Next, use the same step-by-step thinking with the clock and code that runs later.</p>`],
["Asking the computer for the time",`<p><code>new Date()</code> creates an object holding the current moment. Ask it questions:</p><ul><li><code>d.getHours()</code>, <code>d.getMinutes()</code>, <code>d.getSeconds()</code> (the hour is 0 to 23).</li><li><code>d.getFullYear()</code>, <code>d.getDate()</code> (the day of the month).</li><li><code>d.getMonth()</code>: careful! Months count from <b>0</b>, so January is 0 and November is 10. Add 1 to show it to people.</li><li><code>Date.now()</code> is the number of milliseconds since 1 January 1970. Subtract two of them to measure time.</li></ul>`],
["Making 5 look like 05",`<p>Clocks show 07:05, not 7:5. The tool is <code>padStart(length, filler)</code>: it adds filler to the <b>start</b> of a string until it reaches the length. It only works on strings, so convert first:</p><p><code>String(5).padStart(2, "0")</code> gives <code>"05"</code>, and <code>String(12).padStart(2, "0")</code> stays <code>"12"</code>.</p><p>For a 75-second timer, <code>Math.floor(75 / 60)</code> gives the whole minutes (1), and <code>75 % 60</code> gives the seconds left over (15). In code, <code>%</code> is the remainder operator: it tells you what is left after making full groups.</p>`],
["Timers: later, and again and again",`<ul><li><code>setTimeout(fn, 2000)</code> runs <code>fn</code> <b>once</b>, after 2000 milliseconds (2 seconds).</li><li><code>setInterval(fn, 1000)</code> runs <code>fn</code> <b>every</b> 1000 milliseconds, until stopped.</li><li>Both hand back an <b>id</b>. Keep it in a variable, then <code>clearInterval(id)</code> stops the timer.</li></ul><div class="tip"><b>Two traps:</b> times are in <b>milliseconds</b> (1000 = one second). And if a Start button can be pressed twice, you will create two timers running at once, so the clock runs double speed. Guard against it: check whether a timer already exists before making one.</div>`],

proj("JS Project 5: clock and stopwatch","A live digital clock above a stopwatch with start, stop and reset.",["The clock shows the real time as HH:MM:SS and updates every second","The stopwatch starts at 00:00. Start counts up in seconds, shown as MM:SS","Stop freezes it, Reset returns it to 00:00, and pressing Start twice must not make it run faster"],PC+".row button{flex:1}",`<div class="app"><h1>Clock and stopwatch</h1><div class="muted">Time now</div><div class="big" id="clock">--:--:--</div><div class="muted" style="margin-top:14px">Stopwatch</div><div class="big" id="sw">00:00</div><div class="row" style="margin-top:12px"><button id="start">Start</button><button id="stop">Stop</button><button id="reset">Reset</button></div></div>`,`function pad(n){return String(n).padStart(2,"0");}\nfunction formatTime(t){return pad(Math.floor(t/60))+":"+pad(t%60);}\nconst clock=document.querySelector("#clock"),sw=document.querySelector("#sw");\nfunction tick(){const d=new Date();clock.textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());}\ntick();\nsetInterval(tick,1000);\nlet seconds=0,timer=null;\ndocument.querySelector("#start").addEventListener("click",function(){\n  if(timer){return;}\n  timer=setInterval(function(){seconds++;sw.textContent=formatTime(seconds);},1000);\n});\ndocument.querySelector("#stop").addEventListener("click",function(){clearInterval(timer);timer=null;});\ndocument.querySelector("#reset").addEventListener("click",function(){clearInterval(timer);timer=null;seconds=0;sw.textContent=formatTime(0);});`,`function pad(n){return (n<10?'0':'')+n}function toSec(t){var p=t.split(':');return +p[0]*3600+ +p[1]*60+ +p[2]}function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}var c=document.getElementById('clock'),s=document.getElementById('sw'),first=c.textContent.trim(),d=new Date(),now=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());var res=[["The clock shows the time as HH:MM:SS",/^\\d\\d:\\d\\d:\\d\\d$/.test(first)],["It shows the current time",/^\\d\\d:\\d\\d:\\d\\d$/.test(first)&&Math.abs(toSec(first)-toSec(now))<=2],["The stopwatch starts at 00:00",s.textContent.trim()==='00:00']];document.getElementById('start').click();document.getElementById('start').click();return wait(1300).then(function(){res.push(["The clock keeps ticking",c.textContent.trim()!==first]);res.push(["After about a second the stopwatch shows 00:01 (even if Start was pressed twice)",s.textContent.trim()==='00:01']);document.getElementById('stop').click();return wait(1100)}).then(function(){res.push(["Stop freezes the stopwatch at 00:01",s.textContent.trim()==='00:01']);document.getElementById('reset').click();res.push(["Reset returns it to 00:00",s.textContent.trim()==='00:00']);return res})`,"Write pad() and formatTime() first. For the clock, call tick() once straight away and then setInterval(tick, 1000). For the stopwatch keep the timer id in a variable, and return early if it already exists.",470)

sec:[["A little drawer in the browser",`<p>Variables vanish when the page closes. The browser offers a small drawer, <b>localStorage</b>, that keeps data on the user’s device, even after closing the browser. It stores pairs of <b>key and value</b>, like a tiny object:</p><ul><li><code>localStorage.setItem("name", "Ama")</code> saves.</li><li><code>localStorage.getItem("name")</code> reads it back, or gives <code>null</code> if nothing is saved yet.</li><li><code>localStorage.removeItem("name")</code> deletes one key.</li></ul><p><b>Everything is stored as text.</b> Save the number 5 and you read back the string "5".</p>`],
["JSON: arrays and objects as text",`<p>To save an array or an object you must first turn it into text. <b>JSON</b> is the standard text format for data:</p><pre class="pre">const todos = [{ text: "Buy bread", done: false }];\nlocalStorage.setItem("todos", JSON.stringify(todos));\n\nconst back = JSON.parse(localStorage.getItem("todos"));\nconsole.log(back[0].text);   // Buy bread</pre><p><code>JSON.stringify</code> turns data into text. <code>JSON.parse</code> turns text back into data. Forget either one and you get the famous <code>[object Object]</code>.</p>`],
["The load, change, save pattern",`<ol><li><b>On start:</b> read what is saved, or an empty list if nothing is: <code>JSON.parse(localStorage.getItem("tasks") || "[]")</code>. The <code>||</code> supplies the fallback when getItem gives null.</li><li><b>On every change:</b> update the array, then save it straight away.</li><li><b>Then draw the screen</b> from the array.</li></ol><div class="tip"><b>Remember:</b> localStorage can be read by anyone using that device. Never store passwords or private details in it. In this course the editor gives you a safe stand-in that behaves the same, and it remembers your data between runs.</div>`],

const TD=proj("JS Project 6: to-do app with saved tasks","A to-do list that remembers its tasks even after the page is closed and opened again.",["Adding a task (button or Enter) lists it, clears the box, and ignores empty tasks","Each task has a checkbox (marks it done, with the class done), and a delete button","The counter reads 3 tasks left, or 1 task left in the singular. Clear completed removes the done ones","Tasks are saved in localStorage under the key tasks as JSON, and come back when the page loads"],PC+"ul{list-style:none;padding:0;margin:14px 0}li{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #e3e9df}li.done span{text-decoration:line-through;color:#888}li button{margin-left:auto;height:30px;background:#c0392b;padding:0 10px}.row input{flex:1}li input[type=checkbox]{width:18px;height:18px}",`<div class="app"><h1>To-do list</h1><form id="form" class="row"><input id="input" placeholder="Add a task" aria-label="New task"><button type="submit">Add</button></form><ul id="list"></ul><div class="muted" id="count">0 tasks left</div><button id="clear" style="margin-top:10px">Clear completed</button></div>`,`const form=document.querySelector("#form"),input=document.querySelector("#input"),list=document.querySelector("#list"),count=document.querySelector("#count");\nlet tasks=JSON.parse(localStorage.getItem("tasks")||"[]");\nfunction save(){localStorage.setItem("tasks",JSON.stringify(tasks));}\nfunction render(){\n  list.innerHTML="";\n  tasks.forEach(function(t,i){\n    const li=document.createElement("li");\n    if(t.done){li.className="done";}\n    const cb=document.createElement("input");cb.type="checkbox";cb.checked=t.done;\n    cb.addEventListener("change",function(){t.done=cb.checked;save();render();});\n    const span=document.createElement("span");span.textContent=t.text;\n    const del=document.createElement("button");del.textContent="Delete";\n    del.addEventListener("click",function(){tasks.splice(i,1);save();render();});\n    li.append(cb,span,del);list.appendChild(li);\n  });\n  const left=tasks.filter(function(t){return !t.done;}).length;\n  count.textContent=left+(left===1?" task":" tasks")+" left";\n}\nform.addEventListener("submit",function(e){\n  e.preventDefault();\n  const text=input.value.trim();\n  if(!text){return;}\n  tasks.push({text:text,done:false});input.value="";save();render();\n});\ndocument.querySelector("#clear").addEventListener("click",function(){tasks=tasks.filter(function(t){return !t.done;});save();render();});\nrender();`,`function add(t){var i=document.getElementById('input');i.value=t;document.getElementById('form').dispatchEvent(new Event('submit',{cancelable:true}))}function items(){return document.querySelectorAll('#list li')}function cnt(){return document.getElementById('count').textContent.trim()}add('Buy bread');add('Call Ama');add('   ');add('Pay fees');var r=[["Three tasks are listed (the empty one is ignored)",items().length===3],["The box is cleared after adding",document.getElementById('input').value===''],["The counter says 3 tasks left",cnt()==='3 tasks left']];items()[0].querySelector('input[type=checkbox]').click();r.push(["Ticking a task gives its row the class done, and the counter says 2 tasks left",items()[0].classList.contains('done')&&cnt()==='2 tasks left']);items()[1].querySelector('button').click();r.push(["Delete removes a task",items().length===2]);document.getElementById('clear').click();r.push(["Clear completed removes the ticked task",items().length===1&&items()[0].textContent.indexOf('Pay fees')>=0]);r.push(["The tasks are saved in localStorage under tasks, as JSON",(function(){try{var a=JSON.parse(localStorage.getItem('tasks'));return Array.isArray(a)&&a.length===1&&a[0].text==='Pay fees'}catch(e){return false}})()]);return r`,"Load tasks from localStorage at the very start (with || '[]'). Write save() and render(). After every change: update the array, call save(), then call render(). Build each row with createElement, and count the tasks that are not done.",560);

nt("button");b.className="card";b.dataset.symbol=s;b.textContent="?";b.addEventListener("click",function(){flip(b);});board.appendChild(b);});\n}\nfunction flip(b){\n  if(lock||b===first||b.classList.contains("matched")){return;}\n  b.classList.add("flipped");b.textContent=b.dataset.symbol;\n  if(!first){first=b;return;}\n  moves++;\n  if(first.dataset.symbol===b.dataset.symbol){first.classList.add("matched");b.classList.add("matched");matched++;first=null;update();if(matched===symbols.length){win.hidden=false;}}\n  else{lock=true;update();const a=first;first=null;setTimeout(function(){a.classList.remove("flipped");b.classList.remove("flipped");a.textContent="?";b.textContent="?";lock=false;},800);}\n}\nagain.addEventListener("click",start);\nstart();`,`function cards(){return document.querySelectorAll('#board .card')}function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}var c=cards(),syms=[].map.call(c,function(x){return x.dataset.symbol}),counts={};syms.forEach(function(s){counts[s]=(counts[s]||0)+1});var twoEach=Object.keys(counts).length===6&&Object.keys(counts).every(function(k){return counts[k]===2});var adj=true;for(var i=0;i<12;i+=2){if(syms[i]!==syms[i+1])adj=false}var base=['🍎','🍌','🍇','🍒','🍋','🥥'];var unshuffled=syms.join()===base.concat(base).join();var r=[["There are 12 cards",c.length===12],["Each of the 6 symbols appears exactly twice (in data-symbol)",twoEach],["The cards are shuffled",twoEach&&!adj&&!unshuffled],["Face-down cards do not show their symbol",[].every.call(c,function(x){return x.textContent.indexOf(x.dataset.symbol)<0})]];var a=0,b=-1;for(var j=1;j<12;j++){if(syms[j]!==syms[0]){b=j;break}}c[a].click();c[b].click();r.push(["Flipping a card shows its symbol and gives it the class flipped",c[a].textContent.indexOf(syms[a])>=0&&c[a].classList.contains('flipped')]);r.push(["Two cards turned counts as Moves: 1",document.getElementById('moves').textContent.trim()==='Moves: 1']);var third=-1;for(var k2=0;k2<12;k2++){if(k2!==a&&k2!==b){third=k2;break}}c[third].click();r.push(["While a wrong pair is showing, other cards cannot be flipped",!c[third].classList.contains('flipped')]);return wait(1100).then(function(){r.push(["A wrong pair flips back face down",!c[a].classList.contains('flipped')&&!c[b].classList.contains('flipped')&&c[a].textContent.indexOf(syms[a])<0]);var m=-1;for(var q=1;q<12;q++){if(syms[q]===syms[0]){m=q;break}}c[0].click();c[m].click();r.push(["A matching pair stays face up with the class matched",c[0].classList.contains('matched')&&c[m].classList.contains('matched')]);r.push(["The counter says Matched: 1 / 6",document.getElementById('matched').textContent.trim()==='Matched: 1 / 6']);var left={};for(var z=0;z<12;z++){if(!c[z].classList.contains('matched')){(left[syms[z]]=left[syms[z]]||[]).push(z)}}Object.keys(left).forEach(function(s){c[left[s][0]].click();c[left[s][1]].click()});r.push(["Matching every pair shows the You won! box",document.getElementById('win').hidden===false]);document.getElementById('again').click();r.push(["Play again deals a fresh board, hides the win box and resets the moves",document.getElementById('win').hidden===true&&cards().length===12&&document.getElementById('moves').textContent.trim()==='Moves: 0']);return r})`,"Build the deck with symbols.concat(symbols) and shuffle it (swap each item with a random earlier one). Keep first, lock, moves and matched in variables. In flip(): ignore the click if locked, already matched, or the same card. On a wrong pair set lock = true and use setTimeout to flip both back.",620);

{t:"JavaScript: asynchronous code and promises",js:true,s:"Some things take time: timers, downloads, servers. Learn how JavaScript waits without freezing the page.",time:45,
goals:["Explain why JavaScript does not stand still while it waits","Predict the order of output when timers are involved","Create and chain promises with then and catch"],
sec:[["Do not stand at the kitchen door",`<p>You order food at a restaurant. You do not stand in the kitchen watching the chef. You sit down, keep chatting, and a <b>buzzer</b> tells you when the food is ready. JavaScript works the same way. Slow jobs (a timer, loading data from a server) are handed off. The program <b>carries on</b>, and a function you supplied is called when the job finishes. This is <b>asynchronous</b> code. If JavaScript did stand still, every page would freeze whenever it loaded anything.</p>`],
["The order surprise",`<pre class="pre">console.log("1");\nsetTimeout(function () { console.log("2"); }, 0);\nconsole.log("3");</pre><p>This prints <b>1, 3, 2</b>, not 1, 2, 3. Even with a delay of 0, a function handed to <code>setTimeout</code> waits in a queue until the main code has <b>finished</b>. The mechanism that picks queued functions up one at a time is called the <b>event loop</b>. Remember it as: <i>all the code you wrote runs first, then the waiting functions get their turn.</i></p>`],
["Promises: an IOU",`<p>Passing buzzer-functions around gets messy fast. A <b>promise</b> is an object that stands for a result that is <b>not ready yet</b>, like an IOU. It is in one of three states: <b>pending</b> (waiting), <b>fulfilled</b> (succeeded, with a value) or <b>rejected</b> (failed, with an error).</p><pre class="pre">function wait(ms) {\n  return new Promise(function (resolve) {\n    setTimeout(resolve, ms);\n  });\n}\n\nwait(500)\n  .then(function () { console.log("half a second later"); })\n  .catch(function (err) { console.log("failed", err); });</pre><ul><li><code>resolve(value)</code> marks the promise fulfilled. <code>reject(error)</code> marks it failed.</li><li><code>.then(fn)</code> runs <code>fn</code> when it succeeds. Each <code>.then</code> returns a <b>new promise</b>, so you can chain them in a row.</li><li><code>.catch(fn)</code> runs if anything in the chain fails.</li></ul>`],
["Your turn",`<p>Run it, and watch the order of the output. Change the delays and predict the new order first.</p>`]],
ps:[{p:"Put the lines in order to build a wait(ms) function that returns a promise resolved after a delay.",lines:["function wait(ms) {","  return new Promise(function (resolve) {","    setTimeout(resolve, ms);","  });","}"],h:"The function wraps a Promise, and inside that a setTimeout calls resolve after ms."}],

ch:[{p:"Write a function delay(ms, value) that returns a promise which resolves with value after ms milliseconds.",st:`// write delay here\n`,k:`if(typeof delay!=='function')return [["delay is a function",false]];var p=delay(50,'hi');var t=Date.now();return p.then(function(v){return [["delay returns a promise",p instanceof Promise],["It resolves with the value",v==='hi'],["It waits about 50 ms",Date.now()-t>=40]]})`,h:"return new Promise(function (resolve) { setTimeout(function () { resolve(value); }, ms); });",sol:`function delay(ms, value) {\n  return new Promise(function (resolve) {\n    setTimeout(function () {\n      resolve(value);\n    }, ms);\n  });\n}`},
{ty:"Fix the bug",p:"This should print A, B, C in order, but C comes out before B, because B is delayed. Change the code so the output order is A, B, C.",st:`console.log("A");\nsetTimeout(function () {\n  console.log("B");\n}, 100);\nconsole.log("C");`,k:`return new Promise(function(r){setTimeout(function(){r([["It prints A, then B, then C",LOG.join(',')==="A,B,C"]])},400)})`,h:"Move the console.log('C') so that it runs after B: inside the timeout, after the B line.",sol:`console.log("A");\nsetTimeout(function () {\n  console.log("B");\n  console.log("C");\n}, 100);`},
{p:"Use the wait helper and then-chaining to print 1, then 2, then 3, each one after a short wait.",st:`function wait(ms) {\n  return new Promise(function (resolve) { setTimeout(resolve, ms); });\n}\n// chain your waits here\n`,k:`return new Promise(function(r){setTimeout(function(){r([["It prints 1, 2, 3 in order",LOG.join(',')==="1,2,3"],["It uses then",/\\.then\\(/.test(SRC)]])},900)})`,h:"wait(100).then(function () { console.log(1); return wait(100); }).then(function () { console.log(2); return wait(100); }).then(function () { console.log(3); });",sol:`function wait(ms) {\n  return new Promise(function (resolve) { setTimeout(resolve, ms); });\n}\nwait(100)\n  .then(function () { console.log(1); return wait(100); })\n  .then(function () { console.log(2); return wait(100); })\n  .then(function () { console.log(3); });`}],

sec:[["await: wait here, but only here",`<p>Promise chains work, but <code>async</code> and <code>await</code> let you write the same thing as <b>plain top-to-bottom steps</b>:</p><pre class="pre">async function showAfterWait() {\n  await wait(500);\n  console.log("half a second later");\n}</pre><ul><li>Put <code>async</code> before a function and it always returns a promise.</li><li><code>await</code> pauses <b>inside that function only</b> until a promise is ready, then hands you its value. The rest of the page keeps running.</li><li><code>await</code> only works inside an <code>async</code> function.</li></ul>`],
["fetch: asking a server for data",`<p>An <b>API</b> is a menu of questions a server will answer. You send a request to an address (a URL), and it replies with data, usually <b>JSON</b>. <code>fetch</code> does the asking:</p><pre class="pre">async function loadUsers() {\n  const response = await fetch("api/users");\n  const users = await response.json();\n  console.log(users[0].name);\n}</pre><p>There are <b>two awaits</b>: the first for the reply to arrive, the second for its body to be read as JSON.</p><div class="tip"><b>In this course:</b> pages in the editor cannot reach outside websites. So a pretend service lives at <code>api/users</code> (a list of people) and <code>api/weather?city=Accra</code> (try Accra, Koforidua, Kumasi, Tamale, London). It behaves like a real one: it takes a moment, and it fails for unknown cities. To use a real weather service on your own computer, you would only change the URL.</div>`],
["Errors: two different kinds",`<ul><li><b>The network fails</b> (no internet, server down). <code>fetch</code> <b>rejects</b>, and your <code>try / catch</code> catches it.</li><li><b>The server answers “no”</b>, for example <code>404 Not Found</code>. This is <b>not</b> a failure to fetch, so no error is thrown! You must check <code>response.ok</code> yourself.</li></ul><pre class="pre">try {\n  const res = await fetch("api/weather?city=" + city);\n  if (!res.ok) { return "City not found"; }\n  const data = await res.json();\n  return data.temp;\n} catch (err) {\n  return "Network problem";\n}</pre>`],
["Your turn",`<p>Run it. Then change the city to Kumasi, and to Atlantis (which does not exist) and see the difference.</p>`]],

const WX=proj("JS Project 10: weather app","A weather search that talks to an API, shows loading and error states, and recovers from failure. It uses the course’s built-in weather service, which behaves like a real one.",["Searching a city shows Loading…, then the city name, a temperature like 31°C, the condition, and Humidity 70% · Wind 12 km/h","An empty search shows Please enter a city, and does not call the API","An unknown city shows City not found, and a network failure (try Offline) shows Network problem. Try again. A new search must work after either error"],PC,`<div class="app"><h1>Weather</h1><form id="form" class="row"><input id="city" placeholder="Enter a city" aria-label="City"><button type="submit">Search</button></form><div id="msg" class="muted" style="margin-top:12px"></div><div class="out" id="card" hidden><div class="muted" id="name"></div><div class="big" id="temp"></div><div id="cond"></div><div class="muted" id="extra"></div></div></div>`,`const form=document.querySelector("#form"),cityInput=document.querySelector("#city"),msg=document.querySelector("#msg"),card=document.querySelector("#card");\nasync function search(city){\n  msg.textContent="Loading…";card.hidden=true;\n  try{\n    const res=await fetch("api/weather?city="+encodeURIComponent(city));\n    if(!res.ok){msg.textContent="City not found";return;}\n    const d=await res.json();\n    document.querySelector("#name").textContent=d.city;\n    document.querySelector("#temp").textContent=d.temp+"°C";\n    document.querySelector("#cond").textContent=d.condition;\n    document.querySelector("#extra").textContent="Humidity "+d.humidity+"% · Wind "+d.wind+" km/h";\n    msg.textContent="";card.hidden=false;\n  }catch(e){msg.textContent="Network problem. Try again.";}\n}\nform.addEventListener("submit",function(e){\n  e.preventDefault();\n  const city=cityInput.value.trim();\n  if(!city){msg.textContent="Please enter a city";return;}\n  search(city);\n});`,`function q(s){return document.querySelector(s)}function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}function go(c){q('#city').value=c;q('#form').dispatchEvent(new Event('submit',{cancelable:true}))}var r=[];go('   ');r.push(["An empty search shows Please enter a city",q('#msg').textContent.trim()==='Please enter a city']);go('Accra');r.push(["While waiting it shows Loading…",q('#msg').textContent.trim()==='Loading…']);return wait(800).then(function(){r.push(["Accra: the card appears",q('#card').hidden===false]);r.push(["It shows the city name Accra",q('#name').textContent.trim()==='Accra']);r.push(["It shows 31°C",q('#temp').textContent.trim()==='31°C']);r.push(["It shows the condition Sunny",q('#cond').textContent.trim()==='Sunny']);r.push(["It shows Humidity 70% · Wind 12 km/h",q('#extra').textContent.trim()==='Humidity 70% · Wind 12 km/h']);r.push(["The loading message is gone",q('#msg').textContent.trim()==='']);go('Atlantis');return wait(800)}).then(function(){r.push(["An unknown city shows City not found",q('#msg').textContent.trim()==='City not found']);r.push(["...and hides the card",q('#card').hidden===true]);go('Offline');return wait(800)}).then(function(){r.push(["A network failure shows Network problem. Try again.",q('#msg').textContent.trim()==='Network problem. Try again.']);go('Kumasi');return wait(800)}).then(function(){r.push(["A new search works after the errors (Kumasi 28°C, Rain)",q('#card').hidden===false&&q('#temp').textContent.trim()==='28°C'&&q('#cond').textContent.trim()==='Rain']);return r})`,"Write an async search(city) with try / catch. Show Loading… first. Check res.ok before res.json(). Fill the four fields, then show the card. Handle the form submit: preventDefault, trim, and stop early if the box is empty.",480);

sec:[["A manageable build path",`<ol><li><b>Lay out the page:</b> add the header, hero, work, services, contact and footer sections.</li><li><b>Make it readable:</b> style the hero and build the work cards before adding motion.</li><li><b>Add one interaction at a time:</b> work filters, service accordion, form checks, then theme switch.</li><li><b>Polish:</b> check the page at phone size and test each control.</li></ol><p><b>Beginner first step:</b> create the header and hero structure with placeholder text, then check they appear in the preview. Add the other sections one by one.</p>`],["The brief",`<p>This is a final capstone. There is <b>no starter HTML</b>: you build the whole site, HTML, CSS and JavaScript, from a blank page, to match the live target. The style is the kind you see on award-winning agency sites: oversized headlines, a restrained palette with one bright accent, motion, and generous space. The target is live, so scroll it, hover the cards, use the filters and the form.</p>`],["The build sheet",`<p>The checker finds your elements by these <b>names</b>, so use them exactly. Everything else is your design choice.</p><ul><li><b>Page:</b> <code>header.nav</code> with an <code>a.logo</code>, a <code>nav.links</code> of 3 links, and <code>button#theme</code>. Then <code>main</code> with: <code>section.hero</code> (<code>p.eyebrow</code>, one <code>h1</code> with a <code>span.hl</code>, and <code>a.cta</code>), <code>div.marquee &gt; div.track</code>, <code>section#work</code>, <code>section#services</code>, <code>section#contact</code>. Then <code>footer</code>.</li><li><b>Work:</b> <code>div.filters</code> with 3 buttons that have <code>data-filter</code> set to all, web, brand. <code>div.cards</code> with four <code>article.card</code>, each with <code>data-cat</code> web or brand, an <code>img</code> with alt text, an <code>h3</code> and a <code>p</code>.</li><li><b>Services:</b> three <code>div.service</code>, each with <code>button.service-head</code> and <code>div.service-body</code>.</li><li><b>Contact:</b> <code>form#contact-form</code> with inputs <code>#name</code>, <code>#email</code>, <code>#message</code> (a textarea), an error <code>span</code> after each (<code>#err-name</code>, <code>#err-email</code>, <code>#err-message</code>), a submit button, and <code>p#form-msg</code>.</li><li><b>Pictures</b> from the images folder: dashboard.svg, bowl.svg, mountain.svg, team.svg.</li><li><b>Colours:</b> background #0e0e12, text #f3f1ea, muted #9a98a6, amber accent #ffb347, cards #17171e. Light theme: background #f6f3ec, text #17171e.</li></ul>`],["The behaviour",`<ul><li><b>Theme:</b> the button toggles the class <code>light</code> on the body, and the choice is saved so it survives a reload.</li><li><b>Filters:</b> show only the cards in that category (use the <code>hidden</code> attribute), and mark the clicked button <code>active</code>.</li><li><b>Services:</b> an accordion: one open at a time, with <code>aria-expanded</code> kept in step.</li><li><b>Form:</b> on submit, check the name is not empty, the email looks valid, and the message has at least 10 characters. Show these exact errors: <i>Please enter your name</i>, <i>Please enter a valid email</i>, <i>Please write a message (at least 10 characters)</i>. When all is well show <i>Thanks, NAME! We will be in touch.</i> and clear the form.</li></ul>`],["The phone layout",`<p>Use the <b>screen</b> menu on the target to switch to the phone. Below 700px wide: hide the menu links, shrink the headline to 44px, make the button fill the width, stack the cards in one column, and trim the side padding to 20px.</p>`],["How to work",`<ol><li>Write the HTML for the whole page, with the names above. Press <b>Run</b>.</li><li>Style it section by section. Use <b>Show measurements</b> and <b>Difference</b> view against the target.</li><li>Add the JavaScript one behaviour at a time.</li><li>Add the phone rules last, in a media query.</li><li>Press <b>Check</b>. It measures your desktop layout, tests every behaviour, then reloads your page at phone size to check the phone layout and the saved theme.</li></ol>`],["Practice space",`<p>Try ideas here before the graded capstone below.</p>`]],

const RMOV=`const movies = [\n  { id: 1, title: "Midnight in Accra", year: 2024, genre: "Drama", poster: "images/poster1.svg", desc: "A night shift nurse chases a secret across a sleepless city." },\n  { id: 2, title: "Laugh Track", year: 2023, genre: "Comedy", poster: "images/poster2.svg", desc: "Three friends open the worst comedy club in town." },\n  { id: 3, title: "Signal Lost", year: 2025, genre: "Sci-fi", poster: "images/poster3.svg", desc: "A radio engineer hears a message from tomorrow." },\n  { id: 4, title: "The Last Ferry", year: 2022, genre: "Thriller", poster: "images/poster4.svg", desc: "Seven strangers, one boat, and a missing passenger." },\n  { id: 5, title: "Harvest Moon", year: 2024, genre: "Drama", poster: "images/poster5.svg", desc: "A farming family faces its toughest season." },\n  { id: 6, title: "Kitchen Wars", year: 2021, genre: "Comedy", poster: "images/poster6.svg", desc: "Two rival chefs share one tiny restaurant." },\n  { id: 7, title: "Orbit Nine", year: 2025, genre: "Sci-fi", poster: "images/poster7.svg", desc: "The crew of a space station finds an uninvited guest." },\n  { id: 8, title: "Cold Harbour", year: 2023, genre: "Thriller", poster: "images/poster8.svg", desc: "A detective returns to the town she swore to forget." }\n];`;
const RCSS="body{margin:0;background:#0a0a0e;color:#f3f3f6;font-family:system-ui,sans-serif}.nav{height:68px;display:flex;align-items:center;gap:28px;padding:0 40px;background:linear-gradient(#000c,transparent);position:relative;z-index:3}.logo{color:#ff4d6d;font-weight:900;font-size:24px;letter-spacing:.08em;text-decoration:none}.links{display:flex;gap:22px;margin-right:auto}.links a{color:#d0d0d8;text-decoration:none;font-size:14px}#list-count{background:#ff4d6d;color:#fff;border-radius:10px;padding:0 7px;font-size:12px}#search{width:200px;height:36px;border-radius:18px;border:1px solid #444;background:#15151c;color:#fff;padding:0 16px}.billboard{height:420px;margin-top:-68px;display:flex;align-items:flex-end;padding:0 40px 56px;background:linear-gradient(90deg,#0a0a0e 12%,transparent 75%),linear-gradient(0deg,#0a0a0e,transparent 40%),url(images/billboard.svg) center/cover}.bb-text{max-width:460px}.billboard h1{font-size:56px;margin:0 0 10px;line-height:1.05}.desc{color:#d0d0d8;margin:0 0 20px}.bb-btns{display:flex;gap:12px}.bb-btns button{height:48px;padding:0 24px;border:0;border-radius:6px;font-size:16px;font-weight:700;cursor:pointer}.play{background:#fff;color:#000}.add,.info{background:rgba(255,255,255,.22);color:#fff}.row{padding:0 40px;margin:28px 0}.row h2{font-size:20px;margin:0 0 12px}.row-wrap{position:relative}.scroller{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 0;scrollbar-width:none}.poster{flex:none;width:140px;height:210px;position:relative;border-radius:8px;overflow:hidden;cursor:pointer;scroll-snap-align:start;transition:transform .25s}.poster:hover{transform:scale(1.12);z-index:2}.poster img{width:100%;height:100%;object-fit:cover;display:block}.poster-title{position:absolute;left:0;right:0;bottom:0;padding:24px 8px 8px;font-size:13px;font-weight:700;background:linear-gradient(transparent,#000c)}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:90px;border:0;background:#000a;color:#fff;font-size:28px;cursor:pointer;z-index:3}.arrow.left{left:-40px}.arrow.right{right:-40px}#no-results{padding:0 40px;color:#9a98a6}#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:10}#modal[hidden]{display:none}.modal-card{position:relative;background:#17171e;border-radius:14px;padding:28px;width:min(420px,90vw)}#modal-close{position:absolute;top:10px;right:14px;background:transparent;border:0;color:#fff;font-size:26px;cursor:pointer}.muted{color:#9a98a6}#modal-list{height:44px;border:0;border-radius:6px;background:#fff;color:#000;font-weight:700;padding:0 20px;cursor:pointer}@media (max-width:700px){.nav{height:60px;padding:0 16px;gap:12px}.links{display:none}#search{margin-left:auto;width:150px}.billboard{height:360px;margin-top:-60px;padding:0 16px 32px}.billboard h1{font-size:36px}.row{padding:0 16px}.poster{width:110px;height:165px}.arrow{display:none}#no-results{padding:0 16px}}";
const RHTML=`<header class="nav"><a class="logo" href="#">REELIO</a><nav class="links"><a href="#">Home</a><a href="#">Movies</a><a href="#mylist-row">My List <span id="list-count">0</span></a></nav><input id="search" type="search" placeholder="Search titles" aria-label="Search titles"></header>\n<section class="billboard"><div class="bb-text"><h1>Midnight in Accra</h1><p class="desc">A night shift nurse chases a secret across a sleepless city.</p><div class="bb-btns"><button class="play">▶ Play</button><button class="add">+ My List</button><button class="info">More info</button></div></div></section>\n<main><p id="no-results" hidden>No titles match your search.</p>\n<section class="row" id="mylist-row" hidden><h2>My List</h2><div class="scroller" id="mylist-items"></div></section>\n<section class="row" id="row-trending"><h2>Trending now</h2><div class="row-wrap"><button class="arrow left" aria-label="Scroll left">‹</button><div class="scroller" id="trending-items"></div><button class="arrow right" aria-label="Scroll right">›</button></div></section>\n<section class="row" id="row-comedy"><h2>Comedies</h2><div class="scroller" id="comedy-items"></div></section></main>\n<div id="modal" hidden><div class="modal-card"><button id="modal-close" aria-label="Close">×</button><h3 id="modal-title"></h3><p id="modal-meta" class="muted"></p><p id="modal-desc"></p><button id="modal-list">+ Add to My List</button></div></div>`;
const RJS=RMOV+`\nfunction makePoster(m){const d=document.createElement("div");d.className="poster";d.dataset.id=m.id;d.tabIndex=0;const img=document.createElement("img");img.src=m.poster;img.alt=m.title;const t=document.createElement("div");t.className="poster-title";t.textContent=m.title;d.append(img,t);return d;}\nfunction fill(el,list){el.innerHTML="";list.forEach(function(m){el.appendChild(makePoster(m));});}\nlet myList=JSON.parse(localStorage.getItem("mylist")||"[]");\nconst countEl=document.querySelector("#list-count"),listRow=document.querySelector("#mylist-row"),listItems=document.querySelector("#mylist-items");\nfunction renderList(){\n  fill(listItems,movies.filter(function(m){return myList.includes(m.id);}));\n  listRow.hidden=myList.length===0;countEl.textContent=myList.length;\n  localStorage.setItem("mylist",JSON.stringify(myList));applySearch();\n}\nfill(document.querySelector("#trending-items"),movies);\nfill(document.querySelector("#comedy-items"),movies.filter(function(m){return m.genre==="Comedy";}));\nconst modal=document.querySelector("#modal");let current=null;\nfunction syncBtn(){document.querySelector("#modal-list").textContent=myList.includes(current.id)?"Remove from My List":"+ Add to My List";}\nfunction openModal(id){\n  current=movies.find(function(m){return m.id===id;});\n  document.querySelector("#modal-title").textContent=current.title;\n  document.querySelector("#modal-meta").textContent=current.year+" · "+current.genre;\n  document.querySelector("#modal-desc").textContent=current.desc;\n  syncBtn();modal.hidden=false;\n}\nfunction closeModal(){modal.hidden=true;}\ndocument.addEventListener("click",function(e){const p=e.target.closest(".poster");if(p){openModal(+p.dataset.id);}});\ndocument.querySelector("#modal-close").addEventListener("click",closeModal);\nmodal.addEventListener("click",function(e){if(e.target===modal){closeModal();}});\ndocument.addEventListener("keydown",function(e){if(e.key==="Escape"){closeModal();}});\ndocument.querySelector("#modal-list").addEventListener("click",function(){\n  const i=myList.indexOf(current.id);\n  if(i>=0){myList.splice(i,1);}else{myList.push(current.id);}\n  syncBtn();renderList();\n});\ndocument.querySelector(".info").addEventListener("click",function(){openModal(1);});\ndocument.querySelector(".add").addEventListener("click",function(){if(!myList.includes(1)){myList.push(1);renderList();}});\nconst searchBox=document.querySelector("#search"),none=document.querySelector("#no-results");\nfunction applySearch(){\n  const q=searchBox.value.trim().toLowerCase();let any=false;\n  document.querySelectorAll(".poster").forEach(function(p){\n    const show=p.querySelector(".poster-title").textContent.toLowerCase().includes(q);\n    p.hidden=!show;if(show){any=true;}\n  });\n  none.hidden=any;\n}\nsearchBox.addEventListener("input",applySearch);\nconst trending=document.querySelector("#trending-items");\ndocument.querySelector("#row-trending .arrow.right").addEventListener("click",function(){trending.scrollBy({left:420});});\ndocument.querySelector("#row-trending .arrow.left").addEventListener("click",function(){trending.scrollBy({left:-420});});\nrenderList();`;
const RSOL="<style>"+RCSS+"</style>\n"+RHTML+"\n<script>\n"+RJS+"\n<\/script>";

const RK1=`function q(s){return document.querySelector(s)}function all(s){return document.querySelectorAll(s)}function vis(e){return e.offsetParent!==null}function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}var r=[],tp=all('#trending-items .poster'),cp=all('#comedy-items .poster');r.push(["Trending shows 8 posters built from the data, each with an img with alt text and a data-id",tp.length===8&&[].every.call(tp,function(p){var i=p.querySelector('img');return i&&i.alt.length>0&&p.dataset.id})]);r.push(["The Comedies row shows only Laugh Track and Kitchen Wars",cp.length===2&&[].map.call(cp,function(p){return p.querySelector('.poster-title').textContent.trim()}).join(',')==='Laugh Track,Kitchen Wars']);r.push(["The My List row is hidden while the list is empty",q('#mylist-row').hidden===true]);tp[0].click();r.push(["Clicking a poster opens the details window",q('#modal').hidden===false]);r.push(["It shows the title, and the year and genre as 2024 · Drama",q('#modal-title').textContent.trim()==='Midnight in Accra'&&q('#modal-meta').textContent.trim()==='2024 · Drama']);document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));r.push(["The Escape key closes the window",q('#modal').hidden===true]);tp[1].click();q('#modal-close').click();r.push(["The close button closes it",q('#modal').hidden===true]);var s=q('#search');s.value='mid';s.dispatchEvent(new Event('input'));var v=[].filter.call(all('.poster'),vis);r.push(["Searching mid shows only Midnight in Accra",v.length===1&&v[0].querySelector('.poster-title').textContent.trim()==='Midnight in Accra']);s.value='zzz';s.dispatchEvent(new Event('input'));r.push(["A search with no matches shows the no-results message",q('#no-results').hidden===false]);s.value='';s.dispatchEvent(new Event('input'));r.push(["Clearing the search shows every poster again and hides the message",[].filter.call(all('.poster'),vis).length===10&&q('#no-results').hidden===true]);tp[0].click();q('#modal-list').click();r.push(["Add to My List changes the button to Remove from My List",q('#modal-list').textContent.trim()==='Remove from My List']);r.push(["The menu count shows 1",q('#list-count').textContent.trim()==='1']);r.push(["The My List row appears with 1 poster",q('#mylist-row').hidden===false&&all('#mylist-items .poster').length===1]);r.push(["The list is saved in localStorage under mylist as JSON",(function(){try{return JSON.stringify(JSON.parse(localStorage.getItem('mylist')))==='[1]'}catch(e){return false}})()]);q('#modal-list').click();r.push(["Removing it sets the count to 0 and hides the row",q('#list-count').textContent.trim()==='0'&&q('#mylist-row').hidden===true]);q('#modal-list').click();q('#modal-close').click();q('.info').click();r.push(["The More info button opens the window for Midnight in Accra",q('#modal').hidden===false&&q('#modal-title').textContent.trim()==='Midnight in Accra']);q('#modal-close').click();var sc=q('#trending-items');q('#row-trending .arrow.right').click();return wait(500).then(function(){r.push(["The right arrow scrolls the Trending row",sc.scrollLeft>0]);return r})`;

const REEL={t:"Final capstone 2: a streaming website",s:"Build a full streaming-style website from a blank page: a billboard hero, scrolling rows of posters drawn from data, hover effects, a details window, live search, and a My List that is saved between visits.",time:300,goals:["Render whole rows of a site from a data array","Build a modal window, a search filter and a saved list that work together","Match a polished desktop and phone design, and verify both"],
sec:[["A manageable build path",`<ol><li><b>Build the shell:</b> header, billboard and empty poster rows.</li><li><b>Show the data:</b> make one poster from the provided movie data, then render the rows.</li><li><b>Add interactions separately:</b> details window, search, My List, then the row arrows.</li><li><b>Polish:</b> test the controls and check the layout at phone size.</li></ol><p><b>Beginner first step:</b> build just the header and billboard in HTML and confirm they appear in the preview. Then add one poster from the provided data before building the full rows.</p>`],["The brief",`<p>This capstone recreates the <b>layout and behaviour</b> of a modern streaming site, the kind with a giant hero and rows of posters you can scroll sideways. The name, logo and artwork are all original (a made-up service called <b>Reelio</b>), which is exactly what a portfolio piece should use. There is <b>no starter HTML</b>: you write the page, the styles and the script. The movie data is given to you in the script.</p>`],["The build sheet",`<p>The checker finds your elements by these names.</p><ul><li><b>Header:</b> <code>header.nav</code> with <code>a.logo</code> (REELIO), <code>nav.links</code> of 3 links (the last holds <code>span#list-count</code>), and <code>input#search</code>.</li><li><b>Billboard:</b> <code>section.billboard</code> with <code>div.bb-text</code>: an <code>h1</code>, <code>p.desc</code>, and three buttons <code>.play</code>, <code>.add</code>, <code>.info</code>. Its background is <code>images/billboard.svg</code> with dark gradients layered on top.</li><li><b>Main:</b> <code>p#no-results</code> (hidden), <code>section.row#mylist-row</code> (hidden) with <code>div.scroller#mylist-items</code>, <code>section.row#row-trending</code> with <code>div.row-wrap</code> holding <code>button.arrow.left</code>, <code>div.scroller#trending-items</code>, <code>button.arrow.right</code>, and <code>section.row#row-comedy</code> with <code>div.scroller#comedy-items</code>. Each row has an <code>h2</code>.</li><li><b>Posters</b> are made by JavaScript: <code>div.poster</code> with <code>data-id</code>, an <code>img</code> (alt = title) and <code>div.poster-title</code>.</li><li><b>Details window:</b> <code>div#modal</code> (hidden) holding <code>button#modal-close</code>, <code>h3#modal-title</code>, <code>p#modal-meta</code>, <code>p#modal-desc</code> and <code>button#modal-list</code>.</li><li><b>Colours:</b> background #0a0a0e, text #f3f3f6, accent #ff4d6d.</li></ul>`],["The behaviour",`<ul><li><b>Rows:</b> Trending shows all 8 films. Comedies shows only the films whose genre is Comedy.</li><li><b>Details window:</b> clicking any poster (use one click listener on the document and <code>closest()</code>) fills and opens it. It shows the title and <i>2024 · Drama</i> style meta. The close button, the Escape key and a click on the dark backdrop all close it. <b>More info</b> opens it for the billboard film.</li><li><b>My List:</b> the window’s button toggles between <i>+ Add to My List</i> and <i>Remove from My List</i>. The menu count follows the list, the My List row appears only when it is not empty, and the list is saved in <code>localStorage</code> under <code>mylist</code> as an array of ids.</li><li><b>Search:</b> typing hides the posters whose title does not contain the text, in every row. If none match, show the no-results message.</li><li><b>Arrows:</b> the right and left arrows scroll the Trending row by 420px.</li><li><b>Hover:</b> posters grow slightly (<code>transform: scale</code>) with a transition.</li></ul><div class="tip"><b>A classic trap:</b> if you give <code>#modal</code> a <code>display</code> in CSS, the <code>hidden</code> attribute stops working, because your CSS wins. Add <code>#modal[hidden] { display: none; }</code>.</div>`],["The phone layout",`<p>Use the <b>screen</b> menu. Below 700px: nav 60px tall with the links hidden and a 150px search box, billboard 360px with a 36px title, smaller posters (110 × 165), side padding 16px, and no arrows (people swipe instead).</p>`],["How to work",`<ol><li>Build the static page first: nav, billboard and the three empty rows.</li><li>Write <code>makePoster</code> and <code>fill</code> and draw the rows from the data.</li><li>Add the modal, then the list and saving, then search, then the arrows.</li><li>Style it to match: use the measurements and Difference view.</li><li>Add the phone rules last. Then press <b>Check</b>: desktop measurements and behaviour first, then a reload at phone size to prove the list was saved.</li></ol>`],["Practice space",`<p>Try ideas here before the graded capstone below.</p>`]],

const SCSS=`:root{--bg:#faf7f2;--ink:#231f1c;--mute:#7a7066;--accent:#d4552b;--line:#e8e1d6}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}

const SJS=SDATA+`
const MONEY = function (n) { return "GH\u20b5 " + n.toFixed(2); };
const grid = document.querySelector("#products"), noProducts = document.querySelector("#no-products");
const drawer = document.querySelector("#drawer"), cartItems = document.querySelector("#cart-items");
let category = "all", query = "", sortBy = "featured";
let cart = JSON.parse(localStorage.getItem("cart") || "[]");
function saveCart() { localStorage.setItem("cart", JSON.stringify(cart)); }
function renderProducts() {
  let list = products.filter(function (p) {
    return (category === "all" || p.category === category) && p.name.toLowerCase().includes(query);
  });
  if (sortBy === "low") { list = list.slice().sort(function (a, b) { return a.price - b.price; }); }
  if (sortBy === "high") { list = list.slice().sort(function (a, b) { return b.price - a.price; }); }
  grid.innerHTML = "";
  list.forEach(function (p) {
    const card = document.createElement("article");
    card.className = "product"; card.dataset.id = p.id;
    card.innerHTML = '<img src="' + p.img + '" alt="' + p.name + '"><div class="p-name">' + p.name + '</div><div class="p-price">' + MONEY(p.price) + '</div><button class="add" data-id="' + p.id + '">Add to cart</button>';
    grid.appendChild(card);
  });
  noProducts.hidden = list.length > 0;
}
function renderCart() {
  cartItems.innerHTML = "";
  let subtotal = 0, count = 0;
  cart.forEach(function (line) {
    const p = products.find(function (x) { return x.id === line.id; });
    subtotal += p.price * line.qty; count += line.qty;
    const row = document.createElement("div");
    row.className = "cart-item"; row.dataset.id = p.id;
    row.innerHTML = '<span class="ci-name">' + p.name + '</span><span>' + MONEY(p.price * line.qty) + '</span><div class="ctl"><button class="dec" aria-label="Decrease">-</button><span class="qty">' + line.qty + '</span><button class="inc" aria-label="Increase">+</button><button class="remove">Remove</button></div>';
    cartItems.appendChild(row);
  });
  const delivery = subtotal === 0 || subtotal >= 300 ? 0 : 25;
  document.querySelector("#cart-count").textContent = count;
  document.querySelector("#cart-empty").hidden = cart.length > 0;
  document.querySelector("#subtotal").textContent = MONEY(subtotal);
  document.querySelector("#delivery").textContent = subtotal >= 300 ? "Free" : MONEY(delivery);
  document.querySelector("#total").textContent = MONEY(subtotal + delivery);
  saveCart();
}
function changeQty(id, step) {
  const line = cart.find(function (l) { return l.id === id; });
  if (!line) { return; }
  line.qty += step;
  if (line.qty <= 0) { cart = cart.filter(function (l) { return l.id !== id; }); }
  renderCart();
}
document.addEventListener("click", function (e) {
  const add = e.target.closest(".add");
  if (add) {
    const id = +add.dataset.id, line = cart.find(function (l) { return l.id === id; });
    if (line) { line.qty++; } else { cart.push({ id: id, qty: 1 }); }
    renderCart(); return;
  }
  const row = e.target.closest(".cart-item");
  if (row) {
    const id = +row.dataset.id;
    if (e.target.closest(".inc")) { changeQty(id, 1); }
    if (e.target.closest(".dec")) { changeQty(id, -1); }
    if (e.target.closest(".remove")) { cart = cart.filter(function (l) { return l.id !== id; }); renderCart(); }
  }
});
document.querySelectorAll(".cat-btn").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll(".cat-btn").forEach(function (x) { x.classList.remove("active"); });

  });
});
document.querySelector("#search").addEventListener("input", function (e) { query = e.target.value.trim().toLowerCase(); renderProducts(); });
document.querySelector("#sort").addEventListener("change", function (e) { sortBy = e.target.value; renderProducts(); });
document.querySelector("#cart-btn").addEventListener("click", function () { drawer.classList.add("open"); });
document.querySelector("#drawer-close").addEventListener("click", function () { drawer.classList.remove("open"); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { drawer.classList.remove("open"); } });
const form = document.querySelector("#checkout-form");
form.addEventListener("submit", function (e) {
  e.preventDefault();
  const name = form.querySelector("#c-name").value.trim(), phone = form.querySelector("#c-phone").value.trim(), address = form.querySelector("#c-address").value.trim();
  const eN = name ? "" : "Please enter your name";
  const eP = /^0\\d{9}$/.test(phone) ? "" : "Enter a 10-digit phone number starting with 0";
  const eA = address.length >= 5 ? "" : "Please enter your delivery address";
  document.querySelector("#e-name").textContent = eN; document.querySelector("#e-phone").textContent = eP; document.querySelector("#e-address").textContent = eA;
  const msg = document.querySelector("#order-msg");
  if (eN || eP || eA) { msg.textContent = ""; return; }
  if (cart.length === 0) { msg.textContent = "Your cart is empty."; return; }
  msg.textContent = "Thank you, " + name + "! Order placed. Total: " + document.querySelector("#total").textContent;
  cart = []; renderCart(); form.reset();
});
renderProducts();

const SHOP={t:"Final capstone 3: an online shop",s:"Build a complete online shop from a blank page: a product grid drawn from data, category filters, search and sorting, a shopping cart drawer with quantities and delivery rules, a validated checkout, and a cart that is remembered.",time:360,goals:["Model a real shop: products, a cart, totals and delivery rules","Keep state in arrays and rebuild the page from it after every change","Match a polished desktop and phone design, and verify both"],
sec:[["A manageable build path",`<ol><li><b>Build the shell:</b> header, toolbar, product area and cart drawer.</li><li><b>Show products:</b> render one product from the provided data, then fill the grid.</li><li><b>Make shopping work:</b> add filters and search, then add-to-cart and quantity controls.</li><li><b>Finish the flow:</b> show the cart total and delivery message, validate checkout, and save the cart.</li><li><b>Polish:</b> test each action and check the layout at phone size.</li></ol><p><b>Beginner first step:</b> make the header and empty product area, then render one product from the supplied data. Grow that working example into the full grid.</p>`],["The brief",`<p>This is the biggest capstone: an e-commerce site called <b>Sika Market</b> (a made-up Ghanaian craft shop, so the branding is all yours). There is <b>no starter HTML</b>. The product data is given to you in the script, and everything else is yours to build. A real shop is mostly <b>state</b> (what is in the cart) and <b>rendering</b> (drawing the page from that state), which is exactly what you have practised in the to-do app, the quiz and the gallery.</p>`],
["The build sheet",`<p>The checker finds your elements by these names.</p><ul><li><b>Header:</b> <code>header.nav</code> with <code>a.logo</code>, <code>input#search</code> and <code>button#cart-btn</code> that contains <code>span#cart-count</code>.</li><li><b>Promo:</b> <code>section.promo</code> with an <code>h1</code> and a <code>p</code>.</li><li><b>Toolbar:</b> <code>div.cats</code> with four <code>button.cat-btn</code> (data-cat: all, Clothing, Home, Accessories; the first has the class active) and <code>select#sort</code> with values featured, low and high.</li><li><b>Products:</b> <code>div#products</code> filled by JavaScript with <code>article.product</code>, each holding an <code>img</code> (alt = name), <code>div.p-name</code>, <code>div.p-price</code> and <code>button.add</code>. Also <code>p#no-products</code> (hidden).</li><li><b>Cart drawer:</b> <code>aside#drawer</code> with <code>button#drawer-close</code>, <code>p#cart-empty</code>, <code>div#cart-items</code> (rows are <code>div.cart-item</code> with <code>.ci-name</code>, <code>.qty</code>, <code>button.dec</code>, <code>button.inc</code>, <code>button.remove</code>), the totals <code>#subtotal</code>, <code>#delivery</code>, <code>#total</code>, and <code>form#checkout-form</code> with <code>#c-name</code>, <code>#c-phone</code>, <code>#c-address</code>, errors <code>#e-name</code>, <code>#e-phone</code>, <code>#e-address</code>, and <code>p#order-msg</code>.</li><li><b>Colours:</b> background #faf7f2, text #231f1c, accent terracotta #d4552b.</li></ul>`],
["The rules of the shop",`<ul><li><b>Money</b> is shown as <i>GH\u20b5 120.00</i> (two decimals).</li><li><b>Filters</b> combine: the category, the search text and the sort order all apply together. Rebuild the grid from the data every time.</li><li><b>Cart:</b> Add to cart adds a line, or raises its quantity. The badge shows the <b>total quantity</b>. Plus and minus change it, and minus at 1 removes the line. Remove deletes a line.</li><li><b>Totals:</b> subtotal is the sum of price \u00d7 quantity. <b>Delivery is GH\u20b5 25.00, and Free for a subtotal of GH\u20b5 300.00 or more.</b> Total = subtotal + delivery.</li><li><b>The drawer</b> slides in from the right (class <code>open</code>). The cart button opens it, and the close button and the Escape key close it.</li><li><b>Checkout:</b> the exact messages are <i>Please enter your name</i>, <i>Enter a 10-digit phone number starting with 0</i> and <i>Please enter your delivery address</i>. A valid order shows <i>Thank you, NAME! Order placed. Total: GH\u20b5 145.00</i> (using the real total), and empties the cart. An empty cart shows <i>Your cart is empty.</i></li><li><b>Saving:</b> the cart is saved in <code>localStorage</code> under <code>cart</code> as an array of <code>{ id, qty }</code> and comes back after a reload.</li></ul>`],
["The phone layout",`<p>Use the <b>screen</b> menu. Below 700px: the products are <b>two per row</b> with a 12px gap, pictures 130px tall, the promo is 180px with a 28px title, the search box moves below the logo and fills the width, and the cart drawer fills the whole screen.</p>`],

use."],["Screen reader","Software that reads a page aloud for people who cannot see it."],["Comment","A note to yourself in code that the browser ignores: <!-- like this -->."],["Pixel (px)","One tiny dot on a screen. Sizes are often measured in pixels."],["Form validation","Checks that a form is filled in correctly before it is sent, such as a required field or a valid email."],["Pattern","A description of the shape that text must have. 0[0-9]{9} means a 0 followed by nine digits."],["GET and POST","Two ways to send a form. GET puts the answers in the address. POST hides them in the body of the request."],["Placeholder","Faint hint text inside an empty box. It disappears when you type, so it never replaces a label."],["Name attribute","The label on a form answer. Only inputs that have a name are sent."],["CSS","Cascading Style Sheets. The rules that say how HTML elements look."],["Selector","The part of a CSS rule that picks which elements to style."],["Specificity","A score for how precise a selector is. The higher score wins when rules disagree."],["Box model","Every element is a box: content, then padding, border and margin around it."],["box-sizing","border-box makes width include padding and border, so sizes are predictable."],["Flexbox","A layout system that arranges items in a row or a column and spaces and aligns them."],["Grid","A layout system for rows and columns together."],["fr unit","A fraction of the free space in a grid. 1fr 2fr gives the second column twice the share."],["Media query","A CSS condition, such as a minimum screen width, that switches rules on."],["Mobile-first","Writing the small-screen layout first, then adding rules for wider screens."],["Pseudo-class","A state or position of an element, like :hover or :first-child."],["Pseudo-element","A part of an element you can style, like ::before or ::first-letter."],["Transition","A smooth change from one style to another over time."],["Keyframes","The steps of an animation, written with @keyframes."],["Custom property","A CSS variable such as --brand, read back with var(--brand)."],["rem","A unit equal to the page\u2019s base text size, usually 16px."]].sort((a,b)=>a[0].localeCompare(b[0]));
