{t:"HTML: validating forms and sending data",s:"Make the browser check answers before they are sent, and see exactly what a form sends.",time:30,
goals:["Use required, minlength, min, max and pattern","Explain why a server must always check again","Say what GET and POST do and why name matters"],
sec:[["Let the browser check first",`<p><b>Validation</b> means checking that an answer is acceptable before it is sent. HTML does a lot of it with no code:</p><ul><li><code>required</code>: cannot be left empty.</li><li><code>minlength</code> and <code>maxlength</code>: how many characters.</li><li><code>min</code> and <code>max</code>: limits for numbers and dates.</li><li><code>type="email"</code> and <code>type="url"</code>: must look like an email or a web address.</li><li><code>pattern</code>: the text must match a shape.</li></ul><p>A <b>pattern</b> is a tiny description. <code>[0-9]</code> means one digit, and <code>{9}</code> means nine of them. So <code>pattern="0[0-9]{9}"</code> means: a 0 followed by exactly nine digits, a 10-digit Ghana phone number. Add a <code>title</code> to explain the rule when it fails.</p>`],
["Never trust the browser alone",`<div class="tip"><b>Important:</b> browser checks are a kindness to honest visitors. They are <b>not security</b>. Anyone can switch them off or send data without your form at all. The server that receives the data must check everything again. Remember this when you build the back end.</div>`],
["What actually gets sent",`<p>When someone presses submit, the browser collects every input that has a <code>name</code> and sends <b>name=value</b> pairs, like <code>name=Ama&amp;age=21</code>.</p><ul><li><code>action</code> says <b>where</b> to send it. <code>method</code> says how.</li><li><code>GET</code> puts the pairs in the address, like asking a question out loud. Good for searches.</li><li><code>POST</code> puts them inside the request, like handing over an envelope. Use it for logins and anything private.</li></ul><p>The example below shows you the pairs your form would send. Copy that little script for now. You will understand it in the JavaScript part.</p>`],
["Your turn",`<p>Try submitting with the name empty, then with one letter, then with an age of 10. Notice the messages. Then give the name box a different <code>name</code> and see the data change.</p>`]],
ex:`<form id="f">\n  <label for="n">Name</label>\n  <input id="n" name="name" type="text" required minlength="2">\n  <label for="a">Age (18 to 99)</label>\n  <input id="a" name="age" type="number" min="18" max="99">\n  <button type="submit">Send</button>\n</form>\n<p id="out">The data will appear here.</p>\n<script>\n  // Copy this for now. You will learn how it works later.\n  const f = document.getElementById("f");\n  f.addEventListener("submit", function (e) {\n    e.preventDefault();\n    document.getElementById("out").textContent = new URLSearchParams(new FormData(f)).toString();\n  });\n<\/script>`,
ch:[{ty:"Fix the bug",p:"This form would send nothing useful, because the inputs have no names. Give every input a different name.",st:`<form>\n  <input type="text" placeholder="Your name">\n  <input type="email" placeholder="Your email">\n  <input type="number" placeholder="Your age">\n  <button type="submit">Send</button>\n</form>`,k:`var a=document.querySelectorAll('form input');var names=[];a.forEach(function(i){names.push(i.getAttribute('name'))});return [["All three inputs have a name",a.length>=3&&names.every(function(x){return !!x})],["Every name is different",names.every(function(x){return !!x})&&new Set(names).size===names.length]]`,h:"Add name=\"fullname\", name=\"email\" and name=\"age\" inside the opening input tags.",sol:`<form>\n  <input type="text" name="fullname" placeholder="Your name">\n  <input type="email" name="email" placeholder="Your email">\n  <input type="number" name="age" placeholder="Your age">\n  <button type="submit">Send</button>\n</form>`},
{p:"Build a form with: a required name box of at least 2 characters, a required email box, a phone box that only accepts a 0 followed by nine digits, and an age box between 18 and 99. Give every input a name.",st:`<form>\n  <!-- your fields here -->\n</form>`,k:`var q=function(s){return document.querySelector(s)};var p=q('input[type=tel]');return [["A required text input with minlength 2",!!q('input[type=text][required][minlength="2"]')],["A required email input",!!q('input[type=email][required]')],["A phone box (tel) with a pattern",!!p&&p.hasAttribute('pattern')&&new RegExp('^(?:'+p.getAttribute('pattern')+')$').test('0241234567')&&!new RegExp('^(?:'+p.getAttribute('pattern')+')$').test('12345')],["A number input with min 18 and max 99",!!q('input[type=number][min="18"][max="99"]')],["Every input has a name",document.querySelectorAll('input:not([name])').length===0&&document.querySelectorAll('input').length>=4]]`,h:"The pattern is 0[0-9]{9}. Write it as pattern=\"0[0-9]{9}\" on an input with type=\"tel\".",sol:`<form>\n  <input type="text" name="n" required minlength="2">\n  <input type="email" name="e" required>\n  <input type="tel" name="t" pattern="0[0-9]{9}">\n  <input type="number" name="a" min="18" max="99">\n</form>`}],
quiz:[["What does pattern=\"[0-9]{10}\" accept?",["Exactly ten digits","Any ten letters","At most ten words"],0,"[0-9] is one digit and {10} means ten of them."],["Why must the server check the data again?",["Browsers are slow","Browser checks can be bypassed by anyone","Servers like extra work"],1,"Browser validation is for convenience, not security."]]},

{t:"Project: build a sign-up form",s:"Build a complete, accessible, validated sign-up form from a blank skeleton, and check it against a list of requirements.",time:45,
goals:["Plan a form by choosing a type for every field","Combine labels, validation, fieldset and a submit button in one form","Use the checklist to find what is missing"],
sec:[["The brief",`<p>Build the sign-up form for a club or app of your choice. It must contain:</p><ul><li>A <code>form</code> with <code>method="post"</code>, and a fieldset with a legend.</li><li>A required name, a required email, a password of at least 8 characters, and a phone box that only accepts a 0 plus nine digits.</li><li>A date (birthday), a country select with three or more options, two plan radio buttons that share a name, a textarea, and a required “I agree” checkbox.</li><li>A submit button.</li><li>Every input must have a <b>name</b> and a <b>label connected to it</b>.</li></ul>`],
["Work in this order",`<ol><li>List each field and choose its type.</li><li>Write the empty form, fieldset and button.</li><li>Add fields one at a time: label, input, name, id.</li><li>Press Check and read the ✗ items.</li></ol>`],
["Practice space",`<p>Experiment here. The graded project is the next box.</p>`]],
ex:`<form>\n  <label for="x">Try a field</label>\n  <input id="x" name="x" type="text">\n</form>`,
ch:[{ty:"Project",p:"Build the sign-up form from the brief. Use the checklist to see what is still missing.",st:`<form>\n  <!-- Add method="post" to the form above, then:\n       fieldset and legend\n       name, email, password, phone, birthday\n       country select, plan radios, about textarea\n       an I agree checkbox\n       a submit button -->\n</form>`,k:`var d=document,q=function(s){return d.querySelector(s)},n=function(s){return d.querySelectorAll(s).length};var ins=d.querySelectorAll('form input');var an=true,al=true;ins.forEach(function(i){if(!i.getAttribute('name'))an=false;if(!(i.id&&d.querySelector('label[for="'+i.id+'"]')))al=false});var r=d.querySelectorAll('input[type=radio]');return [["A form that uses method post",!!q('form[method=post]')],["A fieldset with a legend",!!q('form fieldset legend')],["A required text input for the name",!!q('input[type=text][required]')],["A required email input",!!q('input[type=email][required]')],["A password input with minlength 8",!!q('input[type=password][minlength="8"]')],["A phone (tel) input with a pattern",!!q('input[type=tel][pattern]')],["A date input",!!q('input[type=date]')],["A select with at least 3 options",n('form select option')>=3],["Two radio buttons sharing a name",r.length>=2&&!!r[0].name&&r[0].name===r[1].name],["A textarea",!!q('form textarea')],["A required checkbox",!!q('input[type=checkbox][required]')],["A submit button",!!q('form button[type=submit]')],["Every input has a name",ins.length>0&&an],["Every input is connected to a label",ins.length>0&&al]]`,h:"Read each ✗. Radio buttons need the same name but different ids. Every label needs a for that matches an input id.",sol:`<form action="/signup" method="post">\n  <fieldset>\n    <legend>Create account</legend>\n    <label for="n">Full name</label><input id="n" name="name" type="text" required>\n    <label for="e">Email</label><input id="e" name="email" type="email" required>\n    <label for="p">Password</label><input id="p" name="password" type="password" minlength="8" required>\n    <label for="t">Phone</label><input id="t" name="phone" type="tel" pattern="0[0-9]{9}">\n    <label for="b">Birthday</label><input id="b" name="birthday" type="date">\n    <label for="c">Country</label><select id="c" name="country"><option>Ghana</option><option>Nigeria</option><option>Kenya</option></select>\n    <label for="g1">Free plan</label><input id="g1" name="plan" type="radio" value="free">\n    <label for="g2">Pro plan</label><input id="g2" name="plan" type="radio" value="pro">\n    <label for="m">About you</label><textarea id="m" name="about"></textarea>\n    <label for="a">I agree</label><input id="a" name="agree" type="checkbox" required>\n  </fieldset>\n  <button type="submit">Sign up</button>\n</form>`}],
quiz:[["Radio buttons must share what, so only one can be chosen?",["The same id","The same name","The same label"],1,"The shared name groups them. Each still needs its own id."],["What happens to an input with no name when the form is sent?",["It is sent as empty","It is not sent at all","It becomes required"],1,"Only inputs with a name are included in the data."]]}

Object.assign(BM,{s:"Every element on a page is a rectangle with four layers. See them, play with them, and learn to work out exactly how big a box is.",time:35,
goals:["Name the four layers of a box in order, from the inside out","Say the difference between padding, border and margin","Calculate how wide a box really is, and fix it with box-sizing","Use shorthand values and centre a box with margin auto"],
sec:[["Everything is a box",`<p>Here is the most important idea in CSS: <b>every element on a web page is a rectangular box.</b> A heading is a box. A paragraph is a box. Even a single link is a box. Picture a framed photograph on a wall. From the middle outwards it has four layers:</p><svg viewBox="0 0 360 250" style="width:100%;max-width:520px;height:auto;display:block;margin:10px auto" role="img" aria-label="The box model: content in the middle, then padding, then border, then margin around the outside"><rect x="4" y="4" width="352" height="242" rx="6" fill="rgba(217,138,11,.2)" stroke="#d98a0b" stroke-dasharray="6 4"/><rect x="56" y="48" width="248" height="154" fill="#7a5a2b"/><rect x="72" y="64" width="216" height="122" fill="rgba(28,160,80,.6)"/><rect x="116" y="94" width="128" height="62" fill="rgba(60,120,220,.85)"/><g style="font:600 13px sans-serif"><text x="14" y="24" style="fill:var(--ink)">MARGIN: empty space outside</text><text x="64" y="60" fill="#fff" style="font-size:11px">BORDER: the frame</text><text x="80" y="81" fill="#fff" style="font-size:11px">PADDING: space inside</text><text x="180" y="129" fill="#fff" text-anchor="middle">CONTENT</text></g></svg><ul><li><b>Content</b> is the photo itself: your text or picture.</li><li><b>Padding</b> is the white card between the photo and the frame. It is <i>inside</i> the box, so the box’s background colour fills it.</li><li><b>Border</b> is the frame.</li><li><b>Margin</b> is the empty wall between this frame and the next one. It is <i>outside</i> the box and always see-through.</li></ul>`],
["Play with the layers",`<p>Drag the sliders and watch the box change. The <b style="color:#2f6fdc">blue</b> square is the content, the <b style="color:#1c8a4a">green</b> layer is the padding, the <b style="color:#7a5a2b">brown</b> ring is the border, and the <b style="color:#d98a0b">striped orange</b> area is the margin.</p><div class="bmlab" id="bm" style="--p:20px;--b:6px;--m:20px"><div class="bmm"><div class="bmb"><div class="bmp"><div class="bmc">content<br>160 × 60</div></div></div></div></div><div class="bmctl"><label>padding <input type="range" min="0" max="50" value="20" data-bm="p" aria-label="Padding"><output id="o-p">20px</output></label><label>border <input type="range" min="0" max="20" value="6" data-bm="b" aria-label="Border"><output id="o-b">6px</output></label><label>margin <input type="range" min="0" max="50" value="20" data-bm="m" aria-label="Margin"><output id="o-m">20px</output></label></div><p class="fb" id="bmr">The box on screen is <b>160 + 2×20 (padding) + 2×6 (border) = 212px</b> wide. With its margin it takes up <b>252px</b> of space.</p><p>Notice: padding and border make the box <i>bigger</i>. Margin does not change the box. It only pushes other things away.</p>`],
["How wide is a box, really?",`<p>Here is the surprise that confuses almost every beginner. If you write:</p><p><code>width: 200px; padding: 20px; border: 4px solid;</code></p><p>you might expect a box 200px wide. But by default, <code>width</code> sets the <b>content only</b>. The padding and border are added around it:</p><p><b>200 + 20 + 20 (padding) + 4 + 4 (border) = 248px</b></p><p>That is hard to predict. So almost every professional starts their CSS with this line:</p><p><code>* { box-sizing: border-box; }</code></p><p>It changes the rule: now <code>width</code> means the <b>whole box</b>, padding and border included. Set <code>width: 200px</code> and you get exactly 200px, and the content shrinks to fit. The <code>*</code> means “every element”. Use it in every project.</p>`],
["Shorthand, centring and margins",`<ul><li><code>padding: 10px</code> sets all four sides.</li><li><code>padding: 10px 20px</code> means 10px top and bottom, 20px left and right.</li><li><code>padding: 10px 20px 30px 40px</code> goes <b>clockwise from the top</b>: top, right, bottom, left. A helpful memory word is <b>TRouBLe</b>.</li><li>One side only: <code>margin-top</code>, <code>padding-left</code>, and so on.</li><li><b>Centre a box:</b> give it a width, then <code>margin: 0 auto;</code>. “Auto” tells the browser to share the leftover space equally on both sides.</li><li><b>Margins between blocks merge.</b> When one box sits above another, their touching margins do not add up. The larger one wins. This is called margin collapse.</li></ul><div class="tip"><b>See it on any website:</b> right-click an element, choose Inspect, and find the Computed tab. Browsers draw this same coloured diagram for the element, with real numbers.</div>`],
["Your turn",`<p>Press Run. Change <code>box-sizing</code> from <code>content-box</code> to <code>border-box</code> and watch the first box shrink to exactly 200px. Then try <code>margin: 0 auto</code> on the second box.</p>`]],
we:{t:"working out a box’s size",s:[["Read the rule",".card {\n  width: 200px;\n  padding: 20px;\n  border: 4px solid black;\n  margin: 10px;\n}","Find the four numbers: width, padding, border, margin."],["Add up the visible box","width     200\npadding   20 + 20\nborder    4 + 4\n-----------\nbox       248px wide","Padding and border sit on both sides, so count each twice."],["Add the margin for the space it takes","248 + 10 + 10 = 268px","Margin is not part of the box. It is the space reserved around it."]]},
ex:`<style>\n  .a { box-sizing: content-box; width: 200px; padding: 20px; border: 4px solid navy; background: lightyellow; }\n  .b { box-sizing: border-box; width: 200px; padding: 20px; border: 4px solid darkgreen; background: #e4f2e7; margin-top: 12px; }\n</style>\n<div class="a">Box A: content-box (248px)</div>\n<div class="b">Box B: border-box (200px)</div>`,
ch:[{p:"Make .card exactly 300px wide in total, including 20px of padding on every side and a 5px solid border. Use box-sizing so the total stays 300px.",st:`<style>\n  .card { }\n</style>\n<div class="card">Exactly 300px wide</div>`,k:`var s=getComputedStyle(document.querySelector(".card"));return [["box-sizing is border-box",s.boxSizing==="border-box"],["width is 300px",s.width==="300px"],["padding is 20px",s.paddingLeft==="20px"&&s.paddingTop==="20px"],["border is 5px",s.borderLeftWidth==="5px"]]`,h:"Four declarations: box-sizing: border-box; width: 300px; padding: 20px; border: 5px solid black;",sol:`<style>\n  .card { box-sizing: border-box; width: 300px; padding: 20px; border: 5px solid black; }\n</style>\n<div class="card">Exactly 300px wide</div>`},
{p:"Centre the 300px-wide .box horizontally using margin.",st:`<style>\n  .box { width: 300px; background: gold; padding: 10px; }\n</style>\n<div class="box">Centre me</div>`,k:`var s=getComputedStyle(document.querySelector(".box"));return [["Left and right margins are equal",s.marginLeft===s.marginRight],["The margins are not zero",s.marginLeft!=="0px"]]`,h:"Add margin: 0 auto; to the .box rule.",sol:`<style>\n  .box { width: 300px; background: gold; padding: 10px; margin: 0 auto; }\n</style>\n<div class="box">Centre me</div>`},
{p:"Write ONE padding declaration that gives the box 10px on top, 20px on the right, 30px on the bottom and 40px on the left.",st:`<style>\n  .tag { background: gold; }\n</style>\n<p class="tag">Padded</p>`,k:`var s=getComputedStyle(document.querySelector(".tag"));return [["Top 10px",s.paddingTop==="10px"],["Right 20px",s.paddingRight==="20px"],["Bottom 30px",s.paddingBottom==="30px"],["Left 40px",s.paddingLeft==="40px"]]`,h:"Clockwise from the top: padding: 10px 20px 30px 40px;",sol:`<style>\n  .tag { background: gold; padding: 10px 20px 30px 40px; }\n</style>\n<p class="tag">Padded</p>`}],
quiz:[["From the inside out, what is the order of the box layers?",["Margin, border, padding, content","Content, padding, border, margin","Content, border, padding, margin"],1,"Content, then padding, then border, then margin."],["A box has width: 200px, padding: 20px and a 4px border, with the default box-sizing. How wide is it on screen?",["200px","224px","248px"],2,"200 + 20 + 20 + 4 + 4 = 248px. Padding and border count on both sides."],["Which layer is always see-through and never changes the box’s own size?",["Padding","Border","Margin"],2,"Margin is empty space outside the box."]]});
const N5=[
{t:"CSS: selectors",s:"Selectors choose which elements a rule applies to. Learn to pick exactly the ones you want, like pointing at them in a crowd.",time:30,
goals:["Say the three places CSS can live","Select by tag, class, id and position in the page","Use descendant, child and grouping selectors"],
sec:[["Where CSS lives",`<ul><li><b>Inline:</b> a <code>style</code> attribute on one tag. Quick, but messy. Avoid it.</li><li><b>Internal:</b> a <code>&lt;style&gt;</code> tag in the head. Fine for one page.</li><li><b>External:</b> a separate file linked with <code>&lt;link rel="stylesheet" href="style.css"&gt;</code> in the head. This is the professional way, because one file styles every page of your site. <b>You are already doing this:</b> the <code>styles.css</code> tab in the editor is linked to <code>index.html</code> by exactly this kind of tag.</li></ul>`],
["The basic selectors",`<ul><li><b>Tag:</b> <code>p { }</code> picks every paragraph.</li><li><b>Class:</b> <code>.note { }</code> picks everything with <code>class="note"</code>. Many elements can share a class.</li><li><b>Id:</b> <code>#cta { }</code> picks the one element with <code>id="cta"</code>.</li><li><b>Everything:</b> <code>* { }</code>.</li><li><b>Grouping:</b> <code>h1, h2, h3 { }</code> applies one rule to several selectors. The commas mean “and”.</li></ul>`],
["The family tree",`<p>HTML elements form a family tree. An element inside another is its <b>child</b>, and everything inside it, however deep, is a <b>descendant</b>. Selectors can use these relationships:</p><ul><li><b>Descendant</b> (a space): <code>nav a { }</code> picks every link anywhere inside a nav.</li><li><b>Child</b> (<code>&gt;</code>): <code>ul &gt; li { }</code> picks only list items directly inside a ul, not ones in a nested list.</li><li><b>Next sibling</b> (<code>+</code>): <code>h1 + p { }</code> picks the paragraph right after an h1.</li><li><b>Combined</b> (no space): <code>p.note { }</code> picks paragraphs that also have the class note.</li><li><b>Attribute:</b> <code>a[target] { }</code> picks links that have a target attribute.</li></ul>`],
["Your turn",`<p>Change <code>nav a</code> to <code>a</code> and see what else turns green. Then try <code>ul &gt; li</code> instead of <code>li</code>.</p>`]],
ex:`<style>\n  nav a { color: green; }\n  .note { background: gold; }\n  ul > li { color: royalblue; }\n</style>\n<nav><a href="#">Home</a> <a href="#">About</a></nav>\n<p>A normal paragraph.</p>\n<p class="note">A noted paragraph.</p>\n<ul><li>One</li><li>Two</li></ul>\n<a href="#">A link outside the nav</a>`,
ch:[{p:"Use selectors to: make links inside nav green, give the element with id cta a gold background, and make only the list items directly inside the ul blue.",st:`<style>\n  /* your rules here */\n</style>\n<nav><a href="#">Home</a><a href="#">About</a></nav>\n<ul><li>One</li><li>Two</li></ul>\n<a href="#" id="cta">Join</a>`,k:`var g=function(s){return getComputedStyle(document.querySelector(s))};return [["Links in the nav are green",g('nav a').color==="rgb(0, 128, 0)"],["The link with id cta has a gold background",g('#cta').backgroundColor==="rgb(255, 215, 0)"],["The cta link is not green",g('#cta').color!=="rgb(0, 128, 0)"],["List items in the ul are blue",g('ul > li').color==="rgb(0, 0, 255)"]]`,h:"nav a { color: green; }   #cta { background: gold; }   ul > li { color: blue; }",sol:`<style>\n  nav a { color: green; }\n  #cta { background: gold; }\n  ul > li { color: blue; }\n</style>\n<nav><a href="#">Home</a><a href="#">About</a></nav>\n<ul><li>One</li><li>Two</li></ul>\n<a href="#" id="cta">Join</a>`}],
quiz:[["What does ul &gt; li select?",["All li elements anywhere inside a ul","Only li elements directly inside a ul","The ul and the li"],1,"The &gt; symbol means direct child only."],["Which is the professional place to put CSS?",["Inline style attributes","A separate linked file","Inside the body"],1,"One external file can style every page of a site."]]},

{t:"CSS: the cascade, inheritance and specificity",s:"What happens when two rules disagree? CSS has exact rules for deciding who wins.",time:30,
goals:["Explain why CSS is called Cascading","Work out which of two rules wins using a specificity score","Know which properties are inherited"],
sec:[["When rules fight",`<p>Several rules can try to style the same element. CSS settles it using three tie-breakers, in this order:</p><ol><li><b>Importance:</b> a declaration marked <code>!important</code> beats everything. Avoid it. It makes CSS very hard to fix later.</li><li><b>Specificity:</b> the more precise selector wins.</li><li><b>Order:</b> if everything else is equal, the rule written <b>later</b> wins.</li></ol>`],
["Specificity: a scoreboard",`<p>Count what is in the selector. Ids are worth the most, then classes, then tags:</p><ul><li><code>p</code> scores <b>0-0-1</b> (one tag).</li><li><code>.note</code> scores <b>0-1-0</b> (one class).</li><li><code>p.note</code> scores <b>0-1-1</b>.</li><li><code>#intro</code> scores <b>1-0-0</b> (one id).</li><li><code>#wrap .note</code> scores <b>1-1-0</b>.</li></ul><p>Compare left to right, like comparing 2-0-0 with 1-9-9: the first number decides. So one id always beats any number of classes. Inline styles beat all of these.</p><div class="tip"><b>Habit of professionals:</b> style with classes, not ids, and keep selectors short. Then you rarely fight with specificity.</div>`],
["Inheritance",`<p>Some properties are handed down from parent to child automatically, like a family trait. <b>Text properties are inherited</b>: <code>color</code>, <code>font-family</code>, <code>font-size</code>, <code>line-height</code>, <code>text-align</code>. <b>Box properties are not</b>: <code>border</code>, <code>padding</code>, <code>margin</code>, <code>background</code>. That is why setting <code>body { font-family: Georgia; }</code> once styles the whole page.</p>`],
["Your turn",`<p>Run it and see which colour wins. Then change <code>.note</code> to <code>#wrap .note</code>.</p>`]],
ex:`<style>\n  #wrap p { color: black; }\n  .note { color: purple; }\n</style>\n<div id="wrap"><p class="note">Which colour am I?</p></div>`,
ch:[{ty:"Fix the bug",p:"The paragraph should be purple, but the #wrap p rule beats .note. Fix it without using !important.",st:`<style>\n  #wrap p { color: black; }\n  .note { color: purple; }\n</style>\n<div id="wrap"><p class="note">Make me purple</p></div>`,k:`return [["The paragraph is purple",getComputedStyle(document.querySelector('.note')).color==="rgb(128, 0, 128)"],["!important is not used",document.querySelector('style').textContent.indexOf('!important')<0]]`,h:"Make the purple rule score higher: #wrap .note scores 1-1-0, which beats #wrap p at 1-0-1.",sol:`<style>\n  #wrap p { color: black; }\n  #wrap .note { color: purple; }\n</style>\n<div id="wrap"><p class="note">Make me purple</p></div>`},
{p:"Make every paragraph navy and Georgia by writing ONE rule on body, not on p.",st:`<style>\n  /* one rule here */\n</style>\n<p>One</p>\n<p>Two</p>`,k:`var ps=document.querySelectorAll('p');var ok=true;ps.forEach(function(p){var s=getComputedStyle(p);if(s.color!=="rgb(0, 0, 128)"||s.fontFamily.toLowerCase().indexOf("georgia")<0)ok=false});return [["Every paragraph is navy and Georgia",ps.length===2&&ok],["The rule is written on body",/body\\s*\\{/.test(document.querySelector('style').textContent)]]`,h:"body { color: navy; font-family: Georgia, serif; } Paragraphs inherit both.",sol:`<style>\n  body { color: navy; font-family: Georgia, serif; }\n</style>\n<p>One</p>\n<p>Two</p>`}],
quiz:[["Which selector is the most specific?",["p.note","#intro",".a .b .c"],1,"An id (1-0-0) beats any number of classes."],["Which property is inherited by child elements?",["border","color","margin"],1,"Text properties like color pass down. Box properties do not."]]},

{t:"CSS: units and sizing",s:"Pixels, percentages, rem, vw: what each unit measures from, and when to use it.",time:25,
goals:["Tell absolute and relative units apart","Choose between px, %, rem and vw","Use max-width so images and boxes never overflow"],
sec:[["Absolute and relative",`<p>Units come in two families.</p><ul><li><b>Absolute:</b> <code>px</code> (pixels). Always the same size, like a measurement in centimetres.</li><li><b>Relative:</b> measured against something else, so they flex with the situation.</li></ul>`],
["The relative units",`<ul><li><code>%</code>: a percentage of the <b>parent</b>. <code>width: 50%</code> is half as wide as the parent.</li><li><code>rem</code>: a multiple of the <b>page’s base text size</b>, which is 16px by default. So <code>1.5rem</code> is 24px, and it scales if the user raises their text size. Best for font sizes and spacing.</li><li><code>em</code>: a multiple of the element’s <b>own</b> font size. Easy to get tangled in, so prefer rem.</li><li><code>vw</code> and <code>vh</code>: 1% of the browser window’s width or height. <code>height: 100vh</code> fills the screen.</li></ul>`],
["Flexible boxes",`<p>Instead of a fixed <code>width</code>, use limits: <code>max-width: 600px</code> means “as wide as you like, up to 600px”. Also <code>min-width</code>, <code>min-height</code> and <code>max-height</code>. For pictures, the classic rule is <code>img { max-width: 100%; height: auto; }</code>. It stops a picture ever overflowing its box.</p>`],
["Your turn",`<p>Change the rem and the percentage and watch the box react. Then try <code>vw</code>.</p>`]],
ex:`<style>\n  .parent { width: 400px; background: #e4f2e7; padding: 10px; }\n  .child { width: 50%; font-size: 1.5rem; background: gold; }\n</style>\n<div class="parent"><div class="child">50% of parent, 1.5rem text</div></div>`,
ch:[{p:"Make .child half as wide as its parent using a percentage, give it text of 1.5rem, and a max-width of 300px.",st:`<style>\n  .parent { width: 400px; }\n  .child { background: gold; }\n</style>\n<div class="parent"><div class="child">Half width</div></div>`,k:`var s=getComputedStyle(document.querySelector('.child'));var fs=s.fontSize,w=s.width;return [["The width is 50% of the parent",w==="50%"||Math.abs(parseFloat(w)-200)<2],["The font size is 1.5rem (24px)",fs==="24px"||fs==="1.5rem"],["max-width is 300px",s.maxWidth==="300px"]]`,h:"width: 50%; font-size: 1.5rem; max-width: 300px;",sol:`<style>\n  .parent { width: 400px; }\n  .child { background: gold; width: 50%; font-size: 1.5rem; max-width: 300px; }\n</style>\n<div class="parent"><div class="child">Half width</div></div>`}],
quiz:[["Percentage widths are measured against what?",["The screen","The parent element","The font size"],1,"A percentage is a share of the parent’s size."],["Why prefer rem for font sizes?",["It is smaller","It scales with the user’s text-size setting","It is faster"],1,"rem is relative to the base text size, which users can change."]]}
];

Object.assign(FX,{s:"The layout tool every developer uses daily. Understand the two axes and the container-and-items idea, and everything else follows.",time:40,
goals:["Explain what a flex container and flex items are","Name the main axis and the cross axis, and say how flex-direction swaps them","Use justify-content, align-items and gap to arrange items","Centre anything, horizontally and vertically"],
sec:[["The problem flexbox solves",`<p>Left alone, boxes stack one under the other, like plates in a pile. To put boxes <b>side by side</b>, to space them evenly, or to centre one in a space, designers used to use clumsy tricks. <b>Flexbox</b> was invented to do it properly. Think of a corridor with people standing in it: flexbox decides which way they line up, how much space is between them, and where along the corridor they stand.</p>`],
["Container and items",`<p>Flexbox always has two parts:</p><ul><li>The <b>container</b> is the parent. You write <code>display: flex;</code> on it.</li><li>The <b>items</b> are its <b>direct children</b>. They line up in a row automatically.</li></ul><p>Remember: <b>you give the orders to the container, and the items obey.</b> Only direct children become items. Grandchildren are not affected.</p>`],
["The two axes: the key idea",`<p>Every flex container has two invisible lines. The <b>main axis</b> is the direction the items flow. The <b>cross axis</b> runs across it at a right angle. By default the main axis runs left to right. <code>flex-direction: column</code> <b>swaps them</b>:</p><svg viewBox="0 0 560 190" style="width:100%;max-width:600px;height:auto;display:block;margin:10px auto" role="img" aria-label="With flex-direction row the main axis runs left to right. With column, the main axis runs top to bottom."><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d98a0b"/></marker></defs><g style="font:600 12px sans-serif;fill:var(--ink)"><text x="10" y="16">flex-direction: row</text><text x="290" y="16">flex-direction: column</text></g><rect x="10" y="24" width="230" height="110" rx="6" fill="none" stroke="#888" stroke-dasharray="5 4"/><g fill="rgba(60,120,220,.9)"><rect x="22" y="34" width="56" height="40" rx="4"/><rect x="88" y="34" width="56" height="64" rx="4"/><rect x="154" y="34" width="56" height="30" rx="4"/></g><g fill="#fff" style="font:700 13px sans-serif"><text x="46" y="58">1</text><text x="112" y="70">2</text><text x="178" y="53">3</text></g><line x1="14" y1="150" x2="236" y2="150" stroke="#d98a0b" stroke-width="3" marker-end="url(#ah)"/><text x="14" y="172" style="font:600 11px sans-serif;fill:var(--ink)">MAIN axis: items flow this way</text><line x1="250" y1="26" x2="250" y2="132" stroke="#2f9a5a" stroke-width="3" marker-end="url(#ah)"/><text x="238" y="180" style="font:600 11px sans-serif;fill:var(--ink)" opacity="0">.</text><rect x="290" y="24" width="230" height="110" rx="6" fill="none" stroke="#888" stroke-dasharray="5 4"/><g fill="rgba(60,120,220,.9)"><rect x="302" y="30" width="90" height="22" rx="4"/><rect x="302" y="58" width="140" height="22" rx="4"/><rect x="302" y="86" width="60" height="22" rx="4"/></g><line x1="540" y1="26" x2="540" y2="132" stroke="#d98a0b" stroke-width="3" marker-end="url(#ah)"/><line x1="294" y1="150" x2="516" y2="150" stroke="#2f9a5a" stroke-width="3" marker-end="url(#ah)"/><text x="294" y="172" style="font:600 11px sans-serif;fill:var(--ink)">CROSS axis (orange arrow = main)</text></svg><p>In the left picture the orange arrow is the main axis and the green arrow is the cross axis. In the right picture they have <b>traded places</b>. This matters because the two most-used properties each follow one axis:</p><ul><li><code>justify-content</code> positions items <b>along the main axis</b>.</li><li><code>align-items</code> positions items <b>along the cross axis</b>.</li></ul><div class="tip"><b>Memory trick:</b> <b>J</b>ustify goes the way the items <b>J</b>ourney (main). <b>A</b>lign goes <b>A</b>cross.</div>`],
["Playground: try every value",`<p>Change the settings and watch the five boxes. The code underneath updates as you go. Try these: set <code>justify-content</code> to <code>space-between</code>. Set <code>flex-direction</code> to <code>column</code> and see which property now moves things up and down. Set <code>flex-wrap</code> to <code>nowrap</code> and notice the boxes overflow, then switch to <code>wrap</code>.</p><div class="bmlab"><div class="fxp" id="fxp"><div>1</div><div>2<br>tall</div><div>3</div><div>4</div><div>5</div></div></div><div class="bmctl"><label>flex-direction <select data-fx="flexDirection"><option>row</option><option>row-reverse</option><option>column</option><option>column-reverse</option></select></label><label>justify-content <select data-fx="justifyContent"><option>flex-start</option><option>center</option><option>flex-end</option><option>space-between</option><option>space-around</option><option>space-evenly</option></select></label><label>align-items <select data-fx="alignItems"><option>stretch</option><option>flex-start</option><option>center</option><option>flex-end</option></select></label><label>flex-wrap <select data-fx="flexWrap"><option>nowrap</option><option>wrap</option></select></label><label>gap <input type="range" min="0" max="30" value="8" data-fx="gap" aria-label="Gap"><output id="o-gap">8px</output></label></div><pre class="pre" id="fxc">.container {\n  display: flex;\n  flex-direction: row;\n  justify-content: flex-start;\n  align-items: stretch;\n  flex-wrap: nowrap;\n  gap: 8px;\n}</pre>`],
["What each value does",`<ul><li><code>justify-content: flex-start</code> items bunch at the start. <code>center</code> in the middle. <code>flex-end</code> at the end.</li><li><code>space-between</code> first item at the start, last at the end, equal gaps between. <code>space-around</code> equal space around every item. <code>space-evenly</code> perfectly equal gaps everywhere, including the ends.</li><li><code>align-items: stretch</code> (the default) items grow to fill the cross axis. <code>flex-start</code>, <code>center</code> and <code>flex-end</code> keep each item its natural size.</li><li><code>gap: 12px</code> clean space between items, no margins needed.</li></ul><p><b>Perfect centring</b> is now two lines: <code>justify-content: center; align-items: center;</code> on a container that has a height.</p>`],
["Three classic mistakes",`<ol><li><b>Putting display: flex on the items</b> instead of the container.</li><li><b>Expecting vertical centring without a height.</b> A container only as tall as its content has no spare room to centre in. Give it a <code>height</code> or <code>min-height</code>.</li><li><b>Mixing up the axes</b> after switching to <code>column</code>, when justify and align swap their directions.</li></ol>`],
["Your turn",`<p>Edit the example: switch <code>justify-content</code> to each value and see the difference. Then switch to <code>flex-direction: column</code> and see what the two properties do now.</p>`]],
we:{t:"centring a box perfectly",s:[["Name the container and the item","<div class=\"stage\">     <- container\n  <div class=\"box\">...</div>   <- item\n</div>","The parent gets the orders. The child obeys."],["Turn the container into a flex container",".stage {\n  display: flex;\n}","Items now line up along the main axis."],["Centre on both axes, and give it height",".stage {\n  display: flex;\n  justify-content: center;  /* main axis */\n  align-items: center;      /* cross axis */\n  height: 200px;\n}","Without a height there is no spare room to centre in vertically."]]},
ps:[{p:"Put the lines in order: first the style block with one rule that makes .row a flex container, then the HTML. A rule opens with { and closes with }.",lines:["<style>","  .row {","    display: flex;","  }","</style>","<div class=\"row\">","  <div>A</div>","</div>"],h:"Style block first. Inside it: the selector and {, the declaration, then the closing }. Then the div."}],
ex:`<style>\n  .stage {\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    height: 180px;\n    background: #e4f2e7;\n    gap: 10px;\n  }\n  .box { background: gold; padding: 16px; border-radius: 8px; }\n</style>\n<div class="stage">\n  <div class="box">A</div>\n  <div class="box">B</div>\n  <div class="box">C</div>\n</div>`,
ch:[{p:"Centre the single .box in the middle of .stage, both horizontally and vertically. The stage is 200px tall.",st:`<style>\n  .stage { height: 200px; background: #e4f2e7; }\n  .box { background: gold; padding: 16px; width: 80px; }\n</style>\n<div class="stage"><div class="box">Centre me</div></div>`,k:`var s=getComputedStyle(document.querySelector('.stage'));return [["The stage is a flex container",s.display==="flex"],["justify-content is center",s.justifyContent==="center"],["align-items is center",s.alignItems==="center"]]`,h:"On .stage: display: flex; justify-content: center; align-items: center;",sol:`<style>\n  .stage { height: 200px; background: #e4f2e7; display: flex; justify-content: center; align-items: center; }\n  .box { background: gold; padding: 16px; width: 80px; }\n</style>\n<div class="stage"><div class="box">Centre me</div></div>`},
{p:"Make .nav a flex container with 16px between items, and push the first and last item to opposite ends.",st:`<style>\n  .nav { background: #10281a; color: white; padding: 10px; }\n</style>\n<div class="nav"><span>Logo</span><span>Home</span><span>Contact</span></div>`,k:`var s=getComputedStyle(document.querySelector('.nav'));return [["Flex container",s.display==="flex"],["Gap of 16px",s.columnGap==="16px"],["Items spread with space-between",s.justifyContent==="space-between"]]`,h:"display: flex; gap: 16px; justify-content: space-between;",sol:`<style>\n  .nav { background: #10281a; color: white; padding: 10px; display: flex; gap: 16px; justify-content: space-between; }\n</style>\n<div class="nav"><span>Logo</span><span>Home</span><span>Contact</span></div>`},
{ty:"Fix the bug",p:"The boxes will not sit in a row, because display: flex was put on the wrong element. Move it to the container and centre the row.",st:`<style>\n  .row { justify-content: center; }\n  .item { display: flex; background: gold; padding: 12px; }\n</style>\n<div class="row"><div class="item">1</div><div class="item">2</div><div class="item">3</div></div>`,k:`var r=getComputedStyle(document.querySelector('.row')),i=getComputedStyle(document.querySelector('.item'));return [["The container (.row) is flex",r.display==="flex"],["The items are not flex containers",i.display!=="flex"],["The row is centred",r.justifyContent==="center"]]`,h:"Move display: flex from .item to .row.",sol:`<style>\n  .row { display: flex; justify-content: center; }\n  .item { background: gold; padding: 12px; }\n</style>\n<div class="row"><div class="item">1</div><div class="item">2</div><div class="item">3</div></div>`}],
quiz:[["Which property positions items along the main axis?",["align-items","justify-content","gap"],1,"justify-content follows the main axis. align-items follows the cross axis."],["You set flex-direction: column. What happens to the axes?",["Nothing","The main axis becomes vertical and the cross axis horizontal","They are deleted"],1,"Column direction swaps the two axes."],["Where do you write display: flex?",["On each item","On the container (the parent)","On the body only"],1,"The container gets the orders, and its direct children obey."]]});

{t:"CSS: display and position",s:"How boxes sit on a page: in a line, on their own line, hidden, lifted out, or stuck to the screen.",time:35,
goals:["Use block, inline, inline-block and none","Explain the five position values","Place a badge in the corner of a card and keep a header stuck while scrolling"],
sec:[["display: how a box behaves",`<ul><li><code>block</code>: takes the full width and starts on a new line (p, div, h1).</li><li><code>inline</code>: sits in the flow of text, only as wide as its content. Width and height are ignored (span, a, strong).</li><li><code>inline-block</code>: sits in a line like inline, but accepts width, height and vertical margins. Good for buttons and tags.</li><li><code>none</code>: the element disappears completely, as if it was never in the page. (<code>visibility: hidden</code> hides it but keeps its space.)</li></ul>`],
["position: taking control",`<p>Normally boxes flow one after another: this is <code>position: static</code>, the default. The other values let you move things:</p><ul><li><code>relative</code>: stays in its place, but you can nudge it with <code>top</code>, <code>left</code> and so on. Its main job is to become the <b>reference point</b> for children.</li><li><code>absolute</code>: lifted out of the flow and placed using <code>top/right/bottom/left</code> measured from its <b>nearest positioned parent</b> (one with a position other than static). If there is none, from the page.</li><li><code>fixed</code>: placed relative to the screen, and it stays there when you scroll. Used for chat buttons.</li><li><code>sticky</code>: scrolls normally until it reaches a set edge, then sticks. Used for headers.</li></ul><div class="tip"><b>The golden pair:</b> put <code>position: relative</code> on the parent and <code>position: absolute</code> on the child, and the child is positioned inside the parent.</div>`],
["z-index and overflow",`<p>When boxes overlap, <code>z-index</code> decides who is on top. Higher number wins, and it only works on positioned elements. <code>overflow</code> says what happens to content bigger than its box: <code>visible</code> (spills out), <code>hidden</code> (cut off), <code>auto</code> (adds a scrollbar only if needed).</p>`],
["Your turn",`<p>Move the badge to <code>bottom: 8px; left: 8px</code>. Then remove <code>position: relative</code> from the card and see where the badge flies to.</p>`]],
ex:`<style>\n  .card { position: relative; width: 220px; padding: 20px; border: 2px solid #333; }\n  .badge { position: absolute; top: 8px; right: 8px; background: crimson; color: white; padding: 2px 8px; border-radius: 99px; }\n  .tag { display: inline-block; width: 80px; background: gold; text-align: center; }\n</style>\n<div class="card"><span class="badge">NEW</span><p>A card with a badge.</p></div>\n<p><span class="tag">one</span> <span class="tag">two</span></p>`,
ch:[{p:"Put the .badge in the top-right corner of the .card: the card must be the reference point, and the badge must be placed 10px from the top and 10px from the right.",st:`<style>\n  .card { width: 220px; height: 100px; border: 2px solid #333; }\n  .badge { background: crimson; color: white; padding: 2px 8px; }\n</style>\n<div class="card"><span class="badge">NEW</span></div>`,k:`var c=getComputedStyle(document.querySelector('.card')),b=getComputedStyle(document.querySelector('.badge'));return [["The card is position: relative",c.position==="relative"],["The badge is position: absolute",b.position==="absolute"],["10px from the top",b.top==="10px"],["10px from the right",b.right==="10px"]]`,h:".card { position: relative; }  .badge { position: absolute; top: 10px; right: 10px; }",sol:`<style>\n  .card { width: 220px; height: 100px; border: 2px solid #333; position: relative; }\n  .badge { background: crimson; color: white; padding: 2px 8px; position: absolute; top: 10px; right: 10px; }\n</style>\n<div class="card"><span class="badge">NEW</span></div>`},
{p:"Make the three .tag spans sit in a row, each exactly 80px wide, using display, and hide the .secret element completely.",st:`<style>\n  .tag { background: gold; }\n  .secret { }\n</style>\n<span class="tag">a</span><span class="tag">b</span><span class="tag">c</span>\n<p class="secret">Hidden text</p>`,k:`var t=getComputedStyle(document.querySelector('.tag'));return [["The tags are inline-block",t.display==="inline-block"],["The tags are 80px wide",t.width==="80px"],["The secret element has display none",getComputedStyle(document.querySelector('.secret')).display==="none"]]`,h:".tag { display: inline-block; width: 80px; }  .secret { display: none; }",sol:`<style>\n  .tag { background: gold; display: inline-block; width: 80px; }\n  .secret { display: none; }\n</style>\n<span class="tag">a</span><span class="tag">b</span><span class="tag">c</span>\n<p class="secret">Hidden text</p>`}],
quiz:[["An absolutely positioned child is placed relative to what?",["The screen always","Its nearest positioned parent","The previous sibling"],1,"The nearest ancestor with a position other than static, or the page if none."],["What is the difference between display: none and visibility: hidden?",["None","none removes the box and its space, hidden keeps the space","hidden removes the space"],1,"display: none removes the element completely. visibility: hidden only hides it."]]},

{t:"CSS: flexbox sizing and wrapping",s:"Now the items themselves: let them grow, shrink, wrap onto new lines, and be reordered.",time:35,
goals:["Explain flex-grow, flex-shrink and flex-basis with the free-space idea","Build equal columns and a fixed sidebar with a fluid main area","Wrap items and align one item differently"],
sec:[["Free space: the big idea",`<p>Picture a bookshelf 100cm long with three books on it. If the books add up to 70cm, there is <b>30cm of free space</b>. Flexbox gives you control of what to do with free space, and what to do when there is a shortage.</p><svg viewBox="0 0 560 170" style="width:100%;max-width:600px;height:auto;display:block;margin:10px auto" role="img" aria-label="A row with free space, and the same row after flex-grow shares the free space between items"><g style="font:600 12px sans-serif;fill:var(--ink)"><text x="10" y="16">Before: items take only what they need</text><text x="10" y="100">After: flex-grow: 1 on every item shares the free space</text></g><rect x="10" y="24" width="540" height="44" fill="rgba(217,138,11,.18)" stroke="#d98a0b" stroke-dasharray="5 4"/><rect x="10" y="24" width="110" height="44" fill="rgba(60,120,220,.9)"/><rect x="124" y="24" width="150" height="44" fill="rgba(60,120,220,.9)"/><rect x="278" y="24" width="90" height="44" fill="rgba(60,120,220,.9)"/><text x="440" y="51" style="font:600 12px sans-serif;fill:var(--ink)">free space</text><rect x="10" y="108" width="540" height="44" fill="none" stroke="#d98a0b" stroke-dasharray="5 4"/><rect x="10" y="108" width="178" height="44" fill="rgba(60,120,220,.9)"/><rect x="192" y="108" width="178" height="44" fill="rgba(60,120,220,.9)"/><rect x="374" y="108" width="176" height="44" fill="rgba(60,120,220,.9)"/></svg><ul><li><code>flex-grow</code>: how big a <b>share of the free space</b> this item takes. The default 0 means “none, keep my size”. If every item has 1, they share equally. An item with 2 takes twice the share of one with 1.</li><li><code>flex-shrink</code>: how willing the item is to get smaller when there is a shortage. The default is 1 (“yes, a bit”). 0 means “never shrink”.</li><li><code>flex-basis</code>: the size the item starts from, before sharing. It is like <code>width</code> along the main axis.</li></ul>`],
["The shorthand you will really use",`<ul><li><code>flex: 1</code> means “grow equally, start from nothing”. Give it to every item and you get <b>equal columns</b>.</li><li><code>flex: 0 0 200px</code> means “do not grow, do not shrink, be exactly 200px”. A fixed-size item.</li><li>Combine them: a sidebar with <code>flex: 0 0 200px</code> and a main area with <code>flex: 1</code> gives a layout where the main area takes <b>whatever is left over</b>.</li></ul>`],
["Wrapping, align-self and order",`<ul><li><code>flex-wrap: wrap</code> lets items drop onto a new line when they run out of room, instead of squeezing or overflowing.</li><li><code>align-self</code> on <b>one item</b> overrides the container’s <code>align-items</code> for that item alone, for example <code>align-self: flex-end</code>.</li><li><code>order</code> changes the visual order of items without touching the HTML. The default is 0 and lower numbers come first. Use it sparingly: keyboard and screen-reader users still follow the HTML order.</li></ul>`],
["Your turn",`<p>Change the sidebar to <code>flex: 1</code> and watch the layout become equal. Then add <code>align-self: center</code> to one box.</p>`]],
ex:`<style>\n  .layout { display: flex; gap: 10px; height: 120px; }\n  .side { flex: 0 0 120px; background: gold; padding: 10px; }\n  .main { flex: 1; background: #cfe3d4; padding: 10px; }\n</style>\n<div class="layout">\n  <div class="side">Fixed 120px</div>\n  <div class="main">Takes everything that is left</div>\n</div>`,
ch:[{p:"Make the three .col boxes equal-width columns that share the row, using the flex shorthand on each .col.",st:`<style>\n  .row { display: flex; gap: 10px; }\n  .col { background: gold; padding: 10px; }\n</style>\n<div class="row"><div class="col">A</div><div class="col">B</div><div class="col">C</div></div>`,k:`var s=getComputedStyle(document.querySelector('.col'));return [["Each column grows (flex-grow 1)",s.flexGrow==="1"]]`,h:".col { flex: 1; }",sol:`<style>\n  .row { display: flex; gap: 10px; }\n  .col { background: gold; padding: 10px; flex: 1; }\n</style>\n<div class="row"><div class="col">A</div><div class="col">B</div><div class="col">C</div></div>`},
{p:"Build a fixed 200px sidebar that never shrinks, next to a main area that takes all the remaining width.",st:`<style>\n  .layout { display: flex; }\n  .side { background: gold; }\n  .main { background: #cfe3d4; }\n</style>\n<div class="layout"><div class="side">Side</div><div class="main">Main</div></div>`,k:`var a=getComputedStyle(document.querySelector('.side')),b=getComputedStyle(document.querySelector('.main'));return [["The sidebar does not grow",a.flexGrow==="0"],["The sidebar does not shrink",a.flexShrink==="0"],["The sidebar is 200px",a.flexBasis==="200px"],["The main area grows",b.flexGrow==="1"]]`,h:".side { flex: 0 0 200px; }   .main { flex: 1; }",sol:`<style>\n  .layout { display: flex; }\n  .side { background: gold; flex: 0 0 200px; }\n  .main { background: #cfe3d4; flex: 1; }\n</style>\n<div class="layout"><div class="side">Side</div><div class="main">Main</div></div>`},
{p:"The six cards are 150px wide and spill out of their row. Let them wrap onto new lines.",st:`<style>\n  .cards { display: flex; gap: 8px; width: 400px; }\n  .card { flex: none; width: 150px; background: gold; padding: 10px; }\n</style>\n<div class="cards"><div class="card">1</div><div class="card">2</div><div class="card">3</div><div class="card">4</div><div class="card">5</div><div class="card">6</div></div>`,k:`return [["The container wraps",getComputedStyle(document.querySelector('.cards')).flexWrap==="wrap"]]`,h:"Add flex-wrap: wrap; to .cards.",sol:`<style>\n  .cards { display: flex; gap: 8px; width: 400px; flex-wrap: wrap; }\n  .card { flex: none; width: 150px; background: gold; padding: 10px; }\n</style>\n<div class="cards"><div class="card">1</div><div class="card">2</div><div class="card">3</div><div class="card">4</div><div class="card">5</div><div class="card">6</div></div>`}],
quiz:[["Every item has flex: 1. What happens?",["They overlap","They share the row in equal widths","They shrink to nothing"],1,"flex: 1 on every item gives equal columns."],["What does flex: 0 0 200px mean?",["Do not grow, do not shrink, be 200px","Grow twice","Hide the item"],0,"Grow 0, shrink 0, basis 200px: a fixed-size item."]]},

{t:"CSS: flexbox patterns",s:"The five layouts you will build over and over: navbar, centred hero, card row, sidebar layout and sticky footer.",time:35,
goals:["Build a navbar with the logo on one side and links on the other","Keep a footer at the bottom of a short page","Choose the right flexbox recipe for a layout problem"],
sec:[["Pattern 1: navbar",`<p>Logo on the left, links on the right. Make the nav a flex container and push the links over with an <b>auto margin</b>. An auto margin in flexbox swallows all the free space on its side.</p><pre class="pre">nav { display: flex; align-items: center; gap: 16px; }\n.logo { margin-right: auto; }</pre>`],
["Pattern 2: card row",`<pre class="pre">.cards { display: flex; flex-wrap: wrap; gap: 16px; }\n.card { flex: 1 1 200px; }</pre><p><code>flex: 1 1 200px</code> reads: “start at 200px, grow to share space, shrink if needed”. Cards fill each row evenly and wrap on small screens, with no media query.</p>`],
["Pattern 3: sticky footer",`<p>On a short page the footer floats up in the middle of the screen. The fix: make the body a column that is at least as tall as the screen, and let the main area grow.</p><pre class="pre">body { display: flex; flex-direction: column; min-height: 100vh; }\nmain { flex: 1; }</pre><p><code>main</code> takes all the free height, and pushes the footer to the bottom.</p>`],
["Pattern 4 and 5",`<ul><li><b>Sidebar layout:</b> <code>.side { flex: 0 0 220px; }</code> and <code>.main { flex: 1; }</code>, as in the last lesson.</li><li><b>Centred hero:</b> <code>display: flex; justify-content: center; align-items: center; min-height: 60vh; flex-direction: column;</code></li></ul><div class="tip"><b>When flexbox is not enough:</b> flexbox arranges in <b>one direction</b>, a row or a column. For layouts in rows <i>and</i> columns at once, like a photo gallery, CSS Grid, coming soon in this course, is the better tool.</div>`],
["Your turn",`<p>Add a few more paragraphs to the main area and watch the footer follow. Delete the text and see it stay at the bottom.</p>`]],
ex:`<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; display: flex; flex-direction: column; min-height: 100vh; font-family: sans-serif; }\n  nav { display: flex; align-items: center; gap: 16px; padding: 12px; background: #10281a; color: white; }\n  .logo { margin-right: auto; font-weight: 800; }\n  main { flex: 1; padding: 16px; }\n  footer { padding: 12px; background: #ddd; }\n</style>\n<nav><span class="logo">MyLogo</span><a href="#">Home</a><a href="#">About</a></nav>\n<main><p>Short page content.</p></main>\n<footer>Footer stays at the bottom</footer>`,
ch:[{p:"Build a navbar: .nav is a flex container with the items vertically centred and 16px between them, and the .logo is pushed to the left with an auto margin so the links sit on the right.",st:`<style>\n  .nav { background: #10281a; color: white; padding: 10px; }\n  .nav a { color: white; }\n</style>\n<div class="nav"><span class="logo">Logo</span><a href="#">Home</a><a href="#">About</a><a href="#">Contact</a></div>`,k:`var n=getComputedStyle(document.querySelector('.nav')),l=getComputedStyle(document.querySelector('.logo'));return [["The nav is a flex container",n.display==="flex"],["Items are centred on the cross axis",n.alignItems==="center"],["A gap of 16px",n.columnGap==="16px"],["The logo has an auto right margin",l.marginRight==="auto"||(l.marginRight!=="0px"&&parseFloat(l.marginRight)>20)]]`,h:".nav { display: flex; align-items: center; gap: 16px; }   .logo { margin-right: auto; }",sol:`<style>\n  .nav { background: #10281a; color: white; padding: 10px; display: flex; align-items: center; gap: 16px; }\n  .nav a { color: white; }\n  .logo { margin-right: auto; }\n</style>\n<div class="nav"><span class="logo">Logo</span><a href="#">Home</a><a href="#">About</a><a href="#">Contact</a></div>`},
{p:"Make the footer stick to the bottom of a short page: the body is a column flex container at least 100vh tall, and main takes the free space.",st:`<style>\n  body { margin: 0; }\n  footer { background: #ddd; padding: 10px; }\n</style>\n<main><p>Short page</p></main>\n<footer>Footer</footer>`,k:`var b=getComputedStyle(document.body),m=getComputedStyle(document.querySelector('main'));return [["The body is a flex container",b.display==="flex"],["The body flows in a column",b.flexDirection==="column"],["The body is at least the screen height",b.minHeight==="100vh"||parseFloat(b.minHeight)>100],["main grows to fill the space",m.flexGrow==="1"]]`,h:"body { display: flex; flex-direction: column; min-height: 100vh; }   main { flex: 1; }",sol:`<style>\n  body { margin: 0; display: flex; flex-direction: column; min-height: 100vh; }\n  main { flex: 1; }\n  footer { background: #ddd; padding: 10px; }\n</style>\n<main><p>Short page</p></main>\n<footer>Footer</footer>`}],
quiz:[["What does an auto margin do in a flex container?",["Nothing","Takes all the free space on its side, pushing the item away","Centres the text"],1,"An auto margin absorbs the free space, which pushes an item to the far side."],["What keeps a footer at the bottom of a short page?",["A column flex body with min-height 100vh and main with flex: 1","A bigger font","position: static"],0,"The main area grows and pushes the footer down."]]}
];

const RSDOC='<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif}.w{padding:8px;font-weight:700}.cols{display:grid;gap:8px;padding:8px;grid-template-columns:1fr}.c{background:#2f6fdc;color:#fff;padding:14px;border-radius:6px;text-align:center}@media (min-width:500px){.cols{grid-template-columns:1fr 1fr}}@media (min-width:760px){.cols{grid-template-columns:1fr 1fr 1fr}}</style><div class="w" id="w"></div><div class="cols"><div class="c">1</div><div class="c">2</div><div class="c">3</div><div class="c">4</div><div class="c">5</div><div class="c">6</div></div><script>function u(){document.getElementById("w").textContent="Screen width: "+innerWidth+"px"}u();addEventListener("resize",u)<\/script>';

{t:"CSS Grid: rows, columns and fr",s:"Flexbox arranges things in one direction. Grid arranges them in rows and columns at the same time, like a spreadsheet.",time:40,
goals:["Explain when to choose grid and when to choose flexbox","Make columns with grid-template-columns, fr and repeat()","Read grid line numbers and make an item span several columns"],
sec:[["One direction or two?",`<p>Think of a cinema. <b>Flexbox</b> is a single row of seats: it controls one line. <b>Grid</b> is the whole auditorium: rows <i>and</i> columns together. When your layout has both, like a photo gallery or a whole page, grid is the right tool.</p><p>Like flexbox, grid has a <b>container</b> (<code>display: grid</code>) and <b>items</b> (its direct children). You describe the columns, and the rows build themselves as items are added.</p>`],
["Columns, fr and repeat",`<ul><li><code>grid-template-columns: 200px 200px 200px;</code> makes three columns of 200px.</li><li>The <b><code>fr</code> unit</b> means a <b>fraction of the free space</b>, just like flex-grow. <code>1fr 1fr 1fr</code> makes three equal columns. <code>1fr 2fr</code> makes the second twice as wide as the first.</li><li>Mix freely: <code>200px 1fr</code> is a fixed sidebar and a main area that takes the rest.</li><li><code>repeat(3, 1fr)</code> is a shortcut for <code>1fr 1fr 1fr</code>.</li><li><code>gap: 12px</code> puts clean space between rows and columns.</li><li>Rows: <code>grid-auto-rows: 100px</code> gives every row that height. <code>minmax(100px, auto)</code> means at least 100px, taller if the content needs it.</li></ul>`],
["Grid lines and spanning",`<p>A grid is drawn with <b>lines</b>, and the lines are numbered, starting from 1. Three columns have <b>four</b> vertical lines. You place an item by saying which lines it runs between.</p><svg viewBox="0 0 520 200" style="width:100%;max-width:560px;height:auto;display:block;margin:10px auto" role="img" aria-label="A grid of three columns and two rows with numbered lines. One item spans from column line 1 to column line 3."><g style="font:700 13px sans-serif;fill:var(--ink)"><text x="56" y="20">1</text><text x="196" y="20">2</text><text x="336" y="20">3</text><text x="476" y="20">4</text><text x="36" y="34">1</text><text x="36" y="104">2</text><text x="36" y="174">3</text></g><rect x="60" y="30" width="420" height="140" fill="none" stroke="#888"/><g stroke="#888" stroke-dasharray="4 4"><line x1="200" y1="30" x2="200" y2="170"/><line x1="340" y1="30" x2="340" y2="170"/><line x1="60" y1="100" x2="480" y2="100"/></g><rect x="64" y="34" width="272" height="62" rx="5" fill="rgba(60,120,220,.9)"/><text x="200" y="70" text-anchor="middle" fill="#fff" style="font:700 13px sans-serif">grid-column: 1 / 3</text><g fill="rgba(217,138,11,.35)"><rect x="344" y="34" width="132" height="62" rx="5"/><rect x="64" y="104" width="132" height="62" rx="5"/><rect x="204" y="104" width="132" height="62" rx="5"/><rect x="344" y="104" width="132" height="62" rx="5"/></g></svg><p>The blue item runs <b>from line 1 to line 3</b>, so it covers two columns: <code>grid-column: 1 / 3;</code>. Shorter: <code>grid-column: span 2;</code> (“take two columns”). To stretch across the whole row whatever the column count, use <code>grid-column: 1 / -1;</code>, because <code>-1</code> means the last line.</p>`],
["Playground",`<p>Choose a column pattern and watch the six boxes rearrange. Try the last option, then drag the gap slider.</p><div class="bmlab"><div class="gdp" id="gdp"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div></div><div class="bmctl"><label>columns <select data-gd="gridTemplateColumns"><option>1fr 1fr 1fr</option><option>1fr 2fr</option><option>100px 1fr</option><option>repeat(2, 1fr)</option><option>repeat(auto-fit, minmax(90px, 1fr))</option></select></label><label>justify-items <select data-gd="justifyItems"><option>stretch</option><option>start</option><option>center</option><option>end</option></select></label><label>gap <input type="range" min="0" max="30" value="8" data-gd="gap" aria-label="Gap"><output id="o-gd">8px</output></label></div><pre class="pre" id="gdc">.gallery {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  justify-items: stretch;\n  gap: 8px;\n}</pre>`],
["Grid or flexbox?",`<ul><li><b>Flexbox:</b> one direction, and the content decides the sizes. Navbars, button rows, centring.</li><li><b>Grid:</b> two directions, and the layout decides the sizes. Galleries, dashboards, whole pages.</li><li>They team up: grid for the page, flexbox inside each card.</li></ul>`],
["Your turn",`<p>Change the number of columns, then make box 1 span two columns with <code>grid-column: span 2</code>.</p>`]],
we:{t:"building a three-column gallery",s:[["Make the grid container",".gallery {\n  display: grid;\n}","The children become grid items, but with no columns defined they stack in one."],["Describe the columns",".gallery {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n}","Three equal columns. Rows appear automatically as items fill them."],["Add the gap and one wide item",".gallery { gap: 12px; }\n.wide { grid-column: span 2; }","Gap spaces everything. span 2 makes one item take two columns."]]},
ex:`<style>\n  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n  .gallery div { background: gold; padding: 24px 8px; text-align: center; border-radius: 8px; }\n  .wide { grid-column: span 2; background: #cfe3d4 !important; }\n</style>\n<div class="gallery">\n  <div class="wide">Wide</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div>\n</div>`,
ch:[{p:"Make .gallery a grid of exactly three equal columns, with a 12px gap.",st:`<style>\n  .gallery { }\n  .gallery div { background: gold; padding: 16px; }\n</style>\n<div class="gallery"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>`,k:`var s=getComputedStyle(document.querySelector('.gallery'));var c=s.gridTemplateColumns.trim(),rep=c.indexOf('repeat')===0,v=c.split(/\\s+/),n=rep?parseInt(c.slice(7)):v.length,eq=rep||v.every(function(x){return x===v[0]});return [["The gallery is a grid",s.display==="grid"],["There are three columns",n===3],["The columns are equal",eq],["The gap is 12px",s.columnGap==="12px"]]`,h:"display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;",sol:`<style>\n  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }\n  .gallery div { background: gold; padding: 16px; }\n</style>\n<div class="gallery"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>`},

{t:"CSS Grid: page layouts and responsive grids",s:"Name the areas of a page and draw the layout like a map, then build a grid that rearranges itself on any screen with one line.",time:35,
goals:["Lay out a whole page with grid-template-areas","Make a gallery that adapts with repeat, auto-fit and minmax","Align items inside grid cells"],
sec:[["Drawing the page as a map",`<p>With <code>grid-template-areas</code> you literally <b>draw the layout in text</b>. Each quoted string is a row, and each word is a cell. Repeat a word to make an area span several cells.</p><svg viewBox="0 0 520 216" style="width:100%;max-width:560px;height:auto;display:block;margin:10px auto" role="img" aria-label="A page layout with a header across the top, a sidebar and main area in the middle, and a footer across the bottom"><g font-family="sans-serif" font-weight="700" font-size="14" fill="#fff" text-anchor="middle"><rect x="10" y="10" width="500" height="40" rx="5" fill="#2f6fdc"/><text x="260" y="36">header</text><rect x="10" y="56" width="120" height="110" rx="5" fill="#2f9a5a"/><text x="70" y="116">sidebar</text><rect x="136" y="56" width="374" height="110" rx="5" fill="#d98a0b"/><text x="323" y="116">main</text><rect x="10" y="172" width="500" height="34" rx="5" fill="#7a5a2b"/><text x="260" y="194">footer</text></g></svg><pre class="pre">.page {\n  display: grid;\n  grid-template-columns: 200px 1fr;\n  grid-template-areas:\n    "header header"\n    "sidebar main"\n    "footer footer";\n}\n.header  { grid-area: header; }\n.sidebar { grid-area: sidebar; }\n.main    { grid-area: main; }\n.footer  { grid-area: footer; }</pre><p>Read the strings like a floor plan: the header takes both columns of the first row, and so on. Each item then says which area it lives in with <code>grid-area</code>. To rearrange the page for phones, you only redraw the strings.</p>`],
["A gallery that adapts itself",`<p>One line makes a grid that needs no media queries:</p><p><code>grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));</code></p><p>Read it from the inside: <code>minmax(200px, 1fr)</code> means “each column is at least 200px, and may grow to share the space”. <code>repeat(auto-fit, ...)</code> means “fit as many such columns as the container allows”. On a wide screen you get five columns. On a phone, one. The browser does the sums.</p>`],
["Aligning inside cells",`<ul><li><code>justify-items</code> aligns items left-to-right inside their cells. <code>align-items</code> aligns them top-to-bottom. Values: <code>start</code>, <code>center</code>, <code>end</code>, <code>stretch</code>.</li><li><code>place-items: center</code> does both at once: perfect centring in every cell.</li><li><code>justify-content</code> and <code>align-content</code> position the <b>whole grid</b> inside its container when the columns are narrower than the container.</li><li>One item only: <code>justify-self</code>, <code>align-self</code>, or <code>place-self</code>.</li></ul>`],
["Your turn",`<p>Move the sidebar to the right by swapping the words in the middle row, then change 200px to 120px.</p>`]],
ex:`<style>\n  .page { display: grid; grid-template-columns: 120px 1fr; grid-template-areas: "header header" "sidebar main" "footer footer"; gap: 8px; }\n  .page > div { padding: 14px; border-radius: 6px; color: white; font-weight: 700; }\n  .header { grid-area: header; background: #2f6fdc; }\n  .sidebar { grid-area: sidebar; background: #2f9a5a; }\n  .main { grid-area: main; background: #d98a0b; min-height: 80px; }\n  .footer { grid-area: footer; background: #7a5a2b; }\n</style>\n<div class="page"><div class="header">Header</div><div class="sidebar">Side</div><div class="main">Main</div><div class="footer">Footer</div></div>`,
ch:[{p:"Lay out the page with grid-template-areas: header and footer across both columns, sidebar and main in the middle row. Give each item its grid-area.",st:`<style>\n  .page { display: grid; grid-template-columns: 150px 1fr; gap: 8px; }\n  .page > div { background: gold; padding: 12px; }\n  /* add your areas and grid-area rules */\n</style>\n<div class="page"><div class="header">H</div><div class="sidebar">S</div><div class="main">M</div><div class="footer">F</div></div>`,k:`var t=document.querySelector('style').textContent;return [["The page uses grid-template-areas",/grid-template-areas/.test(t)],["header has grid-area: header",/\\.header\\s*\\{[^}]*grid-area\\s*:\\s*header/.test(t)],["sidebar has grid-area: sidebar",/\\.sidebar\\s*\\{[^}]*grid-area\\s*:\\s*sidebar/.test(t)],["main has grid-area: main",/\\.main\\s*\\{[^}]*grid-area\\s*:\\s*main/.test(t)],["footer has grid-area: footer",/\\.footer\\s*\\{[^}]*grid-area\\s*:\\s*footer/.test(t)]]`,h:"Add grid-template-areas: \"header header\" \"sidebar main\" \"footer footer\"; to .page, then .header { grid-area: header; } and so on.",sol:`<style>\n  .page { display: grid; grid-template-columns: 150px 1fr; gap: 8px; grid-template-areas: "header header" "sidebar main" "footer footer"; }\n  .page > div { background: gold; padding: 12px; }\n  .header { grid-area: header; }\n  .sidebar { grid-area: sidebar; }\n  .main { grid-area: main; }\n  .footer { grid-area: footer; }\n</style>\n<div class="page"><div class="header">H</div><div class="sidebar">S</div><div class="main">M</div><div class="footer">F</div></div>`},
{p:"Make a gallery that fits as many columns as possible, each at least 150px wide, sharing the free space, with a 10px gap. Use repeat, auto-fit and minmax.",st:`<style>\n  .gallery { }\n  .gallery div { background: gold; padding: 16px; }\n</style>\n<div class="gallery"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div>`,k:`var t=document.querySelector('style').textContent,s=getComputedStyle(document.querySelector('.gallery'));return [["The gallery is a grid",s.display==="grid"],["It uses repeat(auto-fit, minmax(150px, 1fr))",/repeat\\(\\s*auto-fit\\s*,\\s*minmax\\(\\s*150px\\s*,\\s*1fr\\s*\\)\\s*\\)/.test(t)],["The gap is 10px",s.columnGap==="10px"]]`,h:"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;",sol:`<style>\n  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }\n  .gallery div { background: gold; padding: 16px; }\n</style>\n<div class="gallery"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div>`}],
quiz:[["In grid-template-areas, what does one quoted string represent?",["One column","One row","One item"],1,"Each string is a row. Each word in it is a cell."],["What does minmax(200px, 1fr) mean?",["At least 200px, and may grow to share space","Exactly 200px","At most 200px"],0,"The column is never narrower than 200px but can grow."]]},

{t:"CSS: responsive design and media queries",s:"Make one page look right on a phone, a tablet and a laptop, by changing the layout at the points where it starts to break.",time:35,
goals:["Explain what responsive design is and why mobile-first works","Write a media query with min-width","Test a layout at different screen widths"],
sec:[["One page, every screen",`<p>People open your page on a small phone, a tablet, a laptop and a huge monitor. <b>Responsive design</b> means the same page adapts to every one of them, instead of you building separate sites. You already know several tools: percentage widths, <code>max-width</code>, <code>flex-wrap</code> and the <code>auto-fit</code> grid. For the rest, there are <b>media queries</b>. Remember the viewport meta tag in the head, too. Without it, phones pretend to be wide and shrink everything.</p>`],
["Mobile-first",`<p>Write the <b>small-screen</b> layout first as your normal CSS, usually one simple column. Then add extra rules that apply only on <b>wider</b> screens. This is called <b>mobile-first</b>. It works better than starting wide, because a phone layout is simple, most visitors are on phones, and you only <i>add</i> complexity when there is room.</p>`],
["Media queries",`<p>A media query wraps rules that only apply when a condition is true:</p><pre class="pre">.cols { display: grid; grid-template-columns: 1fr; }\n\n@media (min-width: 600px) {\n  .cols { grid-template-columns: 1fr 1fr; }\n}</pre><p>Read it as: “Always use one column. <b>When the screen is at least 600px wide</b>, use two instead.” The rule inside overrides the earlier one, because it comes later.</p><ul><li><b>Breakpoints</b> are the widths where you switch. Common values are 600px, 900px and 1200px. Better still, <b>stretch your page and add a breakpoint where it starts to look bad</b>, rather than chasing device sizes.</li><li><code>min-width</code> means “this wide or wider”. <code>max-width</code> means “this wide or narrower”. Mobile-first uses min-width.</li><li>Queries can ask other questions too: <code>(prefers-color-scheme: dark)</code> for dark mode, <code>(prefers-reduced-motion: reduce)</code> for people who dislike animation, and <code>print</code>.</li></ul>`],
["Try it: resize a screen",`<p>Drag the slider to change the width of the pretend phone below. The page inside is the same one, with two media queries. Watch the number of columns change at <b>500px</b> and again at <b>760px</b>.</p><div class="bmctl"><label>screen width <input type="range" min="280" max="900" value="360" data-rs="w" aria-label="Screen width"><output id="o-rs">360px</output></label></div><div class="rsw"><iframe id="rsf" sandbox="allow-scripts" title="Responsive preview"></iframe></div><div class="tip"><b>On a real site:</b> in your browser, open Inspect and turn on the device toolbar (the phone-and-tablet icon). You can then pick a device or drag the width, exactly like this.</div>`],
["Your turn",`<p>Change the breakpoint from 600px to 400px, and add a second query that makes three columns from 900px.</p>`]],
ex:`<style>\n  * { box-sizing: border-box; }\n  .cols { display: grid; gap: 8px; grid-template-columns: 1fr; }\n  .cols div { background: gold; padding: 18px; text-align: center; }\n  @media (min-width: 400px) {\n    .cols { grid-template-columns: 1fr 1fr; }\n  }\n</style>\n<div class="cols"><div>1</div><div>2</div><div>3</div><div>4</div></div>`,
ch:[{p:"Build mobile-first: .cols is a grid with ONE column by default. Add a media query for screens at least 600px wide that switches it to THREE equal columns.",st:`<style>\n  .cols div { background: gold; padding: 16px; }\n  /* your CSS here */\n</style>\n<div class="cols"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>`,k:`var base=false,mq=false,mqq=false;for(var i=0;i<document.styleSheets.length;i++){var rs=document.styleSheets[i].cssRules;for(var j=0;j<rs.length;j++){var r=rs[j];if(r.media){if(/min-width\\s*:\\s*600px/.test(r.media.mediaText)){mq=true;for(var k=0;k<r.cssRules.length;k++){if(/\\.cols/.test(r.cssRules[k].selectorText)&&/grid-template-columns/.test(r.cssRules[k].cssText)&&/(repeat\\(\\s*3|1fr\\s+1fr\\s+1fr)/.test(r.cssRules[k].cssText))mqq=true}}}else if(/^\\.cols$/.test(r.selectorText)&&/display:\\s*grid/.test(r.cssText)&&/grid-template-columns:\\s*1fr\\s*;/.test(r.cssText))base=true}}return [["By default .cols is a grid with one column",base],["There is a media query with min-width: 600px",mq],["Inside it, .cols gets three columns",mqq]]`,h:".cols { display: grid; grid-template-columns: 1fr; }  then  @media (min-width: 600px) { .cols { grid-template-columns: repeat(3, 1fr); } }",sol:`<style>\n  .cols div { background: gold; padding: 16px; }\n  .cols { display: grid; gap: 8px; grid-template-columns: 1fr; }\n  @media (min-width: 600px) {\n    .cols { grid-template-columns: repeat(3, 1fr); }\n  }\n</style>\n<div class="cols"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>`}],
quiz:[["What does mobile-first mean?",["Only phones are supported","Write the small-screen layout first, then add rules for wider screens","Put mobile in the title"],1,"Start with the simple small layout, and use min-width queries to add complexity."],["What does @media (min-width: 600px) mean?",["Applies when the screen is 600px wide or wider","Applies when it is exactly 600px","Applies when it is narrower than 600px"],0,"min-width means this width or wider."]]}
];
